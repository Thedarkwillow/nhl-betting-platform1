name: Public non-Cito contextual esports and NHL evaluation
on:
  pull_request:
    paths:
      - 'scripts/esports_context_models.py'
      - 'scripts/esports_exposure_research.py'
      - 'test/test_esports_exposure_research.py'
      - 'scripts/public_cod_wiki_history.py'
      - 'scripts/public-opencs2-map-baseline.py'
      - 'scripts/public-six-esports-history.py'
      - 'scripts/public-eight-free-history.py'
      - 'test/test_esports_context_models.py'
      - '.github/workflows/public-non-cito-context.yml'
  push:
    branches: [main]
    paths: ['.github/workflows/public-non-cito-context.yml','scripts/esports_context_models.py','scripts/public-six-esports-history.py','scripts/esports_exposure_research.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s test -p test_esports_context_models.py
      - run: python3 -m unittest discover -s test -p test_esports_exposure_research.py
      - run: python3 -m unittest discover -s test -p test_opencs2_map_baseline.py
      - run: python3 -m py_compile scripts/public-six-esports-history.py scripts/public-eight-free-history.py scripts/public-opencs2-map-baseline.py
      - run: node --test test/esports-research-v1.test.cjs test/esports-authenticated-export.test.cjs test/nhl-standard-triple-challenger.test.cjs test/nhl-sog-opportunity-challengers.test.cjs
      - run: node --check assets/public-multi-sport-sprint.js
  contextual-history:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        sport: [cs2, valorant-dota, lol, cod]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==19.0.1 duckdb==1.4.1
      - name: Run bounded non-Cito historical source research
        env:
          SPORT: ${{ matrix.sport }}
        run: |
          set -euo pipefail
          case "$SPORT" in
            cs2) python scripts/public-opencs2-map-baseline.py ;;
            valorant-dota) python scripts/public-six-esports-history.py ;;
            lol) python -c 'import sys,json;sys.path.insert(0,"scripts");import importlib;print(json.dumps(importlib.import_module("public-eight-free-history").lol()))' ;;
            cod) python scripts/public_cod_wiki_history.py ;;
          esac
  archive-research:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: archive
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original archive research with public code, no raw output
        run: |
          set -euo pipefail
          umask 077
          export RESEARCH_ARCHIVE_ROOT="$GITHUB_WORKSPACE/archive"
          for s in report-nhl-standard-triple-challengers report-nhl-standard-quality-retro; do
            log="$RUNNER_TEMP/$s"
            node "public/scripts/$s.cjs" >"$log" 2>&1 || { echo "$s failed"; exit 1; }
            node - "$log" <<'NODE'
          const x=JSON.parse(require("fs").readFileSync(process.argv[2],"utf8"));
          if(x.modelPromoted===true||x.bettingRecommendationsApproved===true)throw Error("Unexpected promotion");
          console.log(JSON.stringify(x));
          NODE
          done
          node public/scripts/public-eight-evidence.cjs esports archive
          node public/scripts/public-workflow-migration-inventory.cjs

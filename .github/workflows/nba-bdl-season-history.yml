name: Collect free NBA historical season schedule
on:
  push:
    branches: [nba-bdl-season-history-20261124]
    paths: ['.github/workflows/nba-bdl-season-history.yml']
permissions:
  contents: read
concurrency:
  group: nba-bdl-historical-season
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load pinned schedule collector and validate
        run: |
          set -euo pipefail
          git fetch -q origin df6f775c77a92698da88c6b109d104bdbb87460a
          git show FETCH_HEAD:scripts/collect-nba-bdl-historical-schedule.cjs > scripts/collect-nba-bdl-historical-schedule.cjs
          git show FETCH_HEAD:test/nba-bdl-historical-schedule.test.cjs > test/nba-bdl-historical-schedule.test.cjs
          node --test test/nba-bdl-historical-schedule.test.cjs
      - name: Collect free source schedule only
        env:
          NBA_BALLDONTLIE_API_KEY: ${{ secrets.NBA_BALLDONTLIE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/collect-nba-bdl-historical-schedule.cjs
      - name: Preserve private schedule archive only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nba/authorized-providers/bdl-history
          git diff --cached --quiet && exit 0
          git commit -qm 'research: archive BDL historical season schedule'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1

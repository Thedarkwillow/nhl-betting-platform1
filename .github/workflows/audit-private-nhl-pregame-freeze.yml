name: Audit private NHL prospective research freeze Git proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-private-nhl-pregame-freeze.yml']
  schedule:
    - cron: '25 14 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
jobs:
  validate-remote-git-precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require private access token
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::No private repository access token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original private Git addition, time, game identity and chronology
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const root='outputs/research/snapshots';
          const names=fs.readdirSync(root).filter(n=>/^\d{8}T\d{6}Z\.json$/.test(n)).sort();
          if(!names.length)throw Error('No original NHL research freezes on private main');
          const file=root+'/'+names[names.length-1];
          const s=JSON.parse(fs.readFileSync(file,'utf8'));
          const selected=s.individualPropSelections;
          if(!Array.isArray(selected)||!selected.length||
             s.individualPropSelectionPolicy!=='nhl-individual-prop-max-available-direction-v1')
            throw Error('No new explicitly recorded NHL pregame selections');
          const added=execFileSync('git',['log','--diff-filter=A','-1','--format=%cI','--',file],{encoding:'utf8'}).trim();
          const count=Number(execFileSync('git',['rev-list','--count','HEAD','--',file],{encoding:'utf8'}).trim());
          const commitAt=Date.parse(added),modelAt=Date.parse(s.projectionBuiltAt),
           generated=Date.parse(s.generatedAt),capture=Date.parse(s.boardAsOfAt);
          if(!Number.isFinite(commitAt)||count!==1||!Number.isFinite(generated)||
             !Number.isFinite(capture)||!Number.isFinite(modelAt)||modelAt>capture||
             capture>generated||
             // Git committer dates have SECOND precision, snapshot timestamps
             // retain milliseconds; accept only the SAME truncated second.
             generated>commitAt&&Math.floor(generated/1000)!==Math.floor(commitAt/1000)||
             generated-capture>30*60000)
            throw Error('Original private Git provenance / frozen source timing invalid');
          const official=JSON.parse(fs.readFileSync('outputs/official-nhl/season-schedules/2026-27.json','utf8'));
          if(official.complete!==true)throw Error('Official season schedule not validated');
          const indexed=new Map(official.games.map(g=>[g.id,g]));
          const uniq=new Set(),games=new Set();let earliest=Infinity;
          for(const p of selected){
            const game=indexed.get(p.gameId),start=Date.parse(p.gameStartAt),
              event=Date.parse(p.eventStartsAt),captured=Date.parse(p.capturedAt);
            const key=[p.gameId,p.playerId,p.market,p.line,p.tier].join('|');
            if(uniq.has(key)||!game||!Number.isFinite(start)||!Number.isFinite(event)||
               !Number.isFinite(captured)||Math.abs(Date.parse(game.startTimeUTC)-start)>300000||
               Math.abs(start-event)>300000||captured>generated||captured>=start||
               commitAt>=start||start-commitAt<15*60000||
               p.marketStatus!=='research_only'||p.originalModelProbabilityCalibrated!==false||
               p.originalPlatformSettlementVerified!==false)
              throw Error('Selected NHL prop does not satisfy original game, offer, and Git time gates');
            uniq.add(key);games.add(p.gameId);earliest=Math.min(earliest,start);
          }
          // New-code first-Git snapshots must contain the three research-only
          // Standard shadow forecasts in the SAME immutable original file.
          // Old original snapshots cannot retroactively claim these forecasts.
          // Also verify the first actual future Standard shadow capture after the model merge.
          const shadowFirstAdd=execFileSync('git',['log','--diff-filter=A','-1',
            '--format=%cI','--','src/nhl-standard-triple-challenger.cjs'],
            {encoding:'utf8'}).trim();
          const policyAt=Date.parse(shadowFirstAdd);
          if(Number.isFinite(policyAt)&&generated>=policyAt){
            const shadow=s.standardTripleChallenger,standard=selected.filter(x=>x.tier==='Standard');
            if(shadow?.kind!=='nhl_standard_precommitted_three_challengers_v1'||
               shadow.createdAt!==s.generatedAt||
               shadow.originalSnapshotGeneratedAt!==s.generatedAt||
               !Array.isArray(shadow.rows)||shadow.rows.length!==standard.length||
               shadow.calibrationVerified!==false||
               shadow.championSelectionsUnchanged!==true||
               s.standardCalibrationShadow?.approvedForLiveUse!==false)
              throw Error('New frozen NHL Standard research shadow or calibration gate missing');
            const registered=new Set();
            for(const r of shadow.rows){
              const key=[r.gameId,r.playerId,r.market,r.line,r.tier].join('|');
              const p=standard.find(x=>[x.gameId,x.playerId,x.market,x.line,x.tier].join('|')===key);
              if(!p||registered.has(key)||r.originalSelectedSide!==p.lean||
                 r.originalCapturedAt!==p.capturedAt||r.gameStartAt!==p.gameStartAt||
                 r.generatedAt!==s.generatedAt||
                 r.calibrated!==false||r.automaticRecommendationEligible!==false||
                 !['research_only'].includes(r.status))
                throw Error('Stored shadow does not exactly match original standard pregame selection');
              registered.add(key);
            }
            console.log('PASS: new Standard challengers originally Git frozen with selected lines.');
            console.log(JSON.stringify({originalStandardShadowRows:shadow.rows.length,
              shadowOriginalFirstGitProven:true,modelPromoted:false,
              calibrationApproved:false,noOriginalPlatformSettlements:true}));
          }else{
            console.log('Previous-policy original snapshot: no new challenger foresight claimed.');
          }
          // Aggregate metadata only. Never publish player names, prices, prop lines,
          // sources, model parameters or private git source content.
          console.log('PASS: first Git addition and original immutable candidate record');
          console.log(JSON.stringify({privateGitPrecommitVerified:true,
            originalSelections:selected.length,distinctFutureGames:games.size,
            initialCommitBeforeEarliestStart:true,sourceBeforeModelSelection:true,
            originalPlatformQuoteAuthenticated:false,officialSettlementsVerified:false,
            modelProbabilitiesCalibrated:false,automatedWagersPlaced:0}));
          NODE

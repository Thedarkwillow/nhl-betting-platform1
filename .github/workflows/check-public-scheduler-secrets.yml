name: Verify required public NHL NFL scheduler secrets (presence only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-public-scheduler-secrets.yml']
permissions:
  contents: read
jobs:
  presence-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify three required public repository secrets without revealing values
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH: ${{ secrets.PUBLIC_GITHUB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          failed=0
          if [ -n "$CF_ACCOUNT" ]; then
            echo "PRESENT: CLOUDFLARE_ACCOUNT_ID"
          else
            echo "::error::MISSING: CLOUDFLARE_ACCOUNT_ID"
            failed=1
          fi
          if [ -n "$CF_API" ]; then
            echo "PRESENT: CLOUDFLARE_API_TOKEN"
          else
            echo "::error::MISSING: CLOUDFLARE_API_TOKEN"
            failed=1
          fi
          if [ -n "$GH_DISPATCH" ]; then
            echo "PRESENT: PUBLIC_GITHUB_DISPATCH_TOKEN"
          else
            echo "::error::MISSING: PUBLIC_GITHUB_DISPATCH_TOKEN"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::Public Cloudflare backup scheduler is NOT ready. No deployment attempted."
            exit 1
          fi
          echo "PASS: all three public scheduler secrets exist. This does not verify validity, authorization, or a live Cloudflare deploy."
# One-time recheck after user added the public workflow dispatch secret.

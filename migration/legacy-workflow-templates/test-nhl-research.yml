jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run unit tests without credentials
        run: |
          node --check scripts/build-free-nhl-research.cjs
          node --check src/nhl-four-priority-markets.cjs
          node --check src/nhl-four-priority-shadow.cjs
          node --check src/nhl-extra-market-shadow.cjs
          node --check src/nhl-new-market-model.cjs
          node --check src/nhl-experimental-offer-bridge.cjs
          node --check src/nhl-combo-period-research.cjs
          node --check src/nhl-official-period-events.cjs
          node --check src/nhl-combo-source-evidence.cjs
          node --check src/nhl-combo-joint-shadow.cjs
          node --check src/nhl-period-count-model.cjs
          node --check src/nhl-period-offer-research.cjs
          node --check scripts/backfill-nhl-prior-season-periods.cjs
          node --check scripts/build-nhl-period-combo-models.cjs
          node --check src/nhl-period-history.cjs
          node --check scripts/collect-nhl-official-period-events.cjs
          node --check scripts/build-nhl-period-history.cjs
          node --check src/nhl-experimental-market-outcome.cjs
          node --check src/nhl-official-skater-summary.cjs
          node --check src/nhl-official-faceoff-wins.cjs
          node --check src/nhl-official-goalie-fantasy.cjs
          node --check scripts/collect-player-stats.cjs
          node --check scripts/collect-prizepicks-asof-nhl.cjs
          node --check scripts/check-nhl-0900-board-gate.cjs
          node --check src/nhl-market-registry.cjs
          node --check src/nhl-frozen-individual-props.cjs
          node --check src/nhl-prospective-evidence.cjs
          node --check src/prizepicksapi-nhl-request.cjs
          node --check scripts/probe-prizepicksapi-nhl.cjs
          node --check scripts/grade-nhl-predictions.cjs
          node --check scripts/grade-nhl-forward-market-v3.cjs
          node --check src/nhl-forward-market-v3-grader.cjs
          node --check scripts/build-approved-nhl-shadow.cjs
          node --check scripts/build-nhl-dfo-role-goalie-shadow.cjs
          node --check src/nhl-offer-claim-guard.cjs
          node --check src/nhl-public-evidence-labels.cjs
          npm test
          # Check original historical Git-frozen cohort with the new comparison
          # protocol before any automatic grading workflow can adopt it.
          node scripts/report-nhl-frozen-baseline-challenge.cjs
          node --check scheduler/nhl-board-dispatcher/src/index.mjs
          node --test scheduler/nhl-board-dispatcher/test/dispatcher.test.mjs
      - name: Build research output
        run: node scripts/build-nhl-research.cjs
      - name: Validate public dashboard data export
        run: |
          node --check scripts/export-public-nhl-data.cjs
          node --check scripts/report-nhl-overnight-health.cjs
          node scripts/export-public-nhl-data.cjs
          node - <<'NODE'
          const d=require('./site/data.json');
          if(!Array.isArray(d.featuredIndividualProps)||d.featuredPropsPolicy!=='nhl-individual-prop-max-available-direction-v1')process.exit(1);
          for(const p of d.featuredIndividualProps){
            if(p.expectedValue!==null||p.modelProbabilityCalibrated!==false||
             p.originalPlatformSettlementVerified!==false||p.probability<=0.5)process.exit(1);
          }
          console.log('Featured individuals are explicit model preferences, not payouts, live settlements or raw offered-side pairs');
          NODE
          node -e 'const d=require("./site/data.json");if(!d.lineups||!d.dataProvider||d.matchupResearch?.sources?.length!==5||d.matchupResearch?.thirdPartyDataAccessAuthorized!==false||d.matchupResearch?.noNewModelAdjustment!==true||d.props.some(p=>!p.matchupScout||p.matchupScout.modelProbabilityAdjusted!==false))process.exit(1);console.log(JSON.stringify({source:d.dataProvider,props:d.props.length,playerRates:d.matchupResearch.playerRateAvailable,opponentContext:d.matchupResearch.opponentContextAvailable}))'
      - name: Validate output and report counts
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('outputs/research/nhl-latest.json','utf8'));
          if(!Array.isArray(d.rankedProps)||!d.excluded||!d.lineups)process.exit(1);
          if(d.rankedProps.some(x=>x.verified!==false||x.probabilityCalibrated!==false||x.expectedValue!==null))process.exit(1);
          console.log(JSON.stringify({totalRows:d.totalRows,matchedRows:d.matchedRows,uniqueMatchedProps:d.uniqueMatchedProps,excluded:d.excluded,coverageComplete:d.boardCoverageComplete},null,2));
          NODE

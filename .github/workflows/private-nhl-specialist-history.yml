name: Private NHL specialist history and historical PP coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-specialist-history.yml']
  schedule:
    - cron: '20 5,11,17,23 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-nhl-specialist-history
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify joins and specialist tests
        run: |
          set -euo pipefail
          umask 077
          pin=c048d7f32d7fce74fb9112e95401e54c6397bf40
          if ! test -f src/nhl-specialist-challengers-v2.cjs; then
            git fetch -q origin "$pin"
            for f in src/nhl-specialist-challengers-v2.cjs src/nhl-standard-prospective-proof.cjs scripts/recover-nhl-specialist-history.cjs scripts/report-nhl-standard-proof.cjs test/nhl-specialist-standard-proof.test.cjs; do git show "$pin:$f" > "$f"; done
          fi
          node --check scripts/recover-nhl-specialist-history.cjs
          node --check scripts/report-nhl-eight-priorities.cjs
          node --test test/nhl-specialist-history-recovery.test.cjs test/nhl-eight-priorities.test.cjs test/nhl-specialist-standard-proof.test.cjs
      - name: Recover existing archives and collect at most sixteen dates
        run: |
          set -euo pipefail
          umask 077
          node scripts/recover-nhl-specialist-history.cjs
      - name: Archive private aggregate and PP data
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -d outputs/research/nhl-pp-history; then git add -f outputs/research/nhl-pp-history/*.json; fi
          if test -f outputs/health/nhl-specialist-source-recovery-latest.json; then git add -f outputs/health/nhl-specialist-source-recovery-latest.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private NHL specialist history and exact power-play ice time'
          git restore -- scripts/recover-nhl-specialist-history.cjs
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

# Owner-requested continuation Nov 15 after coverage audit; keep the existing collection limits and serial concurrency.

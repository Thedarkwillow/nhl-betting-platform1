name: Validate free NFL identity and gameday feeds (no secrets)
on:
  push:
    branches: ['research/nfl-free-identity-active-source-probe-1118']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe official live NFL and free ESPN identity schemas
        run: |
          python - <<'PY'
          import urllib.request,json,re,urllib.error
          urls={
            'nfl_injury_week11':'https://fantasy-www.nfl.com/news/nfl-week-11-injury-report-2026-season',
            'nfl_injury_main':'https://www.nfl.com/injuries/league/2026/reg11',
            'nfl_game_day':'https://www.nfl.com/inactives/',
            'espn_hou_roster':'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/hou/roster',
            'espn_ind_roster':'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/ind/roster'
          }
          for tag,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; research bot)',
                'Accept':'text/html,application/json'})
              with urllib.request.urlopen(req,timeout=12) as f:
                data=f.read(250000);status=f.status;resolved=f.geturl()
              out={'source':tag,'http':status,'mime':data[:2].decode('utf-8','ignore'),
                   'length':len(data),'resolvedHost':urllib.request.urlparse(resolved).hostname if hasattr(urllib.request,'urlparse') else resolved.split('/')[2]}
              if tag.startswith('espn'):
                try:
                  d=json.loads(data);out.update({'topKeys':list(d.keys())[:12],
                    'athletesType':type(d.get('athletes')).__name__,
                    'athletesCount':len(d.get('athletes') or [])})
                  a=d.get('athletes') or []
                  if a:
                    x=a[0]
                    if 'items' in x:x=x['items'][0] if x['items'] else x
                    out['athleteKeys']=list(x.keys())[:35]
                except Exception as e:out['parseError']=type(e).__name__
              else:
                text=data.decode('utf-8','ignore')
                out['titleSnippet']=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S).group(1)[:100] if re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S) else None
                out['publishedMeta']='article:published_time' in text
                out['publishedJson']='datePublished' in text
                out['hasPublishedWeek11']='week 11' in text.lower()
                out['containsOutLabel']='OUT:' in text
              print(json.dumps(out))
            except Exception as e:print(json.dumps({'source':tag,'error':type(e).__name__,'code':getattr(e,'code',None)}))
          PY

      - name: Check official article heading and status HTML structure
        run: |
          python - <<'PY'
          import urllib.request,re
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):
              super().__init__();self.tags=[];self.stack=[];self.marked=[]
            def handle_starttag(self,t,a):
              if t in ('h1','h2','h3','h4','li'):self.stack.append([t,[]])
            def handle_data(self,d):
              for x in self.stack:x[1].append(d)
            def handle_endtag(self,t):
              if self.stack and self.stack[-1][0]==t:
                kind,text=self.stack.pop();z=' '.join(''.join(text).split())
                if kind!='li':self.tags.append((kind,z[:80]))
                if kind=='li' and (z.startswith('OUT:') or z.startswith('QUESTIONABLE:')):
                  self.marked.append(z[:50])
          url='https://fantasy-www.nfl.com/news/nfl-week-11-injury-report-2026-season'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as r:
            html=r.read(1800000).decode('utf-8','replace')
          p=P();p.feed(html)
          print('headerTags',p.tags[:24])
          print('statusRowsWithOUTOrQUESTIONABLE',len(p.marked))
          print('datePublishedMatches',re.findall(r'"datePublished"\\s*:\\s*"([^"]+)',html)[:2])
          print('articleMetaSamples',re.findall(r'<meta[^>]+(?:published_time|modified_time)[^>]*>',html)[:2])
          print('containsRenderedLiteralGameWeek',bool(re.search(r'2026 NFL season',html,re.I)))
          PY

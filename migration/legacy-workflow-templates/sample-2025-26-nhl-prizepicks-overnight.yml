name: Sample 2025-26 NHL PrizePicks History Overnight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sample-2025-26-nhl-prizepicks-overnight.yml'
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
concurrency:
  group: sample-2025-26-nhl-prizepicks-overnight
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check one-time completion before using credits
        id: gate
        shell: bash
        run: |
          if [ -f outputs/the-odds-api/nhl/prizepicks-2025-26-opening-probe-latest.json ] && node -e 'const j=require("./outputs/the-odds-api/nhl/prizepicks-2025-26-opening-probe-latest.json"); process.exit(j.status==="probe_complete"?0:1)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Historical 2025-26 sample already archived; no additional credits spent."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate historical sampling and data-quality tests
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/probe-the-odds-api-prizepicks-2025-26.cjs
          node --test test/probe-the-odds-api-prizepicks-2025-26.test.cjs
      - name: Fetch four dated 2025-26 NHL games (maximum 55 API credits)
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/probe-the-odds-api-prizepicks-2025-26.cjs
      - name: Save source-labelled archival evidence
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/the-odds-api/nhl/prizepicks-2025-26-opening-probe-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: archive 2025-26 NHL PrizePicks historical Odds API sample"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: older-2025-26-nhl-prizepicks-sample
          path: outputs/the-odds-api/nhl/prizepicks-2025-26-opening-probe-latest.json
          if-no-files-found: ignore

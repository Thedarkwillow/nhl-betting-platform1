name: Parallel esports separate historical cohorts
on:
  pull_request:
    paths: ['scripts/esports_separate_historical_cohort.py','scripts/valorant_pregame_agent_research.py','.github/workflows/esports-parallel-cohort-validation.yml']
  push:
    branches: [main]
    paths: ['scripts/esports_separate_historical_cohort.py','scripts/valorant_pregame_agent_research.py','.github/workflows/esports-parallel-cohort-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m py_compile scripts/esports_separate_historical_cohort.py scripts/valorant_pregame_agent_research.py
  cohort:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        title: [lol, dota, valorant, cod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scipy==1.15.3 duckdb==1.2.2
      - if: matrix.title != 'cod'
        run: python scripts/esports_separate_historical_cohort.py ${{ matrix.title }}
      - if: matrix.title == 'cod'
        run: python scripts/public_cod_wiki_history.py 2026 04

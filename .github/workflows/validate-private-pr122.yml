name: Validate private Power Flex scenarios PR 122
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-private-pr122.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 70b0f247717751df89769405bda1cd9a287d89a2
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all private tests with no private source data in logs
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          test "$(git rev-parse HEAD)" = 70b0f247717751df89769405bda1cd9a287d89a2
          if ! npm test >"$log" 2>&1; then
            grep -E '^# (tests|pass|fail) [0-9]+$' "$log" | tail -n 3
            exit 1
          fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$log" | tail -n 3

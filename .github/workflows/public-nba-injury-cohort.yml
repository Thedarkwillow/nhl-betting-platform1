name: Public NBA dated injury identity reconciliation
on:
  pull_request:
    paths:
      - 'scripts/reconcile-nba-dated-injury-cohort.py'
      - 'config/nba/prior-season-identity-assets-v1.json'
      - '.github/workflows/public-nba-injury-cohort.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-nba-injury-cohort.yml'
      - 'config/nba/prior-season-identity-assets-v1.json'
      - 'scripts/reconcile-nba-dated-injury-cohort.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/reconcile-nba-dated-injury-cohort.py
      - run: python3 -m unittest discover -s test -p test_nba_dated_injury_cohort.py
  reconcile:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: d02aa363ebbfbf5619411cf46a01efcd5ddc6299
          path: archive
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==19.0.1
      - name: Reconstruct original cutoff and match dated roster identities
        env:
          NBA_RESTRICTED_IDENTITY_REVIEW: ${{ runner.temp }}/nba-pending-identity-review.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/nba-injury-counts"
          python public/scripts/reconcile-nba-dated-injury-cohort.py archive/outputs/nba/research/pinnacle-2026-10-24-to-31-nba.csv >"$log" 2>&1 || { echo "::error::Injury reconstruction failed; raw diagnostics withheld"; exit 1; }
          python - "$log" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          if x["kind"]!="nba_original_injury_cohort_reconciliation_v1" or x["rawRowsPublished"]!=0 or x["freezeApproved"] is not False:raise ValueError("contract")
          print(json.dumps(x))
          PY
      - name: Preserve unresolved identity review only in private archive
        if: github.event_name == 'push' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/nba-pending-identity-review.json"
          trap 'rm -f "$file"' EXIT
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          cd archive
          git config user.name 'Research archive automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git switch -c research/nba-pending-identity-review-20261124
          mkdir -p research/nba-pending-identity-review-20261124
          install -m 600 "$file" research/nba-pending-identity-review-20261124/pending.json
          git add research/nba-pending-identity-review-20261124/pending.json
          git commit -qm 'Retain reconstructed unresolved NBA identity evidence'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --quiet --force-with-lease=refs/heads/research/nba-pending-identity-review-20261124: origin HEAD:refs/heads/research/nba-pending-identity-review-20261124
          remote="$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin refs/heads/research/nba-pending-identity-review-20261124 | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
          echo 'Restricted NBA identity review committed and verified.'

name: Native individual NHL NFL research
on:
  pull_request:
    paths: ['scripts/native-individual-research.cjs','scripts/pickfinder-reviewed-history-model.cjs','scripts/pickfinder-clock-reconciliation.cjs','test/pickfinder-clock-reconciliation.test.cjs','scripts/prizepicks-multisport-model-bridge.cjs','test/native-individual-research.test.cjs','.github/workflows/native-individual-research.yml']
  push:
    branches: [main]
    paths: ['scripts/native-individual-research.cjs','scripts/pickfinder-reviewed-history-model.cjs','scripts/pickfinder-clock-reconciliation.cjs','test/pickfinder-clock-reconciliation.test.cjs','scripts/prizepicks-multisport-model-bridge.cjs']
  workflow_dispatch:
  workflow_run:
    workflows: ['Public independent sports identity and final evidence']
    types: [completed]
permissions:
  contents: read
jobs:
  generate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/native-individual-research.test.cjs test/pickfinder-clock-reconciliation.test.cjs
      - run: node --max-old-space-size=6144 scripts/native-individual-research.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: individual-research
          path: individual-research/forecasts.json
          if-no-files-found: error

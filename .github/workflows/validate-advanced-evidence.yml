name: Validate private advanced evidence and NHL periods
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-advanced-evidence.yml']
permissions:
  contents: read
concurrency:
  group: private-advanced-evidence-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: e757556e225f811ae7424b41504f1ac6a360f09b
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full private regression
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          test "$(git rev-parse HEAD)" = e757556e225f811ae7424b41504f1ac6a360f09b
          if ! npm test >"$log" 2>&1; then grep -E '^# (tests|pass|fail) [0-9]+$' "$log" || true; echo '::error::Private regression failed.'; exit 1; fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$log" || true
          echo 'PASS: private regression.'
      - name: Cached calibration, dependence, benchmark and period reports
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          for script in scripts/report-nhl-pregame-close-research.cjs scripts/report-nhl-standard-forward-improvement.cjs scripts/report-nfl-independent-forward.cjs scripts/build-nhl-period-combo-models.cjs; do
            if ! node "$script" >"$log" 2>&1; then echo "::error::Cached research report failed: $script"; exit 1; fi
          done
          node - <<'NODE' >"$log" 2>&1
          const fs=require('node:fs'),read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const n=read('outputs/health/nhl-standard-forward-improvement-latest.json'),f=read('outputs/nfl/backtests/independent-source-forward-latest.json'),p=read('outputs/backtests/nhl-period-walkforward-latest.json');
          if(!n.hierarchicalCalibration||!f.hierarchicalCalibration||!n.originalPairDependence||!f.originalPairDependence||!n.marketBenchmarkReadiness||p.dedicatedDistributionResearch?.policies.length!==30)throw Error('Missing required evidence');
          const aggregate={kind:'private_advanced_evidence_validation_v1',generatedAt:new Date().toISOString(),codeCommit:'e757556e225f811ae7424b41504f1ac6a360f09b',nhl:{firstObserved:n.firstObservedCalibrationState.firstObserved.length,calibration:n.hierarchicalCalibration,pairs:n.originalPairDependence,benchmark:n.marketBenchmarkReadiness,trial:n.fixedTrial},nfl:{firstObserved:f.firstObservedCalibrationState.firstObserved.length,calibration:f.hierarchicalCalibration,pairs:f.originalPairDependence,trial:f.fixedTrial},nhlPeriods:p.dedicatedDistributionResearch,modelPromoted:false,verifiedProfitability:false};
          fs.writeFileSync('outputs/health/advanced-evidence-validation-latest.json',JSON.stringify(aggregate,null,2)+'\n');
          NODE
          echo 'PASS: cached advanced reports.'
      - name: Archive isolated aggregate evidence
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f=outputs/health/advanced-evidence-validation-latest.json
          test -s "$f"
          cp "$f" /tmp/advanced-evidence-validation-latest.json
          git restore --worktree -- .
          git fetch -q origin main >"$log" 2>&1
          git checkout -q --detach origin/main >"$log" 2>&1
          cp /tmp/advanced-evidence-validation-latest.json "$f"
          git add -f "$f"
          git diff --cached --quiet && exit 0
          git commit -m 'audit: private advanced statistical evidence trials' >"$log" 2>&1
          for attempt in 1 2 3; do
            git fetch -q origin main >"$log" 2>&1
            git rebase -q origin/main >"$log" 2>&1 || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main >"$log" 2>&1; then echo 'PASS: aggregate archived privately.'; exit 0; fi
            sleep "$attempt"
          done
          exit 1
  status:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish status only
        env:
          RESULT: ${{ needs.validate.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p data
          node -e 'require("fs").writeFileSync("data/advanced-evidence-validation.json",JSON.stringify({kind:"advanced_evidence_validation_v1",privateHead:"e757556e225f811ae7424b41504f1ac6a360f09b",result:process.env.RESULT,runId:process.env.RUN_ID,recordedAt:new Date().toISOString(),calibrated:false,modelPromoted:false})+"\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/advanced-evidence-validation.json
          git commit -m 'status: private advanced evidence validation' >/dev/null
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

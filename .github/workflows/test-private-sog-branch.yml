# Retest after original-side SOG directional grader refinement; no model is deployed.
name: Verify Private NHL SOG Research Branch (No Public Code)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-private-sog-branch.yml']
permissions:
  contents: read
concurrency:
  group: research-private-sog-branch-validation
  cancel-in-progress: false
jobs:
  verify-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - name: Require narrowly restricted private access token
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private repository token missing"; exit 1; }
      - name: Checkout PRIVATE SOG research branch only
        uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: research/nhl-sog-pregame-shadow-20261111
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private SOG independent prospective forecasts
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          node --check src/nhl-sog-opportunity-challengers.cjs
          node --check src/nhl-standard-triple-challenger.cjs
          node --check src/nhl-standard-triple-challenger-grader.cjs
          if ! node --test test/nhl-sog-opportunity-challengers.test.cjs test/nhl-standard-triple-challenger.test.cjs test/nhl-partner-pregame-freeze.test.cjs >"$log" 2>&1; then
            echo "::error::Private NHL SOG targeted research tests failed; code and logs withheld."
            exit 1
          fi
          echo "PASS: private SOG targeted chronology, coverage and integration tests."
          if ! npm test >"$log" 2>&1; then
            echo "::error::Private NHL full Node regression failed; logs withheld."
            exit 1
          fi
          echo "PASS: full private Node regression, champion selection unchanged."
      - name: No provider or bettor actions
        if: always()
        run: echo "Research-only local tests, no API collection, no player-line publication, no wagers."

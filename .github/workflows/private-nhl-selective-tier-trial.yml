name: Private NHL future selective and tier calibration trial
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-selective-tier-trial.yml']
  workflow_run:
    workflows: ['Private NHL prospective grading and baseline audit via public runner']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: private-nhl-selective-tier-trial
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed research policy before any report
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if test ! -f src/nhl-selective-standard-tier-trial.cjs; then
            pin=357786d4aed63636dbe478596d2744f9177e094b
            git fetch -q origin "$pin"
            for file in src/nhl-selective-standard-tier-trial.cjs test/nhl-selective-standard-tier-trial.test.cjs scripts/report-nhl-selective-tier-trial.cjs; do
              git show "$pin:$file" > "$file"
            done
          fi
          if ! node --test test/nhl-selective-standard-tier-trial.test.cjs >"$log" 2>&1; then
            echo '::error::Selective trial regression failed; no report.'
            exit 1
          fi
          echo 'PASS: fixed-policy selective trial tests.'
      - name: Report only first-main-commit future evidence, no provider requests
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e HEAD:src/nhl-selective-standard-tier-trial.cjs 2>/dev/null; then
            echo 'Policy not on main; tests only, no prospective report.'
            exit 0
          fi
          umask 077
          node scripts/report-nhl-selective-tier-trial.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/nhl-selective-tier-trial-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'audit: private future selective Standard and separate tier calibration trial'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

# November 15: activate compact audit on merged policy; only outcomes first frozen after the policy qualify.

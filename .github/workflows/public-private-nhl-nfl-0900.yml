# Rate-limit recovery: retry current private collector only during the real capture hour.
name: Public Free Runners - Private NHL and NFL 6 and 9 AM Boards
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe_now counts-only, capture_0600/0900 private archival in actual Pacific hour"
        type: choice
        required: true
        default: probe_now
        options: [probe_now, capture_0600, capture_0900]
  push:
    branches: [main]
    paths:
      - 'scripts/probe-nhl-nfl-prop-feed.cjs'
      - '.github/workflows/public-private-nhl-nfl-0900.yml'
  schedule:
    - cron: '0 6 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '12 6 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '27 6 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '43 6 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '51 6 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '0 9 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '12 9 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '27 9 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '43 9 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '51 9 * * *'
      timezone: 'America/Los_Angeles'
permissions:
  contents: read
concurrency:
  group: public-runner-private-prop-collector-nhl-nfl
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public counts-only source probe
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnostic count-only probe on EXPLICIT probe_now, never before scheduled capture
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe_now'
        continue-on-error: false
        working-directory: public
        run: |
          node --check scripts/probe-nhl-nfl-prop-feed.cjs
          node --test scripts/test-public-nhl-nfl-prop-health.cjs
          node scripts/probe-nhl-nfl-prop-feed.cjs
      - name: Require actual 6 AM or 9 AM and private-only token for full archive
        id: gate
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'capture_0900' || inputs.mode == 'capture_0600'))
        env:
          PRIVATE_RESEARCH_REPO_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if test -z "$PRIVATE_RESEARCH_REPO_TOKEN"; then
            echo "::error::Missing PRIVATE_RESEARCH_REPO_TOKEN. Public counts are NOT private archived boards."
            exit 1
          fi
          actual_hour="$(TZ=America/Los_Angeles date +%H)"
          case "$actual_hour" in
            06) requested="06:00";;
            09) requested="09:00";;
            *) echo "::error::Not in an actual Pacific 6 AM or 9 AM capture hour."; exit 1;;
          esac
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            case "$REQUESTED_MODE" in
              capture_0600) test "$requested" = "06:00";;
              capture_0900) test "$requested" = "09:00";;
              *) exit 1;;
            esac || { echo "::error::Requested slot conflicts with actual Pacific time."; exit 1; }
          fi
          echo "slot=$requested" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
      - name: Checkout private repository ONLY on trusted schedule/manual dispatch
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - name: Validate offline private source and chronology checks
        if: steps.gate.outputs.allowed == 'true'
        working-directory: private
        run: |
          node --check scripts/collect-live-partner-nhl-nfl.cjs
          node --check scripts/diff-live-partner-captures.cjs
          node --test test/nhl-nfl-partner-direct-collection.test.cjs
      - name: Capture full NEW NHL and NFL source responses inside private checkout
        if: steps.gate.outputs.allowed == 'true'
        id: snapshot
        working-directory: private
        env:
          PARTNER_CAPTURE_SLOT: ${{ steps.gate.outputs.slot }}
        run: |
          set -euo pipefail
          node scripts/collect-live-partner-nhl-nfl.cjs | tee /tmp/private-board-summary.json
          echo "ARCHIVE_DIR=$(node -e "const d=require('/tmp/private-board-summary.json');process.stdout.write(d.archiveDir)")" >> "$GITHUB_ENV"
          echo "status=$(node -e "const d=require('/tmp/private-board-summary.json');process.stdout.write(d.status)")" >> "$GITHUB_OUTPUT"
      - name: Compare honest actual-time observations and preview old NHL model
        if: steps.snapshot.outputs.status == 'saved_private_only'
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/diff-live-partner-captures.cjs "$ARCHIVE_DIR"
          node scripts/build-partner-board-preview.cjs "$ARCHIVE_DIR" || echo "::warning::Research preview failed; source archive still required"
      - name: Git-archive only private NHL/NFL offers and audit; never public
        if: steps.gate.outputs.allowed == 'true'
        working-directory: private
        run: |
          set -euo pipefail
          if test "$CAPTURE_STATUS" = "already_complete_morning_snapshot"; then
            echo "Duplicate source capture skipped: same-day private 6 AM or 9 AM archive exists."
            exit 0
          fi
          test -s "$ARCHIVE_DIR/manifest.json" || { echo "::error::No private source manifest"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$ARCHIVE_DIR"
          git add -f outputs/partner-source/line-delta 2>/dev/null || true
          git add -f outputs/partner-source/research-preview 2>/dev/null || true
          if git diff --cached --quiet; then echo "::error::No actual source archival changes"; exit 1; fi
          git commit -m "data: actual-time 6/9 AM private partner NHL and NFL boards"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git -c rebase.autoStash=true rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "Completed: source data saved PRIVATE; public repo contains only runner code and aggregate probes."
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "::error::No durable private 9 AM archive; do not count as successful"
          exit 1
        env:
          CAPTURE_STATUS: ${{ steps.snapshot.outputs.status }}

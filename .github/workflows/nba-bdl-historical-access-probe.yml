name: Check existing NBA historical box-score entitlement
on:
  push:
    branches: [nba-bdl-historical-access-probe-20261124]
    paths: ['.github/workflows/nba-bdl-historical-access-probe.yml']
permissions:
  contents: read
jobs:
  entitlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check historical endpoints without purchasing or activating anything
        env:
          BDL_KEY: ${{ secrets.NBA_BALLDONTLIE_API_KEY }}
        run: |
          node <<'NODE'
          (async()=>{
            const key=process.env.BDL_KEY;
            if(!key){console.log(JSON.stringify({kind:'nba_bdl_historical_entitlement',credentialConfigured:false}));return;}
            const result={kind:'nba_bdl_historical_entitlement',credentialConfigured:true,purchases:0,requests:0,results:{}};
            for(const [name,url] of Object.entries({
              boxScores:'https://api.balldontlie.io/v1/box_scores?date=2026-01-05&season_type=regular',
              stats:'https://api.balldontlie.io/v1/stats?dates%5B%5D=2026-01-05&per_page=1',
              injuries:'https://api.balldontlie.io/v1/player_injuries?per_page=1'
            })){
              try{result.requests++;const r=await fetch(url,{headers:{Authorization:key,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});const body=r.ok?await r.json():null;result.results[name]={httpStatus:r.status,available:r.ok&&Array.isArray(body?.data),rows:Array.isArray(body?.data)?body.data.length:null};}catch{result.results[name]={available:false,status:'network_error'};}
            }
            console.log(JSON.stringify(result));
          })().catch(()=>{process.exitCode=1;});
          NODE

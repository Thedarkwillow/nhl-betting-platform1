name: Private NHL shot and point opportunity evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-shot-point-opportunity.yml']
  workflow_run:
    workflows: ['Private pregame NHL freeze on public free runner', 'Private NHL specialist history and historical PP coverage']
    types: [completed]
  schedule:
    - cron: '53 6,22 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-nhl-shot-point-opportunity
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen holdout and exact-line safety contracts
        run: |
          set -euo pipefail
          umask 077
          pin=0c02019e7a92ce283bfbb19c2b8f35f6da92317c
          tested="$(git rev-parse HEAD)"
          if ! test -f scripts/report-nhl-shot-point-opportunity.cjs; then
            git fetch -q origin "$pin"
            work="$(mktemp -d)"
            git worktree add --detach "$work" "$pin"
            trap 'git worktree remove --force "$work" >/dev/null 2>&1 || true' EXIT
            cd "$work"
            set +e
            node --check scripts/report-nhl-shot-point-opportunity.cjs && node --test test/nhl-shot-point-opportunity.test.cjs test/nhl-selective-opportunity-future.test.cjs > "$work/test-output.txt" 2>&1
            teststatus=$?
            set -e
            cd - >/dev/null
            mkdir -p outputs/health
            TESTED="$pin" STATUS="$teststatus" LOGFILE="$work/test-output.txt" node -e 'const fs=require("fs");const logfile=process.env.LOGFILE;const summary=fs.existsSync(logfile)?fs.readFileSync(logfile,"utf8").split("\n").filter(x=>/^not ok|^# (tests|pass|fail|cancelled)|AssertionError|TypeError|SyntaxError/.test(x)).slice(0,20):[];fs.writeFileSync("outputs/health/nhl-shot-point-opportunity-diagnostic-latest.json",JSON.stringify({testedCommit:process.env.TESTED,generatedAt:new Date().toISOString(),passed:process.env.STATUS==="0",testSummary:summary,paidRequests:0})+"\n")'
            tested="$pin"
            if test "$teststatus" = 0; then
              if (cd "$work"; node scripts/report-nhl-shot-point-opportunity.cjs); then cp "$work/outputs/health/nhl-shot-point-opportunity-latest.json" outputs/health/nhl-shot-point-opportunity-latest.json; else echo "Historical report failed after unit tests; preserving diagnostic"; fi
            else
              echo "Regression test failed; preserving diagnostic"
              exit 0
            fi
          else
            node --check scripts/report-nhl-shot-point-opportunity.cjs
            node --test test/nhl-shot-point-opportunity.test.cjs test/nhl-selective-opportunity-future.test.cjs \
              test/nhl-zero-stat-integrity-audit.test.cjs \
              test/nhl-synthetic-opportunity-replay.test.cjs \
              test/sport-opportunity-production-shadow.test.cjs \
              test/past-only-calibration-research.test.cjs \
              test/strict-future-paired-challenger-evidence.test.cjs \
              test/report-open-model-ideas.test.cjs
            node scripts/report-nhl-shot-point-opportunity.cjs
            node scripts/report-open-model-ideas.cjs
          fi
          TESTED="$tested" node -e 'require("fs").writeFileSync("outputs/health/nhl-shot-point-opportunity-test-latest.json",JSON.stringify({testedCommit:process.env.TESTED,generatedAt:new Date().toISOString(),passed:true,paidRequests:0})+"\n")'
      - name: Archive only private research
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in outputs/health/nhl-shot-point-opportunity-test-latest.json outputs/health/nhl-shot-point-opportunity-latest.json outputs/health/nhl-shot-point-opportunity-diagnostic-latest.json outputs/health/open-model-ideas-latest.json; do if test -f "$f"; then git add -f "$f"; fi; done
          if test -d outputs/research/shot-point-opportunity-v1; then git add -f outputs/research/shot-point-opportunity-v1/*.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private NHL shooter/scoring opportunity and PP holdout evidence'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

# PR 161 merged after all 3 tests; use full current private history and frozen actual lines.

# Nov 17 user-requested open-source accuracy research sprint: rerun audited zero-shot denominators, prior-date shots/blocks and per-market calibration gates with existing private history; no added provider calls or production betting models.

name: Authorized PickFinder public preview intake
on:
  pull_request:
    paths: ['scripts/pickfinder_public_preview.py','.github/workflows/pickfinder-public-preview.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder_public_preview.py','.github/workflows/pickfinder-public-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pickfinder-public-preview
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/pickfinder_public_preview.py --test
  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PICKFINDER_AUTOMATED_ACCESS_AUTHORIZED != '0'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Verify private destination
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .permissions.push)" = true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: archive
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bounded public preview reads
        env:
          RESTRICTED_DESTINATION_VERIFIED: '1'
        run: |
          umask 077
          python3 public/scripts/pickfinder_public_preview.py archive
      - name: Append and verify private receipt
        working-directory: archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git add -f "research/pickfinder-preview/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git config user.name 'Research archive automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'Archive authorized PickFinder public preview observations'
          for attempt in 1 2 3 4 5 6; do
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push -q origin HEAD:main; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin main
              git merge-base --is-ancestor HEAD origin/main
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1

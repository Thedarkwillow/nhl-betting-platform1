name: PickFinder Premium public orchestration
on:
  pull_request:
    paths: ['scripts/pickfinder-public-*.cjs','scripts/pickfinder-unattended-runner.cjs','test/pickfinder-public-runner.test.cjs','.github/workflows/pickfinder-premium-hosted.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/pickfinder-premium-hosted.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: board_and_deep
        options: [board_and_deep, deep_research_now, probe_now, capture_0600, capture_0900]
  schedule:
    - cron: '7 6 * * *'
      timezone: America/Los_Angeles
    - cron: '7 9 * * *'
      timezone: America/Los_Angeles
    - cron: '7 12 * * *'
      timezone: America/Los_Angeles
    - cron: '7 16 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: pickfinder-hosted-capture
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/pickfinder-public-runner.test.cjs test/pickfinder-checkpoint-buffer.test.cjs test/pickfinder-combinations.test.cjs test/pickfinder-browser.test.cjs test/pickfinder-premium-archive.test.cjs test/pickfinder-unattended-runner.test.cjs
  run:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PICKFINDER_AUTOMATION_AUTHORIZED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: public-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: public-archive
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pickfinder-deps" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/pickfinder-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Authorized public-only sporting evidence collection
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          PICKFINDER_PUBLIC_DATA_AUTHORIZED: '1'
          PICKFINDER_AUTOMATION_AUTHORIZED: ${{ vars.PICKFINDER_AUTOMATION_AUTHORIZED }}
          PICKFINDER_EMAIL: ${{ secrets.PICKFINDER_EMAIL }}
          PICKFINDER_PASSWORD: ${{ secrets.PICKFINDER_PASSWORD }}
          PICKFINDER_STORAGE_STATE: ${{ secrets.PICKFINDER_STORAGE_STATE }}
          NODE_PATH: ${{ runner.temp }}/pickfinder-deps/node_modules
        run: node public-source/scripts/pickfinder-public-runner.cjs public-archive

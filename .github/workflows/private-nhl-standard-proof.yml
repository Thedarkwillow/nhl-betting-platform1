name: Private NHL Standard prospective proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-standard-proof.yml']
  workflow_run:
    workflows: ['Private pregame NHL freeze on public free runner']
    types: [completed]
  schedule:
    - cron: '51 6 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-nhl-standard-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fixed pregame policy and zero-network contracts
        run: |
          set -euo pipefail
          umask 077
          pin=c048d7f32d7fce74fb9112e95401e54c6397bf40
          if ! test -f scripts/report-nhl-standard-proof.cjs; then
            git fetch -q origin "$pin"
            work="$(mktemp -d)"
            git worktree add --detach "$work" "$pin"
            trap 'git worktree remove --force "$work" >/dev/null 2>&1 || true' EXIT
            (cd "$work"; node --check scripts/report-nhl-standard-proof.cjs; node --test test/nhl-specialist-standard-proof.test.cjs)
            mkdir -p outputs/health
            PIN="$pin" node -e 'require("fs").writeFileSync("outputs/health/nhl-standard-proof-test-latest.json",JSON.stringify({testedCommit:process.env.PIN,generatedAt:new Date().toISOString(),passed:true,providerRequests:0})+"\n")'
          else
            node --check scripts/report-nhl-standard-proof.cjs
            node --test test/nhl-specialist-standard-proof.test.cjs
            mkdir -p outputs/health
            PIN="$(git rev-parse HEAD)" node -e 'require("fs").writeFileSync("outputs/health/nhl-standard-proof-test-latest.json",JSON.stringify({testedCommit:process.env.PIN,generatedAt:new Date().toISOString(),passed:true,providerRequests:0})+"\n")'
            node scripts/report-nhl-standard-proof.cjs
          fi
      - name: Archive test evidence and prospective research privately
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/nhl-standard-proof-test-latest.json
          if test -f outputs/health/nhl-standard-proof-latest.json; then git add -f outputs/health/nhl-standard-proof-latest.json; fi
          if test -d outputs/research/standard-proof-v1; then git add -f outputs/research/standard-proof-v1/*.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private Standard prospective strategy evidence'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

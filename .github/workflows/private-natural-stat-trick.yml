name: Private Natural Stat Trick authorized data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-natural-stat-trick.yml']
  schedule:
    - cron: '5 6 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-natural-stat-trick
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: |
          set -euo pipefail
          pin=4e98663cda67f6183285be3b2ff697be829a98a7
          if ! test -f scripts/collect-natural-stat-trick.py; then
            git fetch -q origin "$pin"
            for f in scripts/collect-natural-stat-trick.py test/test_natural_stat_trick.py; do git show "$pin:$f" > "$f"; done
          fi
          python -m pip install --quiet beautifulsoup4
          python -m unittest discover -s test -p test_natural_stat_trick.py
      - name: Test key or collect approved current season
        env:
          NATURAL_STAT_TRICK_API_KEY: ${{ secrets.NATURAL_STAT_TRICK_API_KEY }}
          NST_APPROVED: ${{ vars.NST_APPROVED }}
        run: |
          set -euo pipefail
          umask 077
          if test "$NST_APPROVED" = true; then
            NST_MODE=current python scripts/collect-natural-stat-trick.py
          else
            NST_MODE=test python scripts/collect-natural-stat-trick.py
          fi
      - name: Archive private status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/natural-stat-trick/*.json
          git diff --cached --quiet && exit 0
          git commit -qm 'data: private Natural Stat Trick authorized connection status'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

name: Verified independent NHL capture and private preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verified-independent-nhl-capture.yml']
  # Separate from genuine 06:00/09:00 partner capture; one quota-bounded daily source attempt.
  schedule:
    - cron: '35 9 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: verified-independent-nhl-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate collector and preview before any source calls
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node --test test/prizepicksapi-board.test.cjs test/prizepicksapi-asof-board.test.cjs test/nhl-public-dashboard-payload.test.cjs >"$log" 2>&1; then
            echo '::error::Collector or public contract tests failed; no API calls.'
            exit 1
          fi
          echo 'PASS: existing collector and public export contract tests.'
      - name: One bounded legacy-request capture and private preview
        working-directory: private
        env:
          PRIZEPICKSAPI_KEY: ${{ secrets.PRIZEPICKSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node - >"$log" 2>&1 <<'NODE'
          const fs=require('node:fs');
          const {providerUsage}=require('./src/prizepicksapi-nhl-request.cjs');
          const realFetch=global.fetch;
          let calls=0,last=0,boardCalls=0,lastHttp=null;
          global.fetch=async(url,options)=>{
            const u=new URL(url);
            if(u.origin!=='https://prizepicksapi.com'||!['/api/v1/coverage','/api/v1/board'].includes(u.pathname)||calls>=36)
              throw Error('request_budget_or_endpoint');
            if(calls===0&&u.pathname!=='/api/v1/coverage')throw Error('coverage_required');
            const wait=Math.max(0,7000-(Date.now()-last));
            if(wait)await new Promise(r=>setTimeout(r,wait));
            last=Date.now();calls++;if(u.pathname==='/api/v1/board')boardCalls++;
            const r=await realFetch(url,options);lastHttp=r.status;
            if(r.ok){
              const q=providerUsage(r.headers);
              if(q.unit!=='requests'||!Number.isInteger(q.requestsRemaining)||
                 (u.pathname==='/api/v1/coverage'&&q.requestsRemaining<100))
                throw Error('legacy_request_quota_not_verified');
            }
            return r;
          };
          (async()=>{
            const m=JSON.parse(fs.readFileSync('outputs/projections/players.json','utf8'));
            const now=Date.now(), t=Date.parse(m.builtAt);
            if(!Number.isFinite(t)||t>now||now-t>47*3600000)throw Error('stale_model');
            try{
              const b=JSON.parse(fs.readFileSync('outputs/free-source/nhl/latest.json','utf8'));
              const a=Date.parse(b.generatedAt);
              if(b.provider==='prizepicksapi.com'&&b.snapshotMode==='immutable_as_of'&&b.completePagination===true&&b.sourceStatus==='fresh'&&a<=now&&now-a<20*60000){
                console.log('Already current; no additional board requests.');
                return;
              }
            }catch{}
            await require('./scripts/collect-prizepicks-asof-nhl.cjs').main();
            const b=JSON.parse(fs.readFileSync('outputs/free-source/nhl/latest.json','utf8'));
            if(b.provider!=='prizepicksapi.com'||b.snapshotMode!=='immutable_as_of'||b.completePagination!==true||b.quotaUnit!=='requests'||b.chargedCredits!==0)
              throw Error('board_contract');
            console.log(JSON.stringify({phase:'private_verified_capture',offers:b.totalOffers,rows:b.normalizedRows,pages:b.pagesFetched,requests:calls,credits:0,boardAt:b.generatedAt}));
          })().catch(e=>{const m=String(e.message||'');
            const reasons=[['legacy_request_quota_not_verified','legacy_request_quota_not_verified'],['request_budget_or_endpoint','request_budget_or_endpoint'],['stale_model','stale_model'],['coverage_required','coverage_required'],['board_contract','board_contract'],['As-of NHL provider board is not fresh and live','board_stale_or_nonlive'],['Immutable NHL board pin mismatch or plan truncation','pin_mismatch_or_plan_truncated'],['Duplicate, unidentified or future NHL offer','duplicate_missing_or_future_offer'],['Malformed immutable NHL board page','malformed_page'],['Malformed or repeated as-of board pagination cursor','bad_cursor'],['exceeds bounded pagination cap','pagination_cap'],['missing identity fields','identity_fields_missing'],['No usable pregame NHL offers','no_pregame_offers'],['NHL capture skipped before paid pagination','coverage_gate_refused'],['Insufficient requests','request_reserve_exhausted'],['ENOSPC','disk_space']];
            const reason=reasons.find(([prefix])=>m.includes(prefix))?.[1]||([400,401,403,429,503].includes(lastHttp)?'provider_HTTP_'+lastHttp:'source_or_contract_not_ready');
            console.error('CAPTURE_FAILURE '+reason+' calls='+calls+' boardCalls='+boardCalls+' lastHttp='+String(lastHttp??'none'));process.exitCode=1;});
          NODE
          then
            grep -E '^CAPTURE_FAILURE [a-zA-Z0-9_]+ calls=[0-9]+ boardCalls=[0-9]+ lastHttp=([0-9]{3}|none)$' "$log" || true
            echo '::error::Private capture did not verify a complete current board.'
            exit 1
          fi
          grep -E '^\{"phase":"private_verified_capture","offers":[0-9]+,"rows":[0-9]+,"pages":[0-9]+,"requests":[0-9]+,"credits":0,"boardAt":"[0-9T:.Z-]+"\}$|^Already current; no additional board requests\.$' "$log" || true
      - name: Archive complete board privately before model preview
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/free-source/nhl/latest.json outputs/free-source/nhl/snapshots/*.json outputs/free-source/nhl/raw-snapshots/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive complete independent NHL board privately' >/dev/null
            for attempt in 1 2 3; do
              git fetch -q origin main
              git rebase -q origin/main || { git rebase --abort; exit 1; }
              if git push -q origin HEAD:main; then echo 'PASS: private independent board archived.'; exit 0; fi
              sleep "$attempt"
            done
            exit 1
          fi
      - name: Build and archive prior-only research preview privately
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node scripts/build-nhl-source-preview.cjs >"$log" 2>&1; then echo '::error::Preview failed; complete private board retained.'; exit 1; fi
          node - <<'NODE'
          const p=require('./outputs/free-source/nhl/research-preview-latest.json');
          console.log(JSON.stringify({phase:'private_preview',matched:p.matchedRows,prospective:false,calibrated:false,publicRelease:false}));
          NODE
          git add -f outputs/free-source/nhl/research-preview-latest.json outputs/free-source/nhl/research-preview-snapshots/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: private independent NHL research preview' >/dev/null
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then echo 'PASS: private preview archived.'; exit 0; fi
            sleep "$attempt"
          done
          exit 1

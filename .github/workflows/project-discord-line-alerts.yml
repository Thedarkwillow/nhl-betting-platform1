name: Project Discord research alerts
on:
  pull_request:
    paths: ['scripts/*project-discord*','scripts/pickfinder-local-line-alerts.cjs','test/project-discord*.test.cjs','.github/workflows/project-discord-line-alerts.yml']
  push:
    branches: [main]
    paths: ['scripts/*project-discord*','.github/workflows/project-discord-line-alerts.yml']
  workflow_run:
    workflows: ['PickFinder Premium public orchestration','PickFinder archived model input processing','Public-only PickFinder research validation']
    types: [completed]
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, test #general, or test all platform destinations
        type: choice
        options: [preview, test, test_routes]
        default: preview
permissions:
  contents: read
concurrency:
  group: project-discord-alerts-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/project-discord*.test.cjs test/pickfinder-local-tools.test.cjs
  preview:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_run' && github.event_name != 'schedule' && inputs.mode != 'test' && inputs.mode != 'test_routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            config
            data
            research/pickfinder-public-v1/boards
            research/pickfinder-public-v1/board-parts
            research/pickfinder-public-validation-v1/nba-official-availability
      - run: node scripts/send-project-discord-alerts.cjs preview .
        env:
          PROJECT_DISCORD_FILTERS: ${{ vars.PROJECT_DISCORD_FILTERS }}
          PROJECT_DISCORD_BATCH_CONFIG: ${{ vars.PROJECT_DISCORD_BATCH_CONFIG }}
  send:
    needs: test
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'test_routes')) || ((github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'push') && vars.PROJECT_DISCORD_ALERTS_ENABLED == '1'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            src
            config
            data
            research/pickfinder-public-v1/boards
            research/pickfinder-public-v1/board-parts
            research/pickfinder-public-validation-v1/nba-official-availability
      - run: node scripts/send-project-discord-alerts.cjs "$MODE" .
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deliver' }}
          PROJECT_DISCORD_ALERTS_ENABLED: ${{ vars.PROJECT_DISCORD_ALERTS_ENABLED }}
          PROJECT_DISCORD_GUILD_ID: ${{ vars.PROJECT_DISCORD_GUILD_ID }}
          PROJECT_DISCORD_CHANNEL_ID: ${{ vars.PROJECT_DISCORD_CHANNEL_ID }}
          PROJECT_DISCORD_WEBHOOK_URL: ${{ secrets.PROJECT_DISCORD_WEBHOOK_URL }}
          PROJECT_DISCORD_FILTERS: ${{ vars.PROJECT_DISCORD_FILTERS }}
          PROJECT_DISCORD_BATCH_CONFIG: ${{ vars.PROJECT_DISCORD_BATCH_CONFIG }}
          PROJECT_DISCORD_SPORT_ROUTES: ${{ secrets.PROJECT_DISCORD_SPORT_ROUTES }}
          PROJECT_DISCORD_PLATFORM_ROUTES: ${{ secrets.PROJECT_DISCORD_PLATFORM_ROUTES }}
          PROJECT_DISCORD_PLATFORM_ROUTING_ENABLED: ${{ vars.PROJECT_DISCORD_PLATFORM_ROUTING_ENABLED }}
          PROJECT_DISCORD_GENERAL_ENABLED: ${{ vars.PROJECT_DISCORD_GENERAL_ENABLED || '0' }}

name: Private free NFL utilization historical validation
on:
  push:
    branches: ['ci/nfl-free-usage-20261114']
    paths: ['.github/workflows/ci-nfl-free-usage-20261114.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: ad1f3c0782ed7252a67611759a0d7bb6a5ad719f
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run private tests and cached archive research
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! python test/test_nfl_free_pbp_usage.py >"$log" 2>&1; then
            echo "::error::Private synthetic tests failed."
            exit 1
          fi
          echo "Synthetic usage tests passed."
          if ! python scripts/research-nfl-free-pbp-usage.py >>"$log" 2>&1; then
            echo "::error::Private historical research failed."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nfl/backtests/free-pbp-usage-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: private free NFL usage evaluation' >/dev/null
            git push -q origin HEAD:research/nfl-free-usage-model-20261114
          fi
          echo "Private aggregate research archived."

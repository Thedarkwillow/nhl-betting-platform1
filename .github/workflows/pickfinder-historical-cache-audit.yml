name: PickFinder historical cache shadow audit
on:
  pull_request:
    paths: ['scripts/pickfinder-public-history-cache.cjs', 'test/pickfinder-public-runner.test.cjs', '.github/workflows/pickfinder-historical-cache-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/pickfinder-public-runner.test.cjs
      - name: Audit committed digest-verified profile archives (counts only)
        run: node scripts/pickfinder-public-history-cache.cjs .

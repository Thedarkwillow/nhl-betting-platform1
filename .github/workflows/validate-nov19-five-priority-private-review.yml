name: Validate Nov 19 First-Git DNP, Bias and Future Holdout Gates
on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-nov19-five-priority-private-review.yml'
permissions:
  contents: read
concurrency:
  group: private-nov19-frozen-error-and-future-monitor
  cancel-in-progress: false
jobs:
  validate-private-firstgit-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require private checkout credentials
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$PRIVATE_TOKEN" || { echo "::error::Private checkout token missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frozen NHL nonappearance and NFL direction guards
        working-directory: private
        run: |
          set -euo pipefail
          node --check src/nov19-five-priority-postgame-audit.cjs
          node --check scripts/report-nov19-five-priority-postgame-audit.cjs
          node --test test/nhl-slate-graded-summary.test.cjs test/nov19-five-priority-postgame-audit.test.cjs
      - name: Verify actual original frozen Nov 19 report privately
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/report-nov19-five-priority-postgame-audit.cjs
          test -s outputs/health/nov19-five-priority-readonly-audit.json
          echo 'PASS: all four nonappearances, original picks unchanged; private report generated.'

      - name: Regression-test sanitized November 19 daily grade output
        run: |
          set -euo pipefail
          node --check public/scripts/publish-safe-daily-grade.cjs
          node public/scripts/publish-safe-daily-grade.cjs private public 2026-11-19
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const j=require('./public/data/daily-grade-2026-11-19.json');
          assert.equal(j.nhl.all.pending,4);
          assert.equal(j.nhl.all.decided,505);
          assert.equal(j.nhl.nonappearanceReconciliation.externallyConfirmedNonappearances,4);
          assert.equal(j.nhl.nonappearanceReconciliation.remainingUnresolvedOfficialAppearances,0);
          assert.equal(j.nfl.decided,269);
          assert.equal(j.platformSettlementVerified,false);
          assert.equal(j.rawPropRowsExposed,0);
          console.log('PASS: public summary shows resolved nonappearances without misgrading or identity leaks');
          NODE

      - name: Archive only the non-sensitive report in private Git history
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/nov19-five-priority-readonly-audit.json
          if git diff --cached --quiet; then
            echo 'No newly reconciled evidence; private report unchanged'
            exit 0
          fi
          git commit -qm 'audit: refresh future-only original frozen holdout and Nov 19 diagnostics'
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git -c rebase.autoStash=true rebase -q -X theirs origin/main || {
              git rebase --abort || true
              exit 1
            }
            if git push -q origin HEAD:main; then
              echo 'PASS: updated private-only no-wager research report'
              exit 0
            fi
            sleep "$attempt"
          done
          echo '::error::Could not save private report'
          exit 1

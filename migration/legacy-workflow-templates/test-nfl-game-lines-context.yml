name: NHL NFL Game Lines and NFL Context Replay
on:
  workflow_dispatch:
  push:
    branches: ['feat/nhl-nfl-game-lines-context-validation-20261108', main]
    paths:
      - 'src/prizepicks-game-lines.cjs'
      - 'scripts/inspect-nfl-context-schema.cjs'
      - '.github/workflows/test-nfl-game-lines-context.yml'
      - 'test/nhl-nfl-game-lines.test.cjs'
      - 'scripts/backtest-nfl-matchup-context.cjs'
      - 'test/nfl-matchup-context.test.cjs'
      - 'scripts/import-prizepicks-game-lines.cjs'
      - 'scripts/audit-nfl-quote-evidence.cjs'
      - 'test/nfl-quote-evidence.test.cjs'
  pull_request:
    paths:
      - 'src/prizepicks-game-lines.cjs'
      - 'scripts/inspect-nfl-context-schema.cjs'
      - '.github/workflows/test-nfl-game-lines-context.yml'
      - 'test/nhl-nfl-game-lines.test.cjs'
      - 'scripts/backtest-nfl-matchup-context.cjs'
      - 'test/nfl-matchup-context.test.cjs'
      - 'scripts/import-prizepicks-game-lines.cjs'
      - 'scripts/audit-nfl-quote-evidence.cjs'
      - 'test/nfl-quote-evidence.test.cjs'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read archived NFL feature schema (no external data requests)
        run: node scripts/inspect-nfl-context-schema.cjs
      - name: Verify NHL NFL Team Picks rules and snapshot requirements
        run: |
          node --check src/prizepicks-game-lines.cjs
          if test -f test/nhl-nfl-game-lines.test.cjs; then node --test test/nhl-nfl-game-lines.test.cjs; fi
      - name: Walk forward NFL context challenger vs same-cohort player-only baseline
        run: |
          if test -f scripts/backtest-nfl-matchup-context.cjs; then
            node --test test/nfl-matchup-context.test.cjs
            node scripts/backtest-nfl-matchup-context.cjs
          fi

      - name: Audit posted PrizePicks and Underdog line-evidence readiness
        run: |
          node --test test/nfl-quote-evidence.test.cjs
          node --check scripts/import-prizepicks-game-lines.cjs
          node scripts/audit-nfl-quote-evidence.cjs
      - name: Save aggregate no-player-data metrics after real replay
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if ! test -f outputs/nfl/backtests/context-challenger-latest.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nfl/backtests/context-challenger-latest.json outputs/nfl/backtests/posted-line-evidence-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(nfl): verified context challenger retrospective scorecard'
            pushed=0
            for i in 1 2 3 4; do
              git fetch origin main
              git -c rebase.autoStash=true rebase -X theirs origin/main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep $((i*3))
            done
            test "$pushed" -eq 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nfl-conditional-matchup-backtest
          path: |
            outputs/nfl/backtests/context-challenger-latest.json
            outputs/nfl/backtests/posted-line-evidence-audit.json
          if-no-files-found: ignore

name: Non-Cito esports authenticated coverage metadata
on:
  pull_request:
    paths:
      - 'scripts/esports-zero-credit-coverage.cjs'
      - 'test/esports-zero-credit-coverage.test.cjs'
      - '.github/workflows/esports-zero-credit-coverage.yml'
  push:
    branches: [main]
    paths: ['.github/workflows/esports-zero-credit-coverage.yml', 'scripts/esports-zero-credit-coverage.cjs']
  workflow_dispatch:
  schedule:
    - cron: '40 6,9 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/esports-zero-credit-coverage.test.cjs
  coverage:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only documented zero-credit coverage metadata
        env:
          PRIZEPICKSAPI_KEY: ${{ secrets.PRIZEPICKSAPI_KEY }}
          UNDERDOG_API_KEY: ${{ secrets.UNDERDOG_API_KEY }}
        run: node scripts/esports-zero-credit-coverage.cjs

name: Private historical source connection repair
on:
  pull_request:
    paths:
      - 'scripts/private-source-history-connections.cjs'
      - 'test/private-source-history-connections.test.cjs'
      - '.github/workflows/private-source-history-connections.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/private-source-history-connections.cjs'
      - 'test/private-source-history-connections.test.cjs'
      - '.github/workflows/private-source-history-connections.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-source-history-connections
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/private-source-history-connections.test.cjs test/nba-research-pipeline-v1.test.cjs
  repair:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Verify restricted destination
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .permissions.push)" = true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 402d4fceb29a2ec2f3d3b09d06ede8ba2dd4ef9a
          path: source
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: archive
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: research/esports-free-providers
          path: esports
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Reconnect historical cache and inspect esports branch without provider requests
        env:
          NBA_DIRECT_SOURCE_AUTHORIZED: ${{ vars.NBA_DIRECT_SOURCE_AUTHORIZED }}
          NBA_MIRROR_SOURCE_AUTHORIZED: ${{ vars.NBA_MIRROR_SOURCE_AUTHORIZED }}
        run: |
          set -euo pipefail
          umask 077
          node public/scripts/private-source-history-connections.cjs source archive esports
      - name: Preserve only new private historical cache and receipt
        working-directory: archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Research archive automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -d research/nba-history-recovery || exit 0
          git add -f outputs/nba/history research/nba-history-recovery
          git diff --cached --quiet && exit 0
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git commit -qm 'Append verified historical NBA mirror cache and import provenance'
          for attempt in 1 2 3 4 5 6; do
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push -q origin HEAD:main; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin main
              git merge-base --is-ancestor HEAD origin/main
              echo 'Private historical import verified on remote.'
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1

name: Validate free NFL identity and gameday feeds (no secrets)
on:
  push:
    branches: ['research/nfl-free-identity-active-source-probe-1118']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe official live NFL and free ESPN identity schemas
        run: |
          python - <<'PY'
          import urllib.request,json,re,urllib.error
          urls={
            'nfl_injury_week11':'https://fantasy-www.nfl.com/news/nfl-week-11-injury-report-2026-season',
            'nfl_injury_main':'https://www.nfl.com/injuries/league/2026/reg11',
            'nfl_game_day':'https://www.nfl.com/inactives/',
            'espn_hou_roster':'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/hou/roster',
            'espn_ind_roster':'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/ind/roster'
          }
          for tag,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; research bot)',
                'Accept':'text/html,application/json'})
              with urllib.request.urlopen(req,timeout=12) as f:
                data=f.read(250000);status=f.status;resolved=f.geturl()
              out={'source':tag,'http':status,'mime':data[:2].decode('utf-8','ignore'),
                   'length':len(data),'resolvedHost':urllib.request.urlparse(resolved).hostname if hasattr(urllib.request,'urlparse') else resolved.split('/')[2]}
              if tag.startswith('espn'):
                try:
                  d=json.loads(data);out.update({'topKeys':list(d.keys())[:12],
                    'athletesType':type(d.get('athletes')).__name__,
                    'athletesCount':len(d.get('athletes') or [])})
                  a=d.get('athletes') or []
                  if a:
                    x=a[0]
                    if 'items' in x:x=x['items'][0] if x['items'] else x
                    out['athleteKeys']=list(x.keys())[:35]
                except Exception as e:out['parseError']=type(e).__name__
              else:
                text=data.decode('utf-8','ignore')
                out['titleSnippet']=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S).group(1)[:100] if re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S) else None
                out['publishedMeta']='article:published_time' in text
                out['publishedJson']='datePublished' in text
                out['hasPublishedWeek11']='week 11' in text.lower()
                out['containsOutLabel']='OUT:' in text
              print(json.dumps(out))
            except Exception as e:print(json.dumps({'source':tag,'error':type(e).__name__,'code':getattr(e,'code',None)}))
          PY

      - name: Check official article heading and status HTML structure
        run: |
          python - <<'PY'
          import urllib.request,re
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):
              super().__init__();self.tags=[];self.stack=[];self.marked=[]
            def handle_starttag(self,t,a):
              if t in ('h1','h2','h3','h4','li'):self.stack.append([t,[]])
            def handle_data(self,d):
              for x in self.stack:x[1].append(d)
            def handle_endtag(self,t):
              if self.stack and self.stack[-1][0]==t:
                kind,text=self.stack.pop();z=' '.join(''.join(text).split())
                if kind!='li':self.tags.append((kind,z[:80]))
                if kind=='li' and (z.startswith('OUT:') or z.startswith('QUESTIONABLE:')):
                  self.marked.append(z[:50])
          url='https://fantasy-www.nfl.com/news/nfl-week-11-injury-report-2026-season'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as r:
            html=r.read(1800000).decode('utf-8','replace')
          p=P();p.feed(html)
          print('headerTags',p.tags[:24])
          print('statusRowsWithOUTOrQUESTIONABLE',len(p.marked))
          print('datePublishedMatches',re.findall(r'"datePublished"\\s*:\\s*"([^"]+)',html)[:2])
          print('articleMetaSamples',re.findall(r'<meta[^>]+(?:published_time|modified_time)[^>]*>',html)[:2])
          print('containsRenderedLiteralGameWeek',bool(re.search(r'2026 NFL season',html,re.I)))
          PY
      - name: Diagnose date and player anchors without private data
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://fantasy-www.nfl.com/news/nfl-week-11-injury-report-2026-season'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
            s=r.read(2200000).decode('utf8','replace')
          for token in ['datePublished','dateModified','Published:','publishedAt','2026-11-18','datetime=','/players/']:
            p=s.find(token)
            print('probe_token',token,'found',p>=0,'snippet',re.sub(r'(?i)(will mallory|c.j. stroud|woody marks)', '[PUBLIC-NAME]',s[max(0,p-75):p+145]) if p>=0 else '')
          print('li_with_NFL_player_links',len(re.findall(r'/players/',s)))
          print('json_script_date_matches',re.findall(r'(?:datePublished|dateModified)[^\\n]{0,200}',s)[:3])
          PY
      - name: Authorize existing private repository for source-only regression
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: fix/nfl-free-official-week11-injury-source-20261118
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - name: Validate latest official week report and positive-only declarations
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest discover -s test -p test_nfl_week11_first_party_injury_source.py
          python -m unittest discover -s test -p test_official_pregame_status.py
          python -m unittest discover -s test -p test_nfl_official_active_news.py
          node --test test/nfl-goblin-official-active-mentions.test.cjs
          python - <<'PY'
          import runpy,urllib.request,collections
          mod=runpy.run_path('scripts/collect-nfl-official-game-status.py')
          url='https://fantasy-www.nfl.com/news/nfl-week-11-injury-report-2026-season'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
              h=r.read(4500000).decode('utf8','replace')
          p=mod['ReportParser']();p.feed(h)
          t=[x[1] for x in p.blocks if x[0] in ('h3','h2')]
          bs=[x for x in p.blocks if x[0]=='li' and x[1].startswith(('OUT:','DOUBTFUL:','QUESTIONABLE:'))]
          roster=mod['dataset']('weekly_rosters')
          season=[x for x in roster if int(x.get('season',0))==2026 and 10<=int(x.get('week',0))<=11 and x.get('team') in ('IND','HOU')]
          print('DIAGNOSTIC_OFFICIAL',{'teamsHeader':[x for x in t if x.upper() in ('COLTS','TEXANS')],'statuses':len(bs),
           'statusesWithLinks':sum(bool(x[2]) for x in bs),'linkedNameCounts':[len(x[2]) for x in bs[:8]],
           'priorRosterEntries':len(season),'priorGSIS':len({x.get('gsis_id') for x in season})})
          PY
          python scripts/collect-nfl-official-game-status.py > /tmp/official_nfl_counts || { tail -n 12 /tmp/official_nfl_counts; exit 1; }
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/official_nfl_counts').read_text().splitlines()[-1])
          if d.get('officialReportedStatuses',0)<2 or d.get('medicalClearanceVerified') is not False:
              raise RuntimeError('Current official injury report not accepted')
          o=json.loads(pathlib.Path('outputs/nfl/availability/official-report-latest.json').read_text())
          if not any('fantasy-www.nfl.com/news/' in s for s in o.get('sources',[])):
              raise RuntimeError('Working official NFL.com subdomain not used')
          print('PASS: real official reported statuses archived locally as safety exclusions',d['officialReportedStatuses'])
          PY
          python scripts/collect-nfl-explicit-active-news.py > /tmp/official_news_counts
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/official_news_counts').read_text().splitlines()[-1])
          if d.get('officialNewsArticles',0)<1 or d.get('activePlayersVerifiedForPicks')!=0:
              raise RuntimeError('Current official NFL.com news source not parsed or unsupported eligibility')
          print('PASS: official dated source recognized; no unverified game-day actives',d['officialNewsArticles'])
          PY

name: Chronological player statistic research audit
on:
  pull_request:
    paths: ['scripts/chronological-player-stat-audit.cjs','test/chronological-player-stat-audit.test.cjs','.github/workflows/chronological-player-stat-audit.yml']
  push:
    branches: [main]
    paths: ['scripts/chronological-player-stat-audit.cjs','test/chronological-player-stat-audit.test.cjs','.github/workflows/chronological-player-stat-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/chronological-player-stat-audit.test.cjs test/nba-research-pipeline-v1.test.cjs test/esports-prospective-archive.test.cjs
  evidence:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Confirm private research archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 402d4fceb29a2ec2f3d3b09d06ede8ba2dd4ef9a
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          path: nba
          persist-credentials: false
          sparse-checkout: |
            outputs/nba/history/2026-27
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          path: archive
          persist-credentials: false
          fetch-depth: 0
      - name: Evaluate pinned historical data without source requests
        run: |
          set -euo pipefail
          node public/scripts/chronological-player-stat-audit.cjs nba/outputs/nba/history/2026-27/20261124T182018692Z.json 52c36e5efb547b3c4a3170a713afcd3de0e2a909 archive

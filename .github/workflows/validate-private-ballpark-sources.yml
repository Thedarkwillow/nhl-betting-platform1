name: Validate private Ballpark-style source registry
on:
  pull_request:
    paths: ['.github/workflows/validate-private-ballpark-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: d0a4485aea093ae822fcb079da43b12ec2dee517
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source registry and CSV integrity tests
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest discover -s test -p test_playerwon_shift_import.py
          node --check src/playerwon-shift-reconciliation-v1.cjs
          node - <<'NODE'
          const r=require('./config/ballpark-style-source-registry-v1.json');
          if(r.sources.length!==12||new Set(r.sources.map(x=>x.id)).size!==12||r.sources.some(x=>x.automatedCollectionEnabled||x.modelEligible||x.publicRedistributionApproved))throw Error('Source approval gates failed');
          console.log(JSON.stringify({registeredSources:r.sources.length,automaticCollectorsEnabled:0,modelPromoted:false}));
          NODE

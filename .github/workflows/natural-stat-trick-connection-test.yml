name: Natural Stat Trick approved historical and current-season connection test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/natural-stat-trick-connection-test.yml']
permissions:
  contents: read
concurrency:
  group: nst-historical-connection-test
  cancel-in-progress: false
jobs:
  test-historical-endpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - season: '20172018'
            game: '21138'
            label: historical
          - season: '20262027'
            game: '20310'
            label: current-season
    steps:
      - name: Check approval and request one exact game per season
        env:
          NST_ACCESS_KEY: ${{ secrets.NST_ACCESS_KEY }}
          NST_TEST_SEASON: ${{ matrix.season }}
          NST_TEST_GAME: ${{ matrix.game }}
          NST_TEST_LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.parse, urllib.request, urllib.error, json, socket, ssl
          key = os.environ.get("NST_ACCESS_KEY", "").strip()
          if not key:
              print("::error::Configure NST_ACCESS_KEY in this public repository's Actions secrets.")
              raise SystemExit(1)
          if not re.fullmatch(r"[A-Za-z0-9_-]{16,128}", key):
              print("::error::Access key format requires review.")
              raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          season, game, label = (os.environ["NST_TEST_SEASON"], os.environ["NST_TEST_GAME"], os.environ["NST_TEST_LABEL"])
          if (season, game) not in (("20172018","21138"),("20262027","20310")):
              raise SystemExit(1)
          args = urllib.parse.urlencode({"season":season,"game":game,"key":key})
          request = urllib.request.Request("https://data.naturalstattrick.com/game.php?" + args, headers={"User-Agent":"Private-NHL-Research/1.0"})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=50) as response:
                  payload = response.read(12_000_001)
                  if len(payload) > 12_000_000:
                      print("::error::Provider response exceeded 12 MB budget.")
                      raise SystemExit(1)
                  text = payload.decode("utf-8", errors="replace")
          except urllib.error.HTTPError as err:
              print("::error::Provider returned HTTP " + str(err.code) + "; no key or body logged.")
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, ssl.SSLError, OSError) as err:
              reason = getattr(err, "reason", err)
              category = ("DNS resolution" if isinstance(reason, socket.gaierror) else
                          "TLS certificate or protocol" if isinstance(reason, ssl.SSLError) else
                          "request timeout" if isinstance(reason, TimeoutError) else
                          "connection refused" if isinstance(reason, ConnectionRefusedError) else
                          "other network error")
              print("::error::Natural Stat Trick transport: " + category + "; no URLs/body/credentials logged.")
              raise SystemExit(1)
          except Exception:
              print("::error::Unexpected response-processing issue; no data logged.")
              raise SystemExit(1)
          lower = text.lower()
          if not text.strip() or any(x in lower[:4000] for x in ("invalid key","access denied","key is pending","rate limit exceeded","insufficient tokens","not authorized")):
              print("::warning::Historical endpoint returned a possible access or quota notice; data access not established.")
              raise SystemExit(1)
          try:
              parsed = json.loads(text)
              shape = "JSON array" if isinstance(parsed,list) else "JSON object" if isinstance(parsed,dict) else "JSON scalar"
          except ValueError:
              shape = "HTML table-like" if "<table" in lower else "other unverified text"
          if shape not in ("JSON array", "JSON object", "HTML table-like"):
              print("::error::Unrecognized response format; no data logged.")
              raise SystemExit(1)
          if label == "current-season":
              # Official private boxscore collection verified this VAN/NYR game final on Nov 13.
              # Require both team identities plus an actual table/row-shaped response; do not log body.
              is_van = bool(re.search(r"\bvancouver\b|\bcanucks\b|\bvan\b", lower))
              is_nyr = bool(re.search(r"\brangers\b|\bnyr\b", lower))
              structure = ("<table" in lower and "<tr" in lower) or shape in ("JSON object", "JSON array")
              if not (is_van and is_nyr and structure):
                  print("::error::Current-season response does not prove the expected completed game and table shape.")
                  raise SystemExit(1)
          print(label + " endpoint HTTP success; response format: " + shape + ".")
          print("Connectivity and game identity only; model schema and storage/training/display rights remain separate gates.")
          PY

name: Validate private player context evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-player-context-private.yml']
permissions:
  contents: read
concurrency:
  group: private-player-context-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 4832429fcce026783d378d6d01fb44dc72d664a4
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private tests and cached report validation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = 4832429fcce026783d378d6d01fb44dc72d664a4
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! npm test >"$log" 2>&1; then echo '::error::Private regression failed'; exit 1; fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$log"
          for script in scripts/report-nhl-standard-forward-improvement.cjs scripts/report-nfl-independent-forward.cjs scripts/report-source-completion-evidence.cjs; do
            if ! node "$script" >"$log" 2>&1; then echo "::error::Cached report failed: $script"; exit 1; fi
          done
          node - <<'NODE'
          const n=require('./outputs/health/nhl-standard-forward-improvement-latest.json'),f=require('./outputs/nfl/backtests/independent-source-forward-latest.json');
          if(n.playerContextCoverage?.kind!=='nhl_player_context_coverage_v1'||n.positionDefenseAblation?.kind!=='nhl_position_defense_ablation_v1'||f.playerContextCoverage?.kind!=='nfl_player_context_coverage_v1'||f.positionMatchupAblation?.kind!=='nfl_position_matchup_ablation_v1'||require('./outputs/health/source-completion-readiness-latest.json').roleSourceCoverage?.kind!=='nhl_role_source_coverage_v1')throw Error('Missing report evidence');
          console.log('PASS: private context report structure verified.');
          NODE
  status:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish validation status only
        env:
          RESULT: ${{ needs.validate.result }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          node -e 'require("fs").writeFileSync("data/player-context-validation.json",JSON.stringify({kind:"player_context_validation_status_v1",privateHead:"4832429fcce026783d378d6d01fb44dc72d664a4",result:process.env.RESULT,runId:process.env.RUN_ID,recordedAt:new Date().toISOString(),modelPromoted:false})+"\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player-context-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'status: private player context validation' >/dev/null
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

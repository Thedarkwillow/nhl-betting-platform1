name: PrizePicks compact normalization regressions
on:
  pull_request:
    paths: ['src/independent-provider-export-v1.cjs','test/independent-provider-export-v1.test.cjs','scripts/prizepicks-one-time-nov25.cjs','test/prizepicks-one-time-nov25.test.cjs','.github/workflows/prizepicks-compact-normalization.yml']
  push:
    branches: [main]
    paths: ['src/independent-provider-export-v1.cjs','test/independent-provider-export-v1.test.cjs','scripts/prizepicks-one-time-nov25.cjs','test/prizepicks-one-time-nov25.test.cjs','.github/workflows/prizepicks-compact-normalization.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/independent-provider-export-v1.test.cjs test/prizepicks-one-time-nov25.test.cjs test/esports-zero-credit-coverage.test.cjs test/underdog-bounded-capture-reconcile.test.cjs

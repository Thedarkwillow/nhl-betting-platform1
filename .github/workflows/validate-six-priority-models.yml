name: Validate NHL NFL Market Models and Future Trial Gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-six-priority-models.yml'
permissions:
  contents: read
jobs:
  review-private-prospective-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require private token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: feature/six-priority-model-evidence-20261120
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks and focused tests
        working-directory: private
        run: |
          set -euo pipefail
          for f in src/nhl-pregame-availability-v2.cjs src/nhl-standard-quality-challenger-v2.cjs src/nfl-directional-usage-challenger-v3.cjs src/six-priority-future-scorecard.cjs scripts/report-six-priority-future-scorecard.cjs scripts/freeze-partner-nhl-pregame.cjs scripts/freeze-nfl-partner-pregame.cjs; do
            node --check "$f"
          done
          node --test test/six-priority-market-challenger-future.test.cjs test/nhl-standard-adaptive-research.test.cjs test/nfl-directional-v2-prospective.test.cjs
      - name: Run precommitted first-Git future trial audit
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/report-six-priority-future-scorecard.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('outputs/health/six-priority-future-evidence-latest.json'));
          assert.equal(j.originalPlatformSettlementsVerified,false);
          assert.equal(j.modelPromoted,false);
          assert.equal(j.autoWagers,0);
          console.log(JSON.stringify({nhl:j.nhl.all.decided,nfl:j.nfl.all.decided,promoted:j.modelPromoted}));
          NODE

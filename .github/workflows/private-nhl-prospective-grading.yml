# Owner-requested 2026-11-22: regrade original first-Git NHL prospectives with new clustered future acceptance gate; no backdated model picks.
# Refresh yesterday Pacific official NHL player outcomes BEFORE prospective grading; no game may be falsely final.
# November 10 official FINAL backfill verified (Nov 9 NHL: 3/3 final), grade original frozen research only.
# Manual postgame audit trigger 2026-11-09 (no backdated predictions; grade official finals only).
name: Private NHL prospective grading and baseline audit via public runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-prospective-grading.yml']
  schedule:
    - cron: '10 2 * * *'
      timezone: America/Los_Angeles
    - cron: '20 8 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: free-runner-private-nhl-official-grading
  cancel-in-progress: false
jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private research access
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: fix/nov23-grade-original-full-final-daily-nhl
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full-slate original-Git final-only grade without paid or NHL source requests
        working-directory: private
        run: |
          set -euo pipefail
          node --check scripts/report-nhl-2026-11-21-slate-grade.cjs
          node --test test/nhl-slate-graded-summary.test.cjs test/grade-nhl-predictions.test.cjs test/nhl-frozen-individual-props.test.cjs
          node - <<'NODE'
          const fs=require('node:fs'),src=fs.readFileSync('scripts/report-nhl-2026-11-21-slate-grade.cjs','utf8');
          if(!src.includes('official.scheduledGames<1')||
           !src.includes('all14GamesVerified:result.officialGamesTotal===14')||
           src.includes('official.scheduledGames!==14'))
            throw Error('NHL grader still assumes Nov 21 fourteen-game schedule');
          console.log('PASS: arbitrary-sized official full-final NHL slate, exact pregame directions');
          NODE
  grade-private-only:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Require narrowly scoped private access
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private checkout secret missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          path: private
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate strict official NHL final outcomes and original Git precommit
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)";trap 'rm -f "$log"' EXIT
          if ! node --test test/grade-nhl-predictions.test.cjs test/nhl-frozen-individual-props.test.cjs test/nhl-partner-pregame-freeze.test.cjs test/nhl-prospective-validation.test.cjs test/nhl-prospective-slate-baseline-audit.test.cjs test/nhl-frozen-baseline-challenge.test.cjs test/nhl-standard-market-diagnostics.test.cjs test/nhl-standard-triple-challenger.test.cjs test/nhl-standard-forward-improvement.test.cjs test/nhl-sog-opportunity-challengers.test.cjs test/nhl-sog-line-movement.test.cjs test/nhl-simple-pregame-challengers.test.cjs test/nhl-slate-cluster-validation.test.cjs test/nhl-all-tier-reliability.test.cjs test/nhl-all-tier-exact-mass-calibration.test.cjs test/nhl-specialist-probability-lab.test.cjs test/forward-evidence-reliability.test.cjs test/roadmap-ten-labs.test.cjs test/roadmap-calibration-format-coverage.test.cjs test/nhl-standard-future-agreement-v1.test.cjs test/nhl-goblin-past-only-calibration-v1.test.cjs test/nhl-lineup-evidence-release-v1.test.cjs test/prizepicksapi-november-quota-lock.test.cjs test/nhl-metered-schedule-budget.test.cjs > "$log" 2>&1; then
            echo "::error::Private precommit / settlement-grading regression failed."
            exit 1
          fi
      - name: Validate prospective multifactor evidence and source chronology
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node --test test/nhl-pregame-live-context-v1.test.cjs test/nhl-multifactor-future-v1.test.cjs >"$log" 2>&1; then
            echo "::error::Multifactor future-source tests failed. No trial score will be published."
            exit 1
          fi
          echo "PASS: future-only NHL live-context and baseline audit regression."
      - name: Collect only yesterday's FINAL official NHL games before any grading
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Yesterday is computed in actual Pacific time, never from UTC.
          # Official results may still be incomplete right after midnight;
          # fail closed and let the scheduled 02:10/08:20 retries recover.
          OFFICIAL_FINAL_DATE="$(TZ=America/Los_Angeles date -d 'yesterday' '+%Y-%m-%d')"
          [[ "$OFFICIAL_FINAL_DATE" =~ ^202[6-9]-[0-9]{2}-[0-9]{2}$ ]] ||
            { echo "::error::Unexpected previous-Pacific-day date"; exit 1; }
          export OFFICIAL_FINAL_DATE
          printf 'OFFICIAL_FINAL_DATE=%s\n' "$OFFICIAL_FINAL_DATE" >> "$GITHUB_ENV"
          echo "Official NHL full-final day selected: $OFFICIAL_FINAL_DATE"
          # The existing official NHL importer saves faceoffs, hits, saves,
          # time on ice, goalie fantasy evidence and stats, with bounded retries.
          if ! node scripts/collect-player-stats.cjs "$OFFICIAL_FINAL_DATE" > /tmp/nhl-final-collection.log 2>&1; then
            echo "::error::Official NHL player statistics refresh failed; refusing stale postgame grade."
            tail -n 5 /tmp/nhl-final-collection.log | cut -c 1-200
            exit 1
          fi
          node - <<'NODE'
          const fs=require('node:fs'),day=process.env.OFFICIAL_FINAL_DATE;
          const doc=JSON.parse(fs.readFileSync('outputs/player-stats/'+day+'.json','utf8'));
          if(doc.requestedDate!==day||doc.source!=='NHL public API'||
             doc.sourceSchemaVersion!==5||
             !Number.isInteger(doc.scheduledGames)||doc.scheduledGames<0||
             doc.completedGames!==doc.scheduledGames||
             doc.collectedGames!==doc.scheduledGames||
             !Array.isArray(doc.errors)||doc.errors.length!==0||
             !Array.isArray(doc.players)||
             (doc.scheduledGames>0 &&
               (doc.players.length===0||
                 new Set(doc.players.map(x=>x.gameId)).size!==doc.scheduledGames)))
            throw Error('Not all official NHL games have complete player boxscores; no prospective grade');
          console.log(JSON.stringify({officialSource:'NHL public API',
            originalGameDay:day,scheduled:doc.scheduledGames,
            allOfficiallyFinal:doc.scheduledGames===doc.completedGames,
            boxscoresCollected:doc.collectedGames,
            originalPlayerRowsPrivate:doc.players.length,
            unsupportedSupplementalFieldsRemainUnverified:(doc.supplementalWarnings||[]).length,
            verifiedPlatformSettlement:false}));
          NODE
          node scripts/build-player-history.cjs >/tmp/nhl-official-history.log 2>&1 ||
            { echo "::error::Cannot rebuild NHL player history with yesterday official finals"; exit 1; }
      - name: Bounded official NHL goal-credit and shared-ice research collection
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Nonblocking historical research; never interfere with final grading.
          if test -f scripts/collect-nhl-goal-credit-shifts.cjs; then
            log="$(mktemp)"; trap 'rm -f "$log"' EXIT
            if NHL_COMPONENT_BATCH=12 timeout 150s node scripts/collect-nhl-goal-credit-shifts.cjs >"$log" 2>&1; then
              grep -E '^\{"attempted":[0-9]+' "$log" || true
            else
              echo "::warning::Optional NHL shared-ice collector incomplete; existing final grading continues."
            fi
          fi
      - name: Optional bounded PlayerWON gap backfill and matchup audit
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if test -f scripts/backfill-playerwon-reconciled-shifts.cjs; then
            if PLAYERWON_BATCH=3 timeout 150s node scripts/backfill-playerwon-reconciled-shifts.cjs >"$log" 2>&1; then
              grep -E '^\{"playerwonAttempted":[0-9]+' "$log" || true
            else
              echo "::warning::Optional PlayerWON gap trial incomplete; final grading unaffected."
            fi
            if ! timeout 180s node scripts/report-nhl-position-multiseason-v3.cjs >"$log" 2>&1; then
              echo "::warning::Optional matched NHL benchmark report unavailable."
            fi
          fi
      - name: Grade only officially final NHL games and analyze frozen baseline challengers
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          # Always rebuild the original Git-backed cohort from first commit history
          # AFTER the official final boxscores update; never reuse yesterday's ledger.
          for script in scripts/grade-nhl-predictions.cjs scripts/build-nhl-private-ledger-and-labs.cjs scripts/report-nhl-prospective-model-release.cjs scripts/report-nhl-prospective-validation.cjs scripts/report-nhl-frozen-baseline-challenge.cjs scripts/report-nhl-frozen-simple-challengers.cjs scripts/report-nhl-standard-triple-challengers.cjs scripts/report-nhl-pregame-close-research.cjs scripts/report-nhl-standard-forward-improvement.cjs scripts/report-nhl-multifactor-future-scorecard.cjs; do
            if ! node "$script" > "$log" 2>&1; then
              if [[ "$script" == "scripts/report-nhl-frozen-baseline-challenge.cjs" ]]; then
                grep "^Refusing " "$log" | tail -n 1 | cut -c 1-180 || true
              fi
              echo "::error::NHL audit script ${script} failed; no prospective accuracy claimed. Raw logs stay private."
              exit 1
            fi
          done
          echo "PASS: refreshed private official-outcome and frozen-baseline audits; unfinished games remain pending."
      - name: Grade all official FINAL games from the actual previous Pacific day
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/report-nhl-2026-11-21-slate-grade.cjs
          node --test test/nhl-slate-graded-summary.test.cjs > /tmp/nhl-slate-grade-test.log 2>&1 || {
            echo "::error::NHL exact-original full-final grading regression failed"; exit 1;
          }
          node scripts/report-nhl-2026-11-21-slate-grade.cjs "$OFFICIAL_FINAL_DATE" > /tmp/nhl-yesterday-private-grade.json
          node - <<'NODE'
          const fs=require('node:fs'),day=process.env.OFFICIAL_FINAL_DATE;
          const stats=JSON.parse(fs.readFileSync('outputs/player-stats/'+day+'.json','utf8'));
          const x=JSON.parse(fs.readFileSync('outputs/health/nhl-'+day+'-all-games-graded.json','utf8'));
          if(x.slateDate!==day||
             x.status!=='all_games_official_final_original_frozen_prop_research_only'||
             x.officialGamesTotal!==stats.scheduledGames||
             x.games.length!==stats.scheduledGames||
             x.allGamesVerified!==true||
             x.all.registered!==x.playerDetails.length||
             x.firstGitPregameOnly!==true||
             x.originalSelectedSideNeverRecomputed!==true||
             x.all.correct+x.all.incorrect!==x.all.decided||
             x.originalPlatformSettlementVerified!==false||
             x.automaticBettingLineupsApproved!==false||x.actualWagersPlaced!==0)
            throw Error('Refusing to publish an incomplete original NHL official slate');
          console.log(JSON.stringify({day,
            scheduledAndOfficialFinalGames:stats.scheduledGames,
            originalFrozenSelections:x.all.registered,
            decided:x.all.decided,wins:x.all.correct,losses:x.all.incorrect,
            pushes:x.all.push,pending:x.all.pending,
            standard:x.tiers.Standard.decided,goblin:x.tiers.Goblin.decided,
            demon:x.tiers.Demon.decided,
            originalAppSettlementVerified:false}));
          NODE
      - name: Archive grading and benchmarks in private repository only
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          files=(outputs/grading/nhl-latest.json
            "outputs/player-stats/${OFFICIAL_FINAL_DATE}.json"
            outputs/history/players.json
            outputs/research/registry/nhl-precommitted-ledger-latest.json
            outputs/health/nhl-roadmap-readiness-latest.json
            outputs/health/nhl-source-coverage-latest.json
            outputs/research/correlation/nhl-count-stat-dependence-latest.json
            outputs/health/nhl-prospective-model-release-latest.json
            outputs/health/nhl-prospective-validation-latest.json
            outputs/health/nhl-frozen-baseline-challenge-latest.json
            outputs/health/nhl-frozen-simple-challengers-latest.json
            outputs/health/nhl-standard-triple-challenger-latest.json
            outputs/health/nhl-standard-forward-improvement-latest.json
            outputs/health/nhl-pregame-source-close-latest.json
            outputs/health/nhl-multifactor-future-scorecard-latest.json
            "outputs/health/nhl-${OFFICIAL_FINAL_DATE}-all-games-graded.json")
          (("${#files[@]}" > 0)) || { echo "::error::No NHL grading or baseline output"; exit 1; }
          git add -f -- "${files[@]}"
          for file in outputs/nhl/research/goal-credit-shifts/*.json; do
            if test -f "$file"; then git add -f -- "$file"; fi
          done
          for file in outputs/nhl/research/playerwon-shifts/*.csv outputs/nhl/research/playerwon-shifts/*.json outputs/nhl/research/playerwon-reconciled/*.json outputs/health/nhl-position-multiseason-v3-latest.json; do
            if test -f "$file"; then git add -f -- "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No changed official grading results."
            exit 0
          fi
          git commit -m "data: private NHL prospective grading and frozen baseline audit" >/dev/null
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git -c rebase.autoStash=true rebase -q -X theirs origin/main
            if git push -q origin HEAD:main; then
              echo "PASS: private official NHL grade and challenger reports durably saved."
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::NHL private grading archive push failed";exit 1

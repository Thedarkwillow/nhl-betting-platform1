# Refresh yesterday Pacific official NHL player outcomes BEFORE prospective grading; no game may be falsely final.
# November 10 official FINAL backfill verified (Nov 9 NHL: 3/3 final), grade original frozen research only.
# Manual postgame audit trigger 2026-11-09 (no backdated predictions; grade official finals only).
name: Private NHL prospective grading and baseline audit via public runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-prospective-grading.yml']
  schedule:
    - cron: '10 2 * * *'
      timezone: America/Los_Angeles
    - cron: '20 8 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: free-runner-private-nhl-official-grading
  cancel-in-progress: false
jobs:
  grade-private-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Require narrowly scoped private access
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private checkout secret missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          path: private
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate strict official NHL final outcomes and original Git precommit
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)";trap 'rm -f "$log"' EXIT
          if ! node --test test/grade-nhl-predictions.test.cjs test/nhl-frozen-individual-props.test.cjs test/nhl-partner-pregame-freeze.test.cjs test/nhl-prospective-validation.test.cjs test/nhl-frozen-baseline-challenge.test.cjs test/nhl-standard-market-diagnostics.test.cjs test/nhl-standard-triple-challenger.test.cjs test/nhl-sog-opportunity-challengers.test.cjs test/nhl-sog-line-movement.test.cjs test/nhl-simple-pregame-challengers.test.cjs > "$log" 2>&1; then
            echo "::error::Private precommit / settlement-grading regression failed."
            exit 1
          fi
      - name: Collect only yesterday's FINAL official NHL games before any grading
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Yesterday is computed in actual Pacific time, never from UTC.
          # Official results may still be incomplete right after midnight;
          # fail closed and let the scheduled 02:10/08:20 retries recover.
          OFFICIAL_FINAL_DATE="$(TZ=America/Los_Angeles date -d 'yesterday' '+%Y-%m-%d')"
          [[ "$OFFICIAL_FINAL_DATE" =~ ^202[6-9]-[0-9]{2}-[0-9]{2}$ ]] ||
            { echo "::error::Unexpected previous-Pacific-day date"; exit 1; }
          export OFFICIAL_FINAL_DATE
          printf 'OFFICIAL_FINAL_DATE=%s\n' "$OFFICIAL_FINAL_DATE" >> "$GITHUB_ENV"
          echo "Official NHL full-final day selected: $OFFICIAL_FINAL_DATE"
          # The existing official NHL importer saves faceoffs, hits, saves,
          # time on ice, goalie fantasy evidence and stats, with bounded retries.
          if ! node scripts/collect-player-stats.cjs "$OFFICIAL_FINAL_DATE" > /tmp/nhl-final-collection.log 2>&1; then
            echo "::error::Official NHL player statistics refresh failed; refusing stale postgame grade."
            tail -n 5 /tmp/nhl-final-collection.log | cut -c 1-200
            exit 1
          fi
          node - <<'NODE'
          const fs=require('node:fs'),day=process.env.OFFICIAL_FINAL_DATE;
          const doc=JSON.parse(fs.readFileSync('outputs/player-stats/'+day+'.json','utf8'));
          if(doc.requestedDate!==day||doc.source!=='NHL public API'||
             doc.sourceSchemaVersion!==5||
             !Number.isInteger(doc.scheduledGames)||doc.scheduledGames<0||
             doc.completedGames!==doc.scheduledGames||
             doc.collectedGames!==doc.scheduledGames||
             !Array.isArray(doc.errors)||doc.errors.length!==0||
             !Array.isArray(doc.players)||
             (doc.scheduledGames>0 &&
               (doc.players.length===0||
                 new Set(doc.players.map(x=>x.gameId)).size!==doc.scheduledGames)))
            throw Error('Not all official NHL games have complete player boxscores; no prospective grade');
          console.log(JSON.stringify({officialSource:'NHL public API',
            originalGameDay:day,scheduled:doc.scheduledGames,
            allOfficiallyFinal:doc.scheduledGames===doc.completedGames,
            boxscoresCollected:doc.collectedGames,
            originalPlayerRowsPrivate:doc.players.length,
            unsupportedSupplementalFieldsRemainUnverified:(doc.supplementalWarnings||[]).length,
            verifiedPlatformSettlement:false}));
          NODE
          node scripts/build-player-history.cjs >/tmp/nhl-official-history.log 2>&1 ||
            { echo "::error::Cannot rebuild NHL player history with yesterday official finals"; exit 1; }
      - name: Grade only officially final NHL games and analyze frozen baseline challengers
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          # Always rebuild the original Git-backed cohort from first commit history
          # AFTER the official final boxscores update; never reuse yesterday's ledger.
          for script in scripts/grade-nhl-predictions.cjs scripts/build-nhl-private-ledger-and-labs.cjs scripts/report-nhl-prospective-model-release.cjs scripts/report-nhl-prospective-validation.cjs scripts/report-nhl-frozen-baseline-challenge.cjs scripts/report-nhl-frozen-simple-challengers.cjs scripts/report-nhl-standard-triple-challengers.cjs scripts/report-nhl-standard-forward-improvement.cjs; do
            if ! node "$script" > "$log" 2>&1; then
              if [[ "$script" == "scripts/report-nhl-frozen-baseline-challenge.cjs" ]]; then
                grep "^Refusing " "$log" | tail -n 1 | cut -c 1-180 || true
              fi
              echo "::error::NHL audit script ${script} failed; no prospective accuracy claimed. Raw logs stay private."
              exit 1
            fi
          done
          echo "PASS: refreshed private official-outcome and frozen-baseline audits; unfinished games remain pending."
      - name: Archive grading and benchmarks in private repository only
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          files=(outputs/grading/nhl-latest.json
            "outputs/player-stats/${OFFICIAL_FINAL_DATE}.json"
            outputs/history/players.json
            outputs/research/registry/nhl-precommitted-ledger-latest.json
            outputs/health/nhl-roadmap-readiness-latest.json
            outputs/health/nhl-source-coverage-latest.json
            outputs/research/correlation/nhl-count-stat-dependence-latest.json
            outputs/health/nhl-prospective-model-release-latest.json
            outputs/health/nhl-prospective-validation-latest.json
            outputs/health/nhl-frozen-baseline-challenge-latest.json
            outputs/health/nhl-frozen-simple-challengers-latest.json
            outputs/health/nhl-standard-triple-challenger-latest.json
            outputs/health/nhl-standard-forward-improvement-latest.json)
          (("${#files[@]}" > 0)) || { echo "::error::No NHL grading or baseline output"; exit 1; }
          git add -f -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No changed official grading results."
            exit 0
          fi
          git commit -m "data: private NHL prospective grading and frozen baseline audit" >/dev/null
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git -c rebase.autoStash=true rebase -q -X theirs origin/main
            if git push -q origin HEAD:main; then
              echo "PASS: private official NHL grade and challenger reports durably saved."
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::NHL private grading archive push failed";exit 1
# Requested 2026-11-12 Pacific: refresh and grade only official FINAL NHL games from 2026-11-11; existing safety gates unchanged.

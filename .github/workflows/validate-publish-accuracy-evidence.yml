name: Validate Accuracy And Platform Evidence Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-publish-accuracy-evidence.yml'
permissions:
  contents: write
concurrency:
  group: daily-accuracy-proof-archive-publication
  cancel-in-progress: false
jobs:
  build-private-public-accuracy-desk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require private checkout
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform1
          ref: main
          path: public
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit exact original-app and future trial evidence
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/report-exact-platform-proof-readiness.cjs
          node scripts/report-six-priority-future-scorecard.cjs
      - name: Archive only verified research counters privately
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/six-priority-future-evidence-latest.json outputs/health/platform-quote-settlement-readiness-latest.json
          if git diff --cached --quiet; then
            echo 'Unchanged first-Git and payout-proof evidence'
          else
            git commit -qm 'audit: archive first-Git future accuracy and exact-platform proof status'
            for attempt in 1 2 3 4; do
              git fetch -q origin main
              git -c rebase.autoStash=true rebase -q -X theirs origin/main || {
                git rebase --abort || true
                exit 1
              }
              if git push -q origin HEAD:main; then
                echo 'Verified private report archived'
                break
              fi
              if [ "$attempt" = 4 ]; then echo '::error::Private archive push failed'; exit 1; fi
              sleep "$attempt"
            done
          fi
      - name: Validate and publish only sanitized public archive in working tree
        run: |
          set -euo pipefail
          node --check public/assets/accuracy-platform-evidence.js
          node --check public/scripts/publish-accuracy-evidence-desk.cjs
          node public/scripts/test-accuracy-platform-evidence.cjs
          node public/scripts/publish-accuracy-evidence-desk.cjs public private
          node - <<'NODE'
          const d=require('./public/data/accuracy-platform-evidence.json');
          const unresolved=d.dailyNhl?.outstandingAppearanceReconciliation;
          // Null explicitly means the official-appearance reconciliation is
          // unverified, not zero. The public dashboard labels it as such.
          if(d.kind!=='public_six_priority_accuracy_platform_evidence_desk_v1'||
             d.automaticWagers!==0||d.privatePlayerRowsExposed!==0||
             d.providerProof.authenticatedPayoutEV!==null||
             d.providerProof.authenticatedOriginalAppOffers!==0||
             !(unresolved===null||unresolved===0))
             throw Error('Public source audit or privacy gate failed');
          console.log(unresolved===null?
            'PASS: safe public evidence; appearance reconciliation remains NOT VERIFIED':
            'PASS: safe public evidence; zero unresolved appearance records verified');
          NODE
      - name: Publish sanitized accuracy report to public website
        working-directory: public
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/accuracy-platform-evidence.json
          if git diff --cached --quiet; then
            echo 'Published dashboard data already matches latest evidence'
            exit 0
          fi
          git commit -qm 'data: publish sanitized NHL NFL accuracy, collection, future and payout-proof status'
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git -c rebase.autoStash=true rebase -q -X theirs origin/main || {
              git rebase --abort || true
              exit 1
            }
            if git push -q origin HEAD:main; then
              echo 'PASS: website evidence published safely'
              exit 0
            fi
            sleep "$attempt"
          done
          echo '::error::Could not publish safe dashboard data'
          exit 1

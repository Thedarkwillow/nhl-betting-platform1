name: Public specialist and original evidence followup
on:
  pull_request:
    paths: ['src/nhl-specialist-blend-research.cjs','test/nhl-specialist-blend-research.test.cjs','scripts/public-original-evidence-followup.cjs','.github/workflows/public-original-evidence-followup.yml','data/public-multi-sport-sprint.json']
  push:
    branches: [main]
    paths: ['.github/workflows/public-original-evidence-followup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/public-original-evidence-followup.cjs && node --test test/nhl-specialist-blend-research.test.cjs test/nhl-original-line-calibration-pairs.test.cjs test/nhl-lineup-evidence-release-v1.test.cjs test/lineup-reference-payout-bounds.test.cjs test/nhl-cohort-correlation-coverage.test.cjs test/nba-final-validation-v3.test.cjs test/nba-fixed-holdout-gate-v1.test.cjs
  evidence:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: archive
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: d02aa363ebbfbf5619411cf46a01efcd5ddc6299
          path: nba-evidence
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read original restricted archives, report only aggregate evidence
        run: RESEARCH_ARCHIVE_ROOT="$GITHUB_WORKSPACE/archive" NBA_PINNED_ARCHIVE_ROOT="$GITHUB_WORKSPACE/nba-evidence" node public/scripts/public-original-evidence-followup.cjs

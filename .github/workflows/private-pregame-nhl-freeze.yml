name: Private pregame NHL freeze on public free runner
on:
  workflow_dispatch:
  # Trusted main-only source change triggers one immediate integrated validation.
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-pregame-nhl-freeze.yml'
  schedule:
    - cron: '12 6 * * *'
      timezone: America/Los_Angeles
    - cron: '20 9 * * *'
      timezone: America/Los_Angeles
    - cron: '20 11 * * *'
      timezone: America/Los_Angeles
    - cron: '13 12 * * *'
      timezone: America/Los_Angeles
    - cron: '13 13 * * *'
      timezone: America/Los_Angeles
    - cron: '0 14 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: public-private-pregame-freeze
  cancel-in-progress: false
jobs:
  private-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private repository-scoped token
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::PRIVATE_RESEARCH_REPO_TOKEN missing"; exit 1; }
      - name: Checkout private main ONLY on trusted manual/scheduled workflow
        uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private source and precommitment gates
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if ! node --test test/nhl-sog-line-movement.test.cjs test/nhl-sog-opportunity-challengers.test.cjs test/partner-prizepicks-board.test.cjs test/partner-compact-0903.test.cjs test/nhl-partner-pregame-freeze.test.cjs test/nhl-nfl-five-priorities.test.cjs test/nhl-pregame-live-context-v1.test.cjs test/nhl-multifactor-future-v1.test.cjs >"$log" 2>&1; then
            echo "::error::Private pregame gate tests failed; no new selection created."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train and durably archive initial portable ML research artifact before capture
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          artifact=outputs/research/priority-common-ml-artifact.json
          if git cat-file -e "HEAD:$artifact" 2>/dev/null; then
            echo "Existing committed fixed ML research artifact retained."
          else
            log="$(mktemp)"; trap 'rm -f "$log"' EXIT
            python -m pip install 'scikit-learn>=1.5,<2' --quiet
            node --test test/priority-common-ml-shadow-v1.test.cjs
            if ! node scripts/export-priority-component-features.cjs >"$log" 2>&1; then
              echo "::error::Private ML feature export failed"; exit 1
            fi
            if ! python scripts/train-priority-common-ml-shadow.py >"$log" 2>&1; then
              echo "::error::Prior-season ML fit failed"; exit 1
            fi
            node - <<'NODE'
          const a=require('./outputs/research/priority-common-ml-artifact.json');
          if(a.kind!=='priority_common_features_logistic_v1'||a.researchOnly!==true||a.modelPromoted!==false||Object.keys(a.models||{}).length!==3||Object.values(a.models).some(m=>Object.keys(m).length!==3))throw Error('Incomplete portable model artifact');
          console.log(JSON.stringify({portableModels:Object.values(a.models).reduce((n,m)=>n+Object.keys(m).length,0),modelPromoted:false}));
          NODE
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$artifact"
            git commit -m "data: initial fixed prior-season portable ML research coefficients" >/dev/null
            saved=false
            for attempt in 1 2 3; do
              git fetch -q origin main
              git rebase -q origin/main || { git rebase --abort; exit 1; }
              if git push -q origin HEAD:main; then saved=true; break; fi
              sleep "$attempt"
            done
            test "$saved" = true
          fi
      - name: Refresh official game context before new source observation
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          node scripts/collect-nhl-official-roster-crosswalk.cjs >"$log" 2>&1 || echo "::warning::Official roster refresh unavailable."
          python scripts/collect-nhl-official-preview-status.py >"$log" 2>&1 || echo "::warning::Official preview unavailable; no clearance inferred."
          node scripts/collect-nhl-pregame-intel.cjs >"$log" 2>&1 || echo "::warning::External goalie context unavailable; no starter inferred."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in outputs/pregame-availability/official-roster-crosswalk-latest.json outputs/pregame-availability/roster-snapshots outputs/pregame-availability/official-preview-latest.json outputs/pregame-availability/official-preview-snapshots outputs/pregame-availability/latest.json outputs/pregame-availability/snapshots; do
            if test -e "$p"; then git add -f "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -qm 'data: current official roster and reported pregame context'
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            git push -q origin HEAD:main
          fi
      - name: Capture NEW actual-time complete NHL and NFL source in private checkout
        id: capture
        working-directory: private
        shell: bash
        env:
          PARTNER_CAPTURE_SLOT: manual
        run: |
          set -euo pipefail
          umask 077
          node scripts/collect-live-partner-nhl-nfl.cjs >/tmp/nhl-nfl-private-source-summary.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/nhl-nfl-private-source-summary.json','utf8'));
          if(p.status!=='saved_private_only'||!p.archiveDir||p.completePagination!==true)
            throw Error('No genuinely new complete private source capture');
          fs.appendFileSync(process.env.GITHUB_ENV,'PRIVATE_ARCHIVE='+p.archiveDir+'\n');
          NODE
      - name: Build NFL prior-week private research preview without making picks
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if node scripts/build-nfl-partner-board-research.cjs "$PRIVATE_ARCHIVE" > /tmp/private-nfl-preview-summary.json 2>/tmp/private-nfl-preview-error.log; then
            node - <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/private-nfl-preview-summary.json','utf8'));
          if(!x.snapshot||x.calibratedProbabilities!==false||x.officialNFLPicks!==0)
            throw Error('NFL private research preview does not satisfy safety contract');
          fs.appendFileSync(process.env.GITHUB_ENV,'NFL_RESEARCH_PREVIEW='+x.snapshot+'\n');
          NODE
          else
            echo "::warning::NFL prior-week matching unavailable; source still archived, no NFL picks."
          fi
      - name: Commit and push original source capture privately before research
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PRIVATE_ARCHIVE/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$PRIVATE_ARCHIVE"
          if test -n "${NFL_RESEARCH_PREVIEW:-}" && test -s "$NFL_RESEARCH_PREVIEW"; then
            git add -f "$NFL_RESEARCH_PREVIEW"
          fi
          git commit -m "data: new private live partner NHL NFL pregame source observation"
          for attempt in 1 2 3; do
            git fetch origin main
            git -c rebase.autoStash=true rebase -X theirs origin/main
            if git push origin HEAD:main; then
              echo "New source archived privately; no lines printed to public logs."
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Source capture was not durably archived privately"
          exit 1
      - name: Collect bounded sportsbook evidence after fresh board and before model freeze
        working-directory: private
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          node --test test/sportsbook-event-quota.test.cjs test/sportsbook-matched-model-research.test.cjs >"$log" 2>&1 || { echo "::error::Odds quota regression failed; no requests."; exit 1; }
          node scripts/collect-bounded-sportsbook-quotes.cjs >"$log" 2>&1 || echo "::warning::Bounded quote capture unavailable; no live consensus inferred."
          git add -f outputs/sportsbooks/bounded-live/*.json
          if ! git diff --cached --quiet; then
            git commit -qm 'data: bounded sportsbook observations before NHL research freeze'
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            git push -q origin HEAD:main
          fi
      - name: Collect independent NHL fallback when primary quota is exhausted
        working-directory: private
        shell: bash
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if ! test -f scripts/collect-independent-nhl-sportsbook-fallback.cjs; then
            echo "::warning::Independent fallback not deployed; existing freeze retained."
            exit 0
          fi
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node --test test/nhl-independent-sportsbook-fallback.test.cjs test/sportsgameodds-nhl.test.cjs test/sportsbook-matched-model-research.test.cjs >"$log" 2>&1; then
            echo "::warning::Independent fallback tests failed; no provider request."
            exit 0
          fi
          if ! node scripts/collect-independent-nhl-sportsbook-fallback.cjs >"$log" 2>&1; then
            echo "::warning::Independent fallback unavailable; existing freeze retained."
            exit 0
          fi
          if test -d outputs/sportsbooks/independent-nhl; then
            git add -f outputs/sportsbooks/independent-nhl/*.json
            if ! git diff --cached --quiet; then
              git commit -qm 'data: private independent NHL sportsbook evidence'
              git fetch -q origin main
              git rebase -q origin/main || { git rebase --abort; exit 1; }
              git push -q origin HEAD:main
            fi
          fi
      # Standard shadows are frozen with the same original private Git snapshot.
      # Manual late-night board checks accept fully paginated small NFL inventories.
      # Never replace champion model picks with unfitted challenger directions.
      - name: Construct separate research-only NHL selections from fresh source
        id: freeze
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if node scripts/freeze-partner-nhl-pregame.cjs "$PRIVATE_ARCHIVE" > /tmp/private-freeze-result.json 2>/tmp/private-freeze-error.log; then
            node - <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/private-freeze-result.json','utf8'));
          if(!x.snapshotPath||!Number.isInteger(x.selected)||x.selected<1)
            throw Error('No eligible explicit prospective individual research selections');
          fs.appendFileSync(process.env.GITHUB_ENV,'FREEZE_SNAPSHOT='+x.snapshotPath+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'valid=true\n');
          NODE
          else
            echo "::warning::No valid fresh prospective selection candidate. Source already archived; no retroactive picks."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Git commit AND remote push before earliest selected puck drop
        if: steps.freeze.outputs.valid == 'true'
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          check_time() {
            node - <<'NODE'
          const fs=require('node:fs');
          const s=JSON.parse(fs.readFileSync(process.env.FREEZE_SNAPSHOT,'utf8'));
          const picks=s.individualPropSelections;
          const f=s.privateFormatLineupResearch;
          const formats=['power','flex'].flatMap(format=>Object.values(f?.[format]||{}).filter(Boolean));
          if(formats.some(l=>!Array.isArray(l.picks)||l.picks.some(p=>!Number.isFinite(Date.parse(p.gameStartAt))||Date.parse(p.gameStartAt)-Date.now()<15*60000)))
            throw Error('Cannot freeze a format scenario within 15 minutes of puck drop');
          const sk=s.specialistIndividualResearch?.rows||[];
          if(!Array.isArray(sk)||sk.some(p=>!Number.isFinite(Date.parse(p.gameStartAt))||Date.parse(p.gameStartAt)-Date.now()<15*60000))
            throw Error('Cannot freeze specialist forecast within 15 minutes of puck drop');
          if(!Array.isArray(picks)||!picks.length||
             picks.some(p=>!Number.isFinite(Date.parse(p.gameStartAt))||
              Date.parse(p.gameStartAt)-Date.now()<15*60000))
            throw Error('Cannot claim new prospective picks within 15 minutes of game start');
          NODE
          }
          check_time
          git add -f "$FREEZE_SNAPSHOT"
          git commit -m "data: original private pregame NHL research selections"
          for attempt in 1 2 3; do
            git fetch origin main
            git -c rebase.autoStash=true rebase -X theirs origin/main
            check_time
            node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const s=JSON.parse(fs.readFileSync(process.env.FREEZE_SNAPSHOT,'utf8'));
          const commit=Date.parse(execFileSync('git',['log','-1','--format=%cI'],{encoding:'utf8'}).trim());
          if(!Number.isFinite(commit)||s.individualPropSelections.some(p=>commit>=Date.parse(p.gameStartAt)))
            throw Error('Frozen Git commit is not strictly earlier than every game');
          NODE
            if git push origin HEAD:main; then
              check_time
              echo "Private research candidate committed and pushed before earliest puck drop."
              node - <<'NODE'
          const s=require('./'+process.env.FREEZE_SNAPSHOT),f=s.privateFormatLineupResearch;
          console.log(JSON.stringify({commonMLRegistered:(s.matchupContextReviewV1?.rows||[]).filter(x=>x.commonML?.researchOnly===true&&x.commonML.calibrated===false&&x.commonML.modelPromoted===false).length,originalFrozenOnly:true,modelPromoted:false}));
          console.log(JSON.stringify({powerScenarioCount:Object.values(f?.power||{}).filter(Boolean).length,flexScenarioCount:Object.values(f?.flex||{}).filter(Boolean).length,individualSpecialistResearchCount:s.specialistIndividualResearch?.rows?.length||0,specialistExclusionCounts:s.specialistIndividualResearch?.excluded||{},specialistStatus:s.specialistIndividualResearch?.kind||s.specialistIndividualResearch?.status||'missing',officialPlatformSettlementVerified:false}));
          NODE
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::No confirmed timely prospective Git push. Candidate is NOT a frozen pick."
          exit 1
      - name: Do not claim settlement or official availability
        if: always()
        run: echo "This workflow never places wagers, certifies original app quotes, or publishes raw private props."

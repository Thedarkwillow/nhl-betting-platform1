name: Private two-team NHL matchup and sportsbook archive audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-two-team-matchup.yml']
  schedule:
    - cron: '36 9 * * *'
      timezone: America/Los_Angeles
    - cron: '36 13 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-nhl-two-team-matchup
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test research and no-spend invariants
        run: |
          set -euo pipefail
          umask 077
          pin=9b393e8fe5f2950c7596a334407456336e0c4971
          if ! test -f scripts/report-nhl-two-team-matchup.cjs; then
            git fetch -q origin "$pin"
            for f in scripts/collect-bounded-sportsbook-quotes.cjs scripts/reconcile-sportsbook-quota.cjs src/nhl-two-team-matchup-research.cjs scripts/report-nhl-two-team-matchup.cjs test/nhl-two-team-matchup-and-quota.test.cjs; do git show "$pin:$f" > "$f"; done
          fi
          node --check scripts/collect-bounded-sportsbook-quotes.cjs
          node --test test/nhl-two-team-matchup-and-quota.test.cjs test/sportsbook-event-quota.test.cjs test/nhl-sportsbook-event-bridge.test.cjs
      - name: Run historical matchup ablation and no-cost archived odds research
        run: |
          set -euo pipefail
          umask 077
          node scripts/report-nhl-two-team-matchup.cjs
      - name: Save research only privately
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/nhl-two-team-matchup-latest.json outputs/health/nhl-sportsbook-comparison-latest.json
          if test -d outputs/research/two-team-matchup; then git add -f outputs/research/two-team-matchup/*.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private two-team NHL matchup ablation and archived no-vig comparison'
          # Remove only pinned file overlays to avoid a dirty rebase before merge.
          if ! git diff --quiet; then git restore -- scripts/collect-bounded-sportsbook-quotes.cjs; fi
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

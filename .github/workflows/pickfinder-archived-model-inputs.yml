name: PickFinder archived model input processing
on:
  pull_request:
    paths: ['scripts/pickfinder-archived-model-inputs.cjs','scripts/pickfinder-esports-series-review.cjs','config/esports/pickfinder-series-review-*.json','scripts/pickfinder-native-history-reconciliation.cjs','scripts/pickfinder-nba-layout-recovery.cjs','test/pickfinder-nba-layout-recovery.test.cjs','scripts/pickfinder-profile-market-evidence.cjs','test/pickfinder-profile-market-evidence.test.cjs','research/pickfinder-public-identity-v1/historical-reviewed-identities/*.json','research/pickfinder-public-validation-v1/nba-final-history/*.json','test/pickfinder-archived-model-inputs.test.cjs','.github/workflows/pickfinder-archived-model-inputs.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder-archived-model-inputs.cjs','scripts/pickfinder-esports-series-review.cjs','config/esports/pickfinder-series-review-*.json','scripts/pickfinder-native-history-reconciliation.cjs','scripts/pickfinder-nba-layout-recovery.cjs','test/pickfinder-nba-layout-recovery.test.cjs','scripts/pickfinder-profile-market-evidence.cjs','test/pickfinder-profile-market-evidence.test.cjs','research/pickfinder-public-identity-v1/historical-reviewed-identities/*.json','research/pickfinder-public-validation-v1/nba-final-history/*.json','test/pickfinder-archived-model-inputs.test.cjs','.github/workflows/pickfinder-archived-model-inputs.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['PickFinder Premium public orchestration']
    types: [completed]
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/pickfinder-archived-model-inputs.test.cjs test/pickfinder-profile-market-evidence.test.cjs test/pickfinder-nba-layout-recovery.test.cjs
      - name: Process saved sporting evidence without new provider calls
        run: node --max-old-space-size=6144 scripts/pickfinder-archived-model-inputs.cjs "$RUNNER_TEMP/pickfinder-identity-review-packet.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pickfinder-identity-review-packet
          path: ${{ runner.temp }}/pickfinder-identity-review-packet.json
          retention-days: 7
          if-no-files-found: error

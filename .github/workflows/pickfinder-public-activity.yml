name: Public PickFinder activity readiness
on:
  pull_request:
    paths: ['scripts/publish-pickfinder-derived.cjs','test/publish-pickfinder-derived.test.cjs','scripts/pickfinder-public-activity.cjs','scripts/pickfinder-esports-original-offer-readiness.cjs','scripts/pickfinder-valorant-retrospective.cjs','scripts/pickfinder-dota-map-finals.cjs','config/esports/pickfinder-dota-player-review-*.json','test/pickfinder-dota-map-finals.test.cjs','scripts/pickfinder-esports-series-review.cjs','config/esports/independent-schedule-review-*.json','test/pickfinder-esports-original-offer-readiness.test.cjs','test/pickfinder-valorant-retrospective.test.cjs','scripts/pickfinder-public-evidence-audit.cjs','scripts/pickfinder-archived-model-inputs.cjs','scripts/pickfinder-reviewed-history-model.cjs','config/esports/pickfinder-series-review-*.json','test/pickfinder-public-activity.test.cjs','.github/workflows/pickfinder-public-activity.yml','assets/pickfinder-public-evidence.js']
  push:
    branches: [main]
    paths: ['scripts/publish-pickfinder-derived.cjs','test/publish-pickfinder-derived.test.cjs','scripts/pickfinder-public-activity.cjs','scripts/pickfinder-esports-original-offer-readiness.cjs','scripts/pickfinder-valorant-retrospective.cjs','scripts/pickfinder-dota-map-finals.cjs','config/esports/pickfinder-dota-player-review-*.json','test/pickfinder-dota-map-finals.test.cjs','scripts/pickfinder-esports-series-review.cjs','config/esports/independent-schedule-review-*.json','test/pickfinder-esports-original-offer-readiness.test.cjs','test/pickfinder-valorant-retrospective.test.cjs','scripts/pickfinder-public-evidence-audit.cjs','scripts/pickfinder-archived-model-inputs.cjs','scripts/pickfinder-reviewed-history-model.cjs','config/esports/pickfinder-series-review-*.json','test/pickfinder-public-activity.test.cjs','.github/workflows/pickfinder-public-activity.yml','research/pickfinder-public-identity-v1/historical-reviewed-identities/*.json','research/pickfinder-public-validation-v1/nba-final-history/*.json']
  workflow_run:
    workflows: ['PickFinder Premium public orchestration','Public-only PickFinder research validation']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pickfinder-activity-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - run: node --check assets/pickfinder-public-evidence.js && node --test test/publish-pickfinder-derived.test.cjs test/pickfinder-public-activity.test.cjs test/pickfinder-esports-original-offer-readiness.test.cjs test/pickfinder-valorant-retrospective.test.cjs test/pickfinder-dota-map-finals.test.cjs test/pickfinder-public-runner.test.cjs test/pickfinder-public-model-validation.test.cjs
  report:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build zero-request report
        run: node scripts/pickfinder-public-activity.cjs .
      - name: Publish only derived activity
        run: node scripts/publish-pickfinder-derived.cjs data/pickfinder-public-activity.json

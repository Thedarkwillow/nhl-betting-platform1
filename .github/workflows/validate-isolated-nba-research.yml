name: Validate isolated NBA research and source preflight
on:
  push:
    branches: [nba-isolated-research-v1-20261124]
    paths: ['.github/workflows/validate-isolated-nba-research.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 8bb05075e02ba69253aa49497b5f2a9e13a223b7
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate separate NBA contracts
        run: |
          set -euo pipefail
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          node --check scripts/run-nba-private-research-v1.cjs
          if ! node --test test/nba-research-pipeline-v1.test.cjs test/nba-frozen-research-grade-v1.test.cjs >"$log" 2>&1; then
            grep -E '^not ok|^# (tests|pass|fail)' "$log" || true
            exit 1
          fi
          grep -E '^# (tests|pass|fail)' "$log"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical parquet reader
        run: python -m pip install 'pyarrow>=18,<24'
      - name: Verify PDF extraction dependency
        run: command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
      - name: Live source preflight with no metered odds key
        env:
          NBA_ODDS_ENABLE: '0'
          NBA_HISTORICAL_MIRROR_RESEARCH: '1'
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node scripts/run-nba-private-research-v1.cjs >"$log" 2>&1; then
            echo 'NBA source preflight failed closed; private data not published.'
            exit 1
          fi
          node - "$log" <<'NODE'
          const fs=require('fs'),s=fs.readFileSync(process.argv[2],'utf8').trim().split('\n').at(-1),r=JSON.parse(s);
          if(r.kind!=='nba_isolated_research_readiness_v1'||r.sharedPaidProviderRequests!==0||r.actualWagersPlaced!==0||r.highConfidenceApproved!==0)throw Error('NBA safety contract');
          console.log(JSON.stringify(r));
          NODE
          echo 'No raw private rows or provider credentials published.'

      - name: Preserve actual NBA private observations on the isolated review branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8bb05075e02ba69253aa49497b5f2a9e13a223b7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nba
          git diff --cached --quiet && exit 0
          git commit -qm 'research: archive NBA source preflight and original research outputs privately'
          git push -q origin HEAD:refs/heads/nba-isolated-research-v1-20261124
          echo 'NBA observations archived privately; no production branch was modified.'

name: Public PickFinder morning evidence health
on:
  pull_request:
    paths: ['scripts/pickfinder-public-morning-audit.cjs','test/pickfinder-public-runner.test.cjs','test/pickfinder-public-morning-preflight.test.cjs','.github/workflows/morning-private-archive-health.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder-public-morning-audit.cjs','.github/workflows/morning-private-archive-health.yml']
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        options: ['06:00','09:00']
        default: '06:00'
      day:
        description: 'Pacific date to audit (YYYY-MM-DD). Blank uses the current Pacific date.'
        type: string
        required: false
  schedule:
    - cron: '20 7 * * *'
      timezone: America/Los_Angeles
    - cron: '47 7 * * *'
      timezone: America/Los_Angeles
    - cron: '20 10 * * *'
      timezone: America/Los_Angeles
    - cron: '47 10 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/pickfinder-public-runner.test.cjs test/pickfinder-public-morning-preflight.test.cjs test/morning-private-archive-health.test.cjs test/nba-esports-prepull-candidate-lock.test.cjs test/pickfinder-morning-archive-audit.test.cjs
  audit:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public immutable morning evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ (github.event.schedule == '20 10 * * *' || github.event.schedule == '47 10 * * *') && '09:00' || inputs.slot || '06:00' }}
          AUDIT_DAY: ${{ inputs.day }}
          AUDIT_CRON: ${{ github.event.schedule }}
          AUDIT_OUTPUT: ${{ runner.temp }}/pickfinder-morning-audit.json
        run: |
          flags=()
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then flags+=(--require-scheduled-core); fi
          node scripts/pickfinder-public-morning-audit.cjs . "$SLOT" "${flags[@]}"
      - name: Preserve read-only morning evidence even when core verification fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-pickfinder-morning-audit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pickfinder-morning-audit.json
          if-no-files-found: warn
          retention-days: 30

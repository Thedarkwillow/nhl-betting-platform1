name: Private NHL Standard prospective proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-standard-proof.yml']
  workflow_run:
    workflows: ['Private pregame NHL freeze on public free runner']
    types: [completed]
  schedule:
    - cron: '51 6,23 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-nhl-standard-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: archive
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and execute public-native Standard proof
        run: |
          set -euo pipefail
          umask 077
          node --test public/test/nhl-specialist-standard-proof.test.cjs public/test/nhl-standard-market-residual-v1.test.cjs
          export RESEARCH_ARCHIVE_ROOT="$GITHUB_WORKSPACE/archive"
          log="$RUNNER_TEMP/standard-proof"
          node public/scripts/report-nhl-standard-proof.cjs >"$log" 2>&1 || { echo "::error::Public Standard proof failed closed"; exit 1; }
          node - "$log" <<'NODE'
          const r=JSON.parse(require("fs").readFileSync(process.argv[2],"utf8"));console.log(JSON.stringify({accepted:r.accepted,newRows:r.newRows,newSelected:r.newSelected,modelPromoted:false}));
          NODE
          node -e 'const fs=require("fs"),r=require("./archive/outputs/health/nhl-standard-market-residual-latest.json");console.log(JSON.stringify(r))'
          mkdir -p archive/outputs/health
          PIN="$(git -C public rev-parse HEAD)" node -e 'require("fs").writeFileSync("archive/outputs/health/nhl-standard-proof-test-latest.json",JSON.stringify({testedCommit:process.env.PIN,generatedAt:new Date().toISOString(),passed:true,providerRequests:0})+"\n")'
      - name: Archive test evidence and prospective research privately
        working-directory: archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/nhl-standard-proof-test-latest.json outputs/health/nhl-standard-market-residual-latest.json
          if test -f outputs/health/nhl-standard-proof-latest.json; then git add -f outputs/health/nhl-standard-proof-latest.json; fi
          if test -d outputs/research/standard-proof-v1; then git add -f outputs/research/standard-proof-v1/*.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private Standard prospective strategy evidence'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

# Merged Standard prospective policy; re-grade at the late-night and morning windows without pulling paid odds.

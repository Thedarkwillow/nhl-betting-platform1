name: Validate private multi-sport accuracy evidence
on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Private repository branch or commit to validate
        required: true
        default: research/nfl-partner-observation-audit-20261113
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/validate-private-multisport-accuracy.yml']
  schedule:
    - cron: '40 10 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: validate-private-multisport-accuracy
  cancel-in-progress: false
jobs:
  test-private-accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private repository read access
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private repository access secret missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          path: private
          ref: ${{ inputs.private_ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check NFL quote evidence audit
        working-directory: private
        run: node --check scripts/audit-nfl-quote-evidence.cjs
      - name: Test authenticated quote gate, partner observation audit, and NFL chronological baselines
        working-directory: private
        run: node --test test/nfl-quote-evidence.test.cjs test/nfl-historical-stats-backtest.test.cjs test/nfl-development-model-selection.test.cjs
      - name: Test NHL frozen accuracy and paired game-cluster validation
        working-directory: private
        run: node --test test/nhl-standard-forward-improvement.test.cjs test/nhl-standard-triple-challenger.test.cjs test/nhl-frozen-baseline-challenge.test.cjs test/nhl-prospective-validation.test.cjs

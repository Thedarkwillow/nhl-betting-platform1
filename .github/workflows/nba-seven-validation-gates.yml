name: NBA seven-stage validation research
on:
  push:
    branches: [nba-seven-validation-gates-20261124]
    paths: ['.github/workflows/nba-seven-validation-gates.yml']
permissions:
  contents: read
concurrency:
  group: nba-seven-validation-research
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: nba-seven-validation-gates-20261124
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load immutable pregame archive and current private real-line evidence
        run: |
          set -euo pipefail
          git fetch -q origin 05ae5ca6975e8c011d780b9648a5771729b42648 main
          mkdir -p outputs/nba/isolated-bulk-history/injury-report-audit-v1
          git show 05ae5ca6975e8c011d780b9648a5771729b42648:outputs/nba/isolated-bulk-history/injury-report-audit-v1/selected-t90-listings.parquet > outputs/nba/isolated-bulk-history/injury-report-audit-v1/selected-t90-listings.parquet
          for dir in history calibration-history; do
            p="outputs/nba/authorized-providers/cohort-v1/$dir"
            if git cat-file -e "origin/main:$p" 2>/dev/null; then git archive origin/main "$p" | tar -x; fi
          done
      - name: Test prospective evidence and audit existing freezes on main
        run: |
          set -euo pipefail
          node --test test/nba-prospective-monitor-v1.test.cjs
          git worktree add --detach /tmp/nba-main-monitor origin/main
          cp scripts/audit-nba-prospective-monitor-v1.cjs /tmp/nba-main-monitor/scripts/
          mkdir -p outputs/nba/isolated-bulk-history/seven-validation-v1
          node /tmp/nba-main-monitor/scripts/audit-nba-prospective-monitor-v1.cjs > outputs/nba/isolated-bulk-history/seven-validation-v1/prospective-monitor.json
          cat outputs/nba/isolated-bulk-history/seven-validation-v1/prospective-monitor.json
      - run: python -m pip install 'pyarrow>=18,<24' 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2' 'lightgbm>=4.5,<5' 'xgboost>=2.1,<4'
      - name: Compare feature groups and distributions with separate calibration
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python -m py_compile scripts/run-nba-seven-validation.py
          python scripts/run-nba-seven-validation.py
      - name: Archive aggregate research metrics only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nba/isolated-bulk-history/seven-validation-v1
          git commit -qm 'research: seven-stage NBA validation metrics'
          git push -q origin HEAD:nba-seven-validation-gates-20261124

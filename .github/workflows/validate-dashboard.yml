name: Validate Public NHL Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'fix/**', 'feat/**']
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data.json'
      - 'scripts/collect-public-nhl-games.cjs'
      - 'scripts/test-public-nhl-games.cjs'
      - '.github/workflows/collect-public-nhl-games.yml'
      - 'scripts/validate-dashboard.cjs'
      - 'scripts/test-lineup-workspace.cjs'
      - 'scripts/test-six-priority-desk.cjs'
      - 'scripts/test-multi-sport-roadmap.cjs'
      - 'data/nhl-nfl-freeze-status.json'
      - 'data/model-scorecards.json'
      - 'data/source-line-movement.json'
      - 'scripts/publish-safe-nhl-nfl-line-movement.cjs'
      - 'scripts/test-publish-safe-nhl-nfl-line-movement.cjs'
      - 'scripts/publish-safe-pregame-scorecards.cjs'
      - 'scripts/test-publish-safe-pregame-scorecards.cjs'
      - 'scripts/test-model-scorecards.cjs'
      - 'scripts/test-public-capture-schedule.cjs'
      - '.github/workflows/validate-dashboard.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test public game-status normalization and provenance guards
        run: node --test scripts/test-public-nhl-games.cjs
      - name: Verify public NHL page JavaScript and research provenance
        run: node scripts/validate-dashboard.cjs
      - name: Test interactive NHL research lineup editor
        run: node scripts/test-lineup-workspace.cjs
      - name: Test seven-area public status, freshness and comparison safety
        run: node scripts/test-research-status.cjs
      - name: Test phone-ready six-roadmap evidence, freshness and unverified payout safeguards
        run: node scripts/test-six-priority-desk.cjs
      - name: Test NHL NFL sport selector, verified precommit status and stale-source warnings
        run: node --test scripts/test-multi-sport-roadmap.cjs
      - name: Test public NHL NFL original-precommit model grades and sanitized release
        run: node --test scripts/test-model-scorecards.cjs scripts/test-publish-safe-pregame-scorecards.cjs
      - name: Verify NHL NFL cross-day/same-day source line movement without private data leaks
        run: node --test scripts/test-publish-safe-nhl-nfl-line-movement.cjs
      - name: Validate no double provider probes before morning full captures
        run: node --test scripts/test-public-capture-schedule.cjs

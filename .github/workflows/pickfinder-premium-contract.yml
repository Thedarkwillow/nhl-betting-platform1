name: PickFinder Premium archive contract
on:
  pull_request:
    paths: ['scripts/pickfinder*','scripts/season-aware-*.cjs','test/season-aware-collection.test.cjs','scripts/collect-pickfinder-browser.cjs','test/pickfinder-browser.test.cjs','test/pickfinder-unattended-runner.test.cjs','test/pickfinder-pilot-reconcile.test.cjs','.github/workflows/pickfinder-premium-hosted.yml','test/pickfinder-premium-archive.test.cjs','scripts/pacific-morning-capture-gate.cjs','.github/workflows/pickfinder-premium-contract.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder*','scripts/season-aware-*.cjs','test/season-aware-collection.test.cjs','scripts/collect-pickfinder-browser.cjs','test/pickfinder-browser.test.cjs','test/pickfinder-unattended-runner.test.cjs','test/pickfinder-pilot-reconcile.test.cjs','.github/workflows/pickfinder-premium-hosted.yml','test/pickfinder-premium-archive.test.cjs','scripts/pacific-morning-capture-gate.cjs','.github/workflows/pickfinder-premium-contract.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/pickfinder-combinations.test.cjs test/pickfinder-quote-features.test.cjs test/season-aware-collection.test.cjs test/pickfinder-pilot-reconcile.test.cjs test/pickfinder-unattended-runner.test.cjs test/pickfinder-browser.test.cjs test/pickfinder-premium-archive.test.cjs scripts/test-pacific-morning-capture-gate.cjs


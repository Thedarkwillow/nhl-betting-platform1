name: Validate private NHL points shadow and Standard dual-baseline consistency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-private-nov19-points-consistency.yml'
permissions:
  contents: read
concurrency:
  group: private-nov19-points-consistency-regression
  cancel-in-progress: false
jobs:
  private-points-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Require scoped private repository access
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private test access missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: research/points-stability-and-standard-consistency-20261119
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          path: private
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check fixed points shadow and prospectively paired benchmarks
        working-directory: private
        run: |
          set -euo pipefail
          for script in src/nhl-points-stability-shadow.cjs src/nhl-standard-triple-challenger.cjs src/nhl-standard-triple-challenger-grader.cjs src/nhl-standard-forward-scoreboard.cjs src/nhl-prospective-slate-baseline-audit.cjs scripts/report-nhl-frozen-baseline-challenge.cjs; do
            node --check "$script"
          done
      - name: Verify no lookahead, missing-data abstention and original first-Git comparisons
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node --test test/nhl-points-stability-shadow.test.cjs test/nhl-prospective-slate-baseline-audit.test.cjs test/nhl-standard-triple-challenger.test.cjs test/nhl-standard-forward-improvement.test.cjs test/nhl-frozen-baseline-challenge.test.cjs >"$log" 2>&1; then
            grep -E '^not ok|^# (tests|pass|fail)' "$log" | tail -n 20
            exit 1
          fi
          grep -E '^# (tests|pass|fail)' "$log" | tail -n 3
      - name: Refresh archived paired Standard benchmarks without changing original frozen picks
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          node scripts/report-nhl-frozen-baseline-challenge.cjs >/tmp/dual-baseline-audit.log 2>&1
          node - <<'NODE'
          const r=require('./outputs/health/nhl-frozen-baseline-challenge-latest.json');
          const f=r.futureStandardVsBothBaselines;
          if(!r.evidenceValid||f?.status!=='original_pregame_research_only'||
             f.beatsBothBaselinesConsistently!==false||f.modelPromoted!==false||
             f.bettingEdgeEstablished!==false||r.modelPromoted!==false||
             !f.modelMinusAlwaysHigher95BySlate||!f.modelMinusAlwaysLower95BySlate)
            throw Error('Baseline audit regression or false model promotion');
          console.log(JSON.stringify({status:'PASS',originalStandardDecided:f.decided,
             pacificSlates:f.distinctPacificSlates,
             modelMinusHigher:f.modelMinusAlwaysHigher,
             modelMinusLower:f.modelMinusAlwaysLower,modelPromoted:false}));
          NODE
      - name: Regress all installed private unit tests
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! npm test >"$log" 2>&1; then
            grep -E '^not ok|^# (tests|pass|fail)' "$log" | tail -n 20
            exit 1
          fi
          grep -E '^# (tests|pass|fail)' "$log" | tail -n 3

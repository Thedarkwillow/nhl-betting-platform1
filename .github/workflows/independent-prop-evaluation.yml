name: Independent prop source bounded evaluation
on:
  pull_request:
    paths: ['scripts/independent_provider_evaluation.py','.github/workflows/independent-prop-evaluation.yml']
  push:
    branches: [main]
    paths: ['scripts/independent_provider_evaluation.py','.github/workflows/independent-prop-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-prop-evaluation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/independent_provider_evaluation.py --test
  evaluate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Verify private destination
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .permissions.push)" = true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: archive
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Evaluate at most two documented included-tier calls
        env:
          RESTRICTED_DESTINATION_VERIFIED: '1'
          FLASHPROPS_API_KEY: ${{ secrets.FLASHPROPS_API_KEY }}
          FLASH_KEY: ${{ secrets.FLASH_KEY }}
          FLASHPROPSAPI: ${{ secrets.FLASHPROPSAPI }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINEAPI: ${{ secrets.PROPLINEAPI }}
        run: |
          umask 077
          python3 public/scripts/independent_provider_evaluation.py archive
      - name: Preserve exact private observations
        working-directory: archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git add -f "research/independent-prop-evaluations/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git config user.name 'Research archive automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'Archive bounded independent prop observations'
          for attempt in 1 2 3 4 5 6; do
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push -q origin HEAD:main; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin main
              git merge-base --is-ancestor HEAD origin/main
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1

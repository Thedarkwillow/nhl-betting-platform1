name: Public PickFinder morning evidence health
on:
  pull_request:
    paths: ['scripts/pickfinder-public-morning-audit.cjs','test/pickfinder-public-runner.test.cjs','.github/workflows/morning-private-archive-health.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder-public-morning-audit.cjs','.github/workflows/morning-private-archive-health.yml']
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        options: ['06:00','09:00']
        default: '06:00'
  schedule:
    - cron: '20 7 * * *'
      timezone: America/Los_Angeles
    - cron: '20 10 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/pickfinder-public-runner.test.cjs test/morning-private-archive-health.test.cjs test/nba-esports-prepull-candidate-lock.test.cjs test/pickfinder-morning-archive-audit.test.cjs
  audit:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public immutable morning evidence
        env:
          SLOT: ${{ github.event.schedule == '20 10 * * *' && '09:00' || inputs.slot || '06:00' }}
        run: node scripts/pickfinder-public-morning-audit.cjs . "$SLOT"

name: Bounded private NHL NFL sportsbook evidence refresh

on:
  workflow_dispatch:
  # GitHub cron execution drifted well past today's original 5:45/8:45
  # source windows. Trigger from the verified full private 6/9 board
  # archival as an additional TIME-OF-OBSERVATION research opportunity;
  # any quotes collected here are POST-BOARD, never preboard evidence.
  # Existing 12 credits/day and 6 credits/sport guards remain unchanged.
  workflow_run:
    workflows: ['Public Free Runners - Private NHL and NFL 6 and 9 AM Boards']
    types: [completed]
  # One safe startup check after this workflow file is merged.
  push:
    branches: [main]
    paths: ['.github/workflows/private-bounded-sportsbook-quotes.yml']
  # Move the two existing capped capture opportunities ahead of the archived
  # 06:00 and 09:00 Pacific board slots. Starting on schedule is not guaranteed.
  # No additional daily provider requests or quota allocation are authorized.
  schedule:
    - cron: '45 5 * * *'
      timezone: America/Los_Angeles
    - cron: '45 8 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-bounded-odds-quota
  cancel-in-progress: false
jobs:
  capture:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private event and quota contracts
        shell: bash
        run: |
          set -euo pipefail
          pin=83b27ec1d879494125ba65296f00a46211fa78e6
          tested="$(git rev-parse HEAD)"
          if ! test -f scripts/collect-bounded-sportsbook-quotes.cjs; then
            git fetch -q origin "$pin"
            work="$(mktemp -d)"
            git worktree add -q --detach "$work" "$pin"
            trap 'git worktree remove --force "$work" >/dev/null 2>&1 || true' EXIT
            (cd "$work"; node --check scripts/collect-bounded-sportsbook-quotes.cjs; node --test test/sportsbook-event-quota.test.cjs test/nhl-sportsbook-event-bridge.test.cjs test/nhl-sportsbook-original-name.test.cjs)
            tested="$pin"
          else
            node --check scripts/collect-bounded-sportsbook-quotes.cjs
            node --test test/sportsbook-event-quota.test.cjs test/nhl-sportsbook-event-bridge.test.cjs test/nhl-sportsbook-original-name.test.cjs
          fi
          echo "ODDS_TESTED_REVISION=$tested" >> "$GITHUB_ENV"
      # Provider calls are only attempted after the private source freshness
      # check; a green workflow with no new status-latest.json is NOT an odds pull.
      - name: Collect fresh exact-line sportsbook evidence within independent sport quota
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! test -f scripts/collect-bounded-sportsbook-quotes.cjs; then echo 'Tests ran on pinned branch; paid collection requires merged main.'; exit 0; fi
          node scripts/collect-bounded-sportsbook-quotes.cjs
      - name: Record passed regression evidence after collection
        if: success()
        run: |
          mkdir -p outputs/sportsbooks/bounded-live
          node -e 'const fs=require("node:fs");fs.writeFileSync("outputs/sportsbooks/bounded-live/collector-test-status.json",JSON.stringify({generatedAt:new Date().toISOString(),testedCommit:process.env.ODDS_TESTED_REVISION,passed:true,providerRequestsDuringTests:0})+"\n")'
      - name: Archive privately, even if quote processing failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! test -d outputs/sportsbooks/bounded-live; then exit 0; fi
          git add -f outputs/sportsbooks/bounded-live/*.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: bounded private sportsbook quote capture status' >/dev/null
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1


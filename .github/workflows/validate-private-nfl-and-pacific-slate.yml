name: Validate NFL exact event identity and Pacific NHL lineup slate release
on:
  pull_request:
    paths: ['.github/workflows/validate-private-nfl-and-pacific-slate.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/validate-private-nfl-and-pacific-slate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nfl-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Require private checkout permission
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: ${{ github.event_name == 'pull_request' && 'research/nov22-nfl-true-event-identity' || 'main' }}
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse original NFL GSIS and game key mismatch without clearance
        working-directory: private
        run: |
          set -euo pipefail
          node --check src/nfl-point-in-time-readiness-v1.cjs
          node --test test/nfl-point-in-time-readiness-v1.test.cjs test/nfl-original-freeze-dedup.test.cjs test/nfl-quote-evidence.test.cjs
  nhl-format-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private checkout permission
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: ${{ github.event_name == 'pull_request' && 'research/nov22-pacific-slate-lineup-cohorts' || 'main' }}
          path: private
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent Pacific slate Power/Flex format grading
        working-directory: private
        run: |
          set -euo pipefail
          node --check src/nhl-lineup-format-grading.cjs
          node --test test/nhl-lineup-format-grading.test.cjs test/nhl-lineup-slate-resampling.test.cjs test/nhl-lineup-evidence-release-v1.test.cjs
      - name: Complete NHL NFL MLB offline regression without vendor calls
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! npm test > "$log" 2>&1; then
            echo "::error::Private complete regression failed (details withheld)"
            grep '^not ok' "$log" | head -n 8 || true
            exit 1
          fi
          echo 'PASS: no payouts asserted, no model promotion, zero provider calls'

name: Publish NHL Dashboard
on:
  workflow_dispatch:
  # GitHub Actions GITHUB_TOKEN commits do not reliably trigger push workflows.
  # Completed trusted publishers explicitly redeploy the counts-only website.
  workflow_run:
    workflows:
      - 'Publish sanitized NHL NFL frozen model scorecards'
      - 'Publish honest NHL NFL six nine AM board health'
      - 'Verify both original NFL NHL freezes and publish safe status'
      - 'Record daily NHL NFL source line moves and publish counts'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data.json'
      - 'data/nhl-nfl-freeze-status.json'
      - 'data/collection-health.json'
      - 'data/model-scorecards.json'
      - 'data/source-line-movement.json'
      - 'nhl-games.json'
      - '.github/workflows/publish.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

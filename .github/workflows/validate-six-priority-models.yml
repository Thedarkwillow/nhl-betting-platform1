name: Validate NHL NFL Market Models and Future Trial Gates
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/nov20-nightly-model-participation-audit', 'feat/nightly-validated-nhl-strict-input-ab', 'feat/nightly-nhl-conditional-statistical-accuracy', 'feat/validate-nhl-independent-direction-audit', 'ci/nhl-eight-accuracy-research-20261120', 'ci/nhl-official-shorthanded-toi-validation', 'ci/nhl-immutable-shorthanded-backfill-test', 'fix/nhl-eight-future-audit-concurrent-recompute', 'ci/nhl-dual-real-line-hit-rate-evidence-20261120']
    paths:
      - '.github/workflows/validate-six-priority-models.yml'
  schedule:
    # Nightly review of first-Git future predictions after official results.
    # No new sportsbook or platform requests; research evidence only.
    - cron: '20 4 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
jobs:
  review-private-prospective-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Require private token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: feat/nhl-separate-real-line-hit-rate-reports-20261120
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run refreshed eight-market research tests including shot-season diagnostics.
      # Gate the new source-only NHL accuracy lab without changing main picks.
      - name: Static checks and focused tests
        working-directory: private
        run: |
          set -euo pipefail
          for f in src/nhl-pregame-availability-v2.cjs src/nhl-standard-quality-challenger-v2.cjs src/nhl-standard-abstention-audit.cjs src/nhl-standard-input-frozen-ab-v1.cjs src/nhl-standard-input-ab-future-scorecard-v1.cjs src/nhl-standard-statistical-quality-v1.cjs src/nhl-standard-independent-duel-v1.cjs src/nhl-standard-independent-duel-scorecard-v1.cjs src/nhl-eight-accuracy-research-v1.cjs src/nhl-eight-accuracy-forward-audit-v1.cjs src/nhl-dual-real-line-hit-rates-v1.cjs scripts/report-nhl-dual-real-line-hit-rates-v1.cjs src/nhl-specialist-history-recovery.cjs scripts/recover-nhl-specialist-history.cjs scripts/report-nhl-position-multiseason-v3.cjs src/nhl-standard-historical-holdout-review-v1.cjs src/nhl-position-multiseason-v3.cjs src/nfl-directional-usage-challenger-v3.cjs src/nfl-goblin-official-active-mentions.cjs src/weekend-offday-preflight.cjs src/six-priority-future-scorecard.cjs scripts/report-six-priority-future-scorecard.cjs scripts/freeze-partner-nhl-pregame.cjs scripts/freeze-nfl-partner-pregame.cjs; do
            node --check "$f"
          done
          node --test test/six-priority-market-challenger-future.test.cjs test/nhl-standard-abstention-audit.test.cjs test/nhl-standard-input-frozen-ab.test.cjs test/nhl-standard-statistical-quality.test.cjs test/nhl-standard-independent-duel-v1.test.cjs test/nhl-eight-accuracy-research-v1.test.cjs test/nhl-dual-real-line-hit-rates-v1.test.cjs test/nhl-official-strength-timeonice-source.test.cjs test/nhl-standard-historical-holdout-review-v1.test.cjs test/nfl-goblin-official-active-mentions.test.cjs test/weekend-offday-preflight.test.cjs test/nhl-standard-adaptive-research.test.cjs test/nfl-directional-v2-prospective.test.cjs
      - name: Refresh chronological two-season holdout with prespecified feature ablations
        if: github.ref != 'refs/heads/ci/nhl-eight-accuracy-research-20261120' && github.ref != 'refs/heads/ci/nhl-official-shorthanded-toi-validation' && github.ref != 'refs/heads/ci/nhl-immutable-shorthanded-backfill-test' && github.ref != 'refs/heads/fix/nhl-eight-future-audit-concurrent-recompute' && github.ref != 'refs/heads/ci/nhl-dual-real-line-hit-rate-evidence-20261120'
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/report-nhl-position-multiseason-v3.cjs
      - name: Run precommitted first-Git future trial audit
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/report-six-priority-future-scorecard.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('outputs/health/six-priority-future-evidence-latest.json'));
          assert.equal(j.nhlStandardAbstention.kind,'nhl_first_git_standard_abstention_coverage_review_20261120_v1');
          assert.equal(j.nhlStandardAbstention.modelPromoted,false);
          assert.equal(j.nhlStandardAbstention.bettingEligible,false);
          assert.equal(j.nhlStandardAbstention.calibrationApproved,false);
          assert.equal(j.nhlStandardAbstention.selectionQualityProven,false);
          assert.equal(j.nhlStandardInputAB.kind,'nhl_standard_strict_same_original_input_ab_forward_v1');
          assert.equal(j.nhlStandardInputAB.strongerInputsOutperformSimpleBaselinesProven,false);
          assert.equal(j.nhlStandardInputAB.strongerInputsOutperformControlProven,false);
          assert.equal(j.nhlStandardInputAB.statisticalConditional.kind,'nhl_strict_statistical_input_ab_conditional_on_appearance_forward_v1');
          assert.equal(j.nhlStandardInputAB.statisticalConditional.accuracyAdvantageVerified,false);
          assert.equal(j.nhlStandardInputAB.statisticalConditional.bettingEligible,false);
          assert.equal(j.nhlIndependentModelDuel.kind,'nhl_standard_independent_direction_forward_scorecard_20261120_v1');
          assert.equal(j.nhlIndependentModelDuel.bettingEligible,false);
          assert.equal(j.nhlIndependentModelDuel.modelPromoted,false);
          assert.equal(j.nhlEightAccuracyResearch.kind,'nhl_eight_accuracy_first_git_future_scorecard_v1');
          assert.equal(j.nhlEightAccuracyResearch.bettingEligible,false);
          assert.equal(j.nhlEightAccuracyResearch.modelPromoted,false);
          assert.equal(j.nhlEightAccuracyResearch.benefitsToHitRateVerified,false);
          assert.equal(j.nhlEightAccuracyResearch.calibrationApproved,false);
          assert.equal(j.nhlIndependentModelDuel.independentOutperformanceVerified,false);
          assert.equal(j.nhlIndependentHistoricalHoldout.kind,'nhl_multiseason_chronological_historical_holdout_review_v1');
          assert.equal(j.nhlIndependentHistoricalHoldout.status,'historical_2026_27_evaluated');
          assert.equal(j.nhlIndependentHistoricalHoldout.syntheticThresholdsOnly,true);
          assert.equal(j.nhlIndependentHistoricalHoldout.historicallyValidatedBettingEdge,false);
          assert.equal(j.nhlIndependentHistoricalHoldout.byMarket.points.gridAblations.length,10);
          assert.equal(j.nhlIndependentHistoricalHoldout.independentExpectedIceTimeCounterfactualTested,true);
          assert.equal(j.nhlIndependentHistoricalHoldout.independentPowerPlayLineupCounterfactualTested,false);
          assert.equal(j.nhlIndependentModelDuel.historicalSimulationNotMixedIntoProspective,true);
          console.log(JSON.stringify({historicalSyntheticHoldout:Object.fromEntries(
            Object.entries(j.nhlIndependentHistoricalHoldout.byMarket).map(([k,v])=>
              [k,{games:v.holdoutGames,syntheticLines:v.syntheticThresholds,
               brierDelta:v.enhancedMinusBaselineBrier,
               clusterCI:v.pairedGame95,
               iceTimeDelta:v.expectedIceTimeAdjustmentAblation?.enhancedMinusNoIceTimeBrier,
               powerPlayEvidenceStrata:v.pregamePowerPlayUsageEvidenceStrata}])),
            independentForwardOriginals:j.nhlIndependentModelDuel.originals,
            independentForwardDecided:j.nhlIndependentModelDuel.completedDecisions,
            modelPromoted:false}));
          assert.equal(j.nhlStandardInputAB.statisticalConditional.noInferredPlayerParticipation,true);
          assert.equal(j.nhlStandardInputAB.bettingEligible,false);
          assert.equal(j.nhlStandardInputAB.modelPromoted,false);
          assert.equal(j.originalPlatformSettlementsVerified,false);
          assert.equal(j.modelPromoted,false);
          assert.equal(j.autoWagers,0);
          console.log(JSON.stringify({nhl:j.nhl.all.decided,nfl:j.nfl.all.decided,
            originalStandard:j.nhlStandardAbstention.acceptedOriginalFrozenThresholds,
            selectedStandard:j.nhlStandardAbstention.selected.registered,
            withheldStandard:j.nhlStandardAbstention.abstained.registered,
            sameLineABOriginals:j.nhlStandardInputAB.originalExactThresholds,
            sameLineABControlSelected:j.nhlStandardInputAB.control.selected.registered,
            sameLineABEnrichedSelected:j.nhlStandardInputAB.enhanced.selected.registered,
            sameLineABEnrichedDecided:j.nhlStandardInputAB.enhanced.selected.decided,
            appearanceConditionalOriginals:j.nhlStandardInputAB.statisticalConditional.originalExactThresholds,
            appearanceConditionalCurrentSelected:j.nhlStandardInputAB.statisticalConditional.currentOnly.selected.registered,
            appearanceConditionalEnrichedSelected:j.nhlStandardInputAB.statisticalConditional.enriched.selected.registered,
            appearanceConditionalEnrichedDecided:j.nhlStandardInputAB.statisticalConditional.enriched.selected.decided,
            promoted:j.modelPromoted,verifiedPayoutEV:null}));
          NODE
      # Both cohorts must remain non-overlapping and research-only.
      - name: Grade historical original lines separately from frozen future new model
        working-directory: private
        run: |
          set -euo pipefail
          node scripts/report-nhl-dual-real-line-hit-rates-v1.cjs
          node - <<'NODE'
          const a=require('node:assert/strict');
          const f=require('node:fs'),p='outputs/health/';
          const h=JSON.parse(f.readFileSync(p+'nhl-real-line-retrospective-hit-rate-latest.json'));
          const v=JSON.parse(f.readFileSync(p+'nhl-real-line-prospective-hit-rate-latest.json'));
          const s=JSON.parse(f.readFileSync(p+'nhl-real-line-dual-hit-rate-summary-latest.json'));
          a.equal(h.historicalReconstructionNotPregameFrozen,undefined);
          a.equal(h.newFixedPolicyWasDevelopedAfterTheseGames,true);
          a.equal(h.historicalStatFeedAsOfOriginalCaptureIndependentlyVerified,false);
          a.equal(h.prospectiveResultsNotMerged,true);
          a.equal(v.noRetrospectiveReconstructionInThisCohort,true);
          a.equal(v.performanceApproved,false);
          a.equal(h.modelPromoted,false);
          a.equal(v.modelPromoted,false);
          a.equal(s.accuracyImprovementVerified,false);
          for(const c of [h,v]){
            for(const [market,r] of Object.entries(c.byMarket)){
              a.equal(r.exactSameLinePaired.newModel.wins+r.exactSameLinePaired.newModel.losses,
               r.exactSameLinePaired.selections);
              a.equal(r.exactSameLinePaired.originalOnTheseLines.wins+
               r.exactSameLinePaired.originalOnTheseLines.losses,
               r.exactSameLinePaired.selections);
              a.equal(r.exploratorySelected.wins+r.exploratorySelected.losses,
               r.exploratorySelected.decided);
              a.ok(['shotsOnGoal','points','assists','blockedShots'].includes(market));
            }
          }
          console.log(JSON.stringify({historicalAuthenticLines:h.originalEligible,
            historicalPairedDecided:h.all.exactSameLinePaired.selections,
            newProspectiveAccepted:v.originals,
            newProspectivePairedDecided:v.all.exactSameLinePaired.selections,
            noBetting:true}));
          NODE
      - name: Preserve private-only prospective diagnostics without changing original freezes
        if: github.ref == 'refs/heads/main'
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- outputs/health/six-priority-future-evidence-latest.json outputs/health/nhl-position-multiseason-v3-latest.json outputs/health/nhl-real-line-retrospective-hit-rate-latest.json outputs/health/nhl-real-line-prospective-hit-rate-latest.json outputs/health/nhl-real-line-dual-hit-rate-summary-latest.json
          if git diff --cached --quiet; then
            echo 'No new future evidence to archive'; exit 0
          fi
          git commit -qm 'audit: private NHL Standard strict A/B, abstention and NFL future baselines'
          for retry in 1 2 3; do
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort || true
              echo '::warning::Concurrent diagnostics changed; recomputing on latest main'
              # The only staged writes are derived health reports. Resetting
              # does not modify any immutable frozen original-source capture.
              git reset --hard origin/main
              node scripts/report-nhl-position-multiseason-v3.cjs
              node scripts/report-six-priority-future-scorecard.cjs
              node scripts/report-nhl-dual-real-line-hit-rates-v1.cjs
              git add -f -- outputs/health/six-priority-future-evidence-latest.json outputs/health/nhl-position-multiseason-v3-latest.json
              if git diff --cached --quiet; then
                echo 'Newer main already has equivalent research evidence'; exit 0
              fi
              git commit -qm 'audit: recompute private NHL research after concurrent original archive'
            fi
            if git push -q origin HEAD:main; then
              echo 'PASS: private research diagnostics archived, no model promotion'
              exit 0
            fi
            sleep "$retry"
          done
          exit 1

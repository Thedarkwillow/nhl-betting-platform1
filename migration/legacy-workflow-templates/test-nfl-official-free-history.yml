name: NFL Final Boxscore Crosscheck and Free Historical PrizePicks Mirror
on:
  schedule:
    - cron: '45 7 * * 1'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'scripts/reconcile-nfl-espn-boxscore.cjs'
      - 'scripts/reconcile-nfl-specialty-weekly.cjs'
      - 'test/nfl-specialty-weekly-reconciliation.test.cjs'
      - 'scripts/audit-free-nfl-prizepicks-mirror.cjs'
      - 'test/nfl-independent-boxscore-reconcile.test.cjs'
      - 'test/nfl-free-prizepicks-mirror-audit.test.cjs'
      - '.github/workflows/test-nfl-official-free-history.yml'
  pull_request:
    paths:
      - 'scripts/reconcile-nfl-espn-boxscore.cjs'
      - 'scripts/reconcile-nfl-specialty-weekly.cjs'
      - 'test/nfl-specialty-weekly-reconciliation.test.cjs'
      - 'scripts/audit-free-nfl-prizepicks-mirror.cjs'
      - 'test/nfl-independent-boxscore-reconcile.test.cjs'
      - 'test/nfl-free-prizepicks-mirror-audit.test.cjs'
      - '.github/workflows/test-nfl-official-free-history.yml'
permissions:
  contents: write
concurrency:
  group: nfl-secondary-stat-and-public-history-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test independent final boxscore and source-observation provenance
        run: |
          node --check scripts/reconcile-nfl-espn-boxscore.cjs
          node --check scripts/reconcile-nfl-specialty-weekly.cjs
          node --check scripts/audit-free-nfl-prizepicks-mirror.cjs
          node --test test/nfl-independent-boxscore-reconcile.test.cjs test/nfl-free-prizepicks-mirror-audit.test.cjs test/nfl-specialty-weekly-reconciliation.test.cjs
      - name: Crosscheck all archived rush and reception plays with independently recorded weekly final stats
        run: node scripts/reconcile-nfl-specialty-weekly.cjs
      - name: Reconcile archived NFL events with independent ESPN completed-game box scores
        continue-on-error: true
        run: node scripts/reconcile-nfl-espn-boxscore.cjs
      - name: Audit pinned historical PrizePicks GitHub mirror versions
        run: node scripts/audit-free-nfl-prizepicks-mirror.cjs
      - name: Commit aggregate research audits only (never underlying publisher data)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nfl/research/specialty-pbp-final-stats-reconciliation-latest.json outputs/nfl/research/free-prizepicks-github-mirror-audit.json
          if test -f outputs/nfl/research/secondary-boxscore-reconciliation-latest.json; then
            git add -f outputs/nfl/research/secondary-boxscore-reconciliation-latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(nfl): publish aggregate ESPN boxscore and pinned mirror audits'
            pushed=0
            for i in 1 2 3 4; do
              git fetch origin main
              git -c rebase.autoStash=true rebase -X theirs origin/main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep $((i*3))
            done
            test "$pushed" -eq 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nfl-official-gamebook-still-pending-independent-boxscore-research
          path: |
            outputs/nfl/research/secondary-boxscore-reconciliation-latest.json
            outputs/nfl/research/specialty-pbp-final-stats-reconciliation-latest.json
            outputs/nfl/research/free-prizepicks-github-mirror-audit.json
          if-no-files-found: warn
          retention-days: 30

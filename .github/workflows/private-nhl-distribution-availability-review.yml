name: Private NHL market distribution availability review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nhl-distribution-availability-review.yml']
  workflow_run:
    workflows: ['Private pregame NHL freeze on public free runner', 'Private NHL specialist history and historical PP coverage']
    types: [completed]
  schedule:
    - cron: '56 6,22 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: private-nhl-distribution-review
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and evaluate model distribution evidence
        run: |
          set -euo pipefail
          umask 077
          pin=af69a653813e3552cc24bd082201a6f290652561
          tested="$(git rev-parse HEAD)"
          if ! test -f scripts/report-nhl-distribution-availability-review.cjs; then
            git fetch -q origin "$pin"
            work="$(mktemp -d)"
            git worktree add --detach "$work" "$pin"
            trap 'git worktree remove --force "$work" >/dev/null 2>&1 || true' EXIT
            (cd "$work"; node --check scripts/report-nhl-distribution-availability-review.cjs; node --test test/nhl-market-distribution-availability.test.cjs; node scripts/report-nhl-distribution-availability-review.cjs)
            cp "$work/outputs/health/nhl-distribution-availability-review-latest.json" outputs/health/nhl-distribution-availability-review-latest.json
            tested="$pin"
          else
            node --check scripts/report-nhl-distribution-availability-review.cjs
            node --test test/nhl-market-distribution-availability.test.cjs
            node scripts/report-nhl-distribution-availability-review.cjs
          fi
          TESTED="$tested" node -e 'require("fs").writeFileSync("outputs/health/nhl-distribution-availability-test-latest.json",JSON.stringify({testedCommit:process.env.TESTED,generatedAt:new Date().toISOString(),passed:true,paidRequests:0})+"\n")'
      - name: Archive private research only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/health/nhl-distribution-availability-test-latest.json outputs/health/nhl-distribution-availability-review-latest.json
          if test -d outputs/research/market-distributions-v1; then git add -f outputs/research/market-distributions-v1/*.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private same-line distribution and availability evidence'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

# Activate merged distribution review and require post-policy frozen evidence.

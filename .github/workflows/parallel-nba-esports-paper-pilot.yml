name: Parallel NBA and esports paper pilot
on:
  pull_request:
    paths: ['scripts/pickfinder-model-input-evidence.cjs','test/pickfinder-model-input-evidence.test.cjs','scripts/grade-nba-parallel-paper-pilot.cjs','test/grade-nba-parallel-paper-pilot.test.cjs','scripts/nba-parallel-paper-pilot.cjs','test/nba-parallel-paper-pilot.test.cjs','.github/workflows/parallel-nba-esports-paper-pilot.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder-model-input-evidence.cjs','test/pickfinder-model-input-evidence.test.cjs','scripts/grade-nba-parallel-paper-pilot.cjs','test/grade-nba-parallel-paper-pilot.test.cjs','scripts/nba-parallel-paper-pilot.cjs','test/nba-parallel-paper-pilot.test.cjs','.github/workflows/parallel-nba-esports-paper-pilot.yml']
  workflow_dispatch:
  schedule:
    - cron: '48 6,9,12,16 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: parallel-nba-esports-paper-pilot
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/pickfinder-model-input-evidence.test.cjs test/grade-nba-parallel-paper-pilot.test.cjs test/nba-parallel-paper-pilot.test.cjs test/nba-research-pipeline-v1.test.cjs test/esports-prospective-archive.test.cjs
  pilot:
    needs: test
    # Owner-directed private pause; restore original condition only when authorized:
    # if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f063be9e64f19028c59efbdcaf5b28f35210ea3d
          path: candidate
          persist-credentials: false
      - name: Verify restricted archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .permissions.push)" = true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently grade previously archived conditional NBA forecasts
        env:
          RESTRICTED_DESTINATION_VERIFIED: '1'
        run: node public/scripts/grade-nba-parallel-paper-pilot.cjs archive
      - name: Compare archived PickFinder inputs against prior actual frozen model output
        env:
          RESTRICTED_DESTINATION_VERIFIED: '1'
        run: node public/scripts/pickfinder-model-input-evidence.cjs archive
      - name: Pinned conditional NBA forecast pilot
        if: vars.NBA_DIRECT_SOURCE_AUTHORIZED == '1'
        run: node public/scripts/nba-parallel-paper-pilot.cjs archive candidate
      - name: Pinned esports evidence gate
        run: node candidate/scripts/esports-prospective-archive.cjs archive freeze
      - name: Archive new forecasts without overwriting
        working-directory: archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for dir in outputs/nba/parallel-paper-pilot outputs/nba/parallel-paper-grades research/pickfinder-model-comparisons outputs/esports/prospective-frozen; do
            if test -d "$dir"; then git add -f "$dir"; fi
          done
          git diff --cached --quiet && exit 0
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git config user.name 'Research archive automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'Archive independent pinned paper pilot'
          for i in 1 2 3 4 5 6; do
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --quiet origin main
            git rebase --quiet FETCH_HEAD || { git rebase --abort; exit 1; }
            if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --quiet origin HEAD:main; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --quiet origin main
              git merge-base --is-ancestor HEAD FETCH_HEAD
              while IFS= read -r file; do
                test "$(git rev-parse "HEAD:$file")" = "$(git rev-parse "FETCH_HEAD:$file")"
              done < <(git diff-tree --no-commit-id --name-only -r HEAD)
              echo 'Remote pilot digest verified. No production promotion.'
              exit 0
            fi
            sleep "$((i*2))"
          done
          exit 1

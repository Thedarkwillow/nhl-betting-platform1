# Validate merged NFL prospective diagnostic and future-only shadow research from private main.
name: Private NFL original Higher bias audit and future shadow regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-private-nfl-higher-bias-shadow.yml']
permissions:
  contents: read
jobs:
  verify-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private research read permission
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private checkout unavailable"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original frozen diagnostics, future margin policy, and cohort dedupe tests
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node --test test/nfl-frozen-direction-diagnostic.test.cjs test/nfl-prospective-shadow.test.cjs test/nfl-shadow-postgame-grade.test.cjs test/nfl-precommitted-grading.test.cjs test/nfl-prospective-freeze.test.cjs >"$log" 2>&1; then
            echo "::error::NFL first-Git prospective direction and shadow tests failed"
            grep '^not ok' "$log" | head -n 15 || true
            exit 1
          fi
          echo "PASS: unchanged Higher/Lower identity and original first-Git future challenger tests."
      - name: Run entire private Node regression
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! npm test >"$log" 2>&1; then
            echo "::error::Existing full private NHL NFL research regression failed"
            grep '^not ok' "$log" | head -n 15 || true
            exit 1
          fi
          echo "PASS: full private NHL/NFL Node regression."
      - name: Generate real original November 9 postgame directional audit privately
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          node scripts/report-nfl-frozen-direction-diagnostic.cjs > /dev/null
          node scripts/report-nfl-shadow-postgame.cjs > /dev/null
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('outputs/nfl/backtests/frozen-direction-bias-diagnostic-latest.json','utf8'));
          const s=JSON.parse(fs.readFileSync('outputs/nfl/backtests/frozen-shadow-prospective-grading-latest.json','utf8'));
          const o=d.overall;
          if(d.kind!=='nfl_original_frozen_direction_diagnostic_v1'||
             o.decided!==o.correct+o.incorrect||
             o.higherCorrect+o.higherWrong!==o.higherChosen||
             o.lowerCorrect+o.lowerWrong!==o.lowerChosen||
             d.originalDirectionsCanNeverBeRevised!==true||
             d.productionModelPromotionApproved!==false||
             d.officialPlatformSettlementsVerified!==false||
             s.originalHigherLowerDirectionsUnchanged!==true||
             s.payoutAdjustedEV!==null)
            throw Error('Original signed side audit does not reconcile');
          console.log(JSON.stringify({status:'verified_private_first_Git_original_NFL_side_reconciliation',
            decisiveSelections:o.decided,higherWrong:o.higherWrong,
            distinctFinalGames:o.distinctFinalGames,
            shadowFutureOnly:true,originalDirectionsUnchanged:true,
            publishPrivateRows:false,edgeClaim:false}));
          NODE

name: Validate frozen NHL strict multi-season history and ice-time research
on:
  workflow_dispatch:
  push:
    branches: [ci/nhl-strict-input-recovery-validation]
    paths: ['.github/workflows/validate-nhl-strict-input-recovery.yml']
permissions:
  contents: read
jobs:
  strict-input-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 795f4bedda4327e98517997d1022731d120174f1
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strict selection policy never changes, no-lookahead and source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/nhl-strict-input-source-v1.cjs
          node --check src/nhl-expected-ice-time-evidence-v1.cjs
          node --check src/nhl-position-rate-matchup-v2.cjs
          node --check scripts/freeze-partner-nhl-pregame.cjs
          node --test test/nhl-strict-multiseason-inputs.test.cjs test/nhl-standard-adaptive-research.test.cjs test/six-priority-market-challenger-future.test.cjs test/nhl-standard-abstention-audit.test.cjs
          git diff --exit-code origin/main -- src/nhl-standard-quality-challenger-v2.cjs
          echo 'PASS: original strict thresholds and selected-side policy unchanged'
      - name: Compare full NHL NFL regression against unchanged private main baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(mktemp -d)"
          base_log="$(mktemp)"
          candidate_log="$(mktemp)"
          trap 'git worktree remove -f "$baseline" >/dev/null 2>&1 || true; rm -rf "$baseline"; rm -f "$base_log" "$candidate_log"' EXIT
          git worktree add --detach "$baseline" origin/main >/dev/null
          (cd "$baseline"; npm test >"$base_log" 2>&1) || true
          npm test >"$candidate_log" 2>&1 || true
          BASE_LOG="$base_log" CAND_LOG="$candidate_log" node - <<'NODE'
          const fs=require('node:fs');
          const a=fs.readFileSync(process.env.BASE_LOG,'utf8'),
            b=fs.readFileSync(process.env.CAND_LOG,'utf8');
          const errors=s=>[...s.matchAll(/^not ok \d+ - (.+)$/gm)]
            .map(x=>x[1].trim()).sort();
          const baseline=errors(a),candidate=errors(b),initial=new Set(baseline),
            added=candidate.filter(x=>!initial.has(x));
          const totals=s=>Object.fromEntries([...s.matchAll(/^# (tests|pass|fail) (\d+)$/gm)]
            .map(x=>[x[1],Number(x[2])]));
          const oldTotals=totals(a),newTotals=totals(b);
          console.log(JSON.stringify({kind:'private_nhl_nfl_compared_full_regression_v1',
            baseline:oldTotals,candidate:newTotals,
            preexistingFailures:baseline.length,
            newFailures:added.length,
            baselineNames:baseline,addedNames:added}));
          if(!Number.isInteger(oldTotals.tests)||!Number.isInteger(newTotals.tests)||
            oldTotals.tests<500||newTotals.tests<oldTotals.tests||added.length)
             throw Error('NHL NFL new regression or incomplete full suite');
          console.log('PASS: no additional full-suite failures above unchanged main');
          NODE
      - name: Audit recovered official prior games, opponent and ice-time as-of on real private data
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const {load}=require('./scripts/report-nhl-position-multiseason-v3.cjs');
          const source=require('./src/nhl-strict-input-source-v1.cjs');
          const pos=require('./src/nhl-position-rate-matchup-v2.cjs');
          const ice=require('./src/nhl-expected-ice-time-evidence-v1.cjs');
          const limits=require('./src/nhl-standard-quality-challenger-v2.cjs').LIMITS;
          const loaded=load(),v=source.adapt(loaded,'2026-11-20');
          if(!v.available)throw Error('Archived seasons unavailable: '+v.reason);
          const files=fs.readdirSync('outputs/research/snapshots').filter(s=>/^20261120T\d{6}Z\.json$/.test(s)).sort();
          if(!files.length)throw Error('No genuine original Nov20 pregame snapshots');
          const last=JSON.parse(fs.readFileSync('outputs/research/snapshots/'+files.at(-1),'utf8'));
          const original=last.positionRateMatchupV2?.rows?.length||0;
          const upgraded=pos.freeze(last,v.history,v.schedules);
          const inputs=(last.individualPropSelections||[]).filter(x=>x.tier==='Standard'&&limits[x.market]);
          const counts={originals:inputs.length,priorPassCurrent:0,priorPassRecovered:0,
            icePassCurrent:0,icePassRecovered:0,missingIce:0};
          const histCurrent=JSON.parse(fs.readFileSync('outputs/history/players.json','utf8'));
          for(const p of inputs){
            const old=ice.estimate(histCurrent.players[String(p.playerId)]?.games||[],'2026-11-20');
            const next=ice.estimate(v.history.players[String(p.playerId)]?.games||[],'2026-11-20');
            const gate=limits[p.market];
            if(old?.priorGames>=gate.prior)counts.priorPassCurrent++;
            if(next?.priorGames>=gate.prior)counts.priorPassRecovered++;
            if(old?.originalExpectedIceSeconds>=gate.ice)counts.icePassCurrent++;
            if(next?.originalExpectedIceSeconds>=gate.ice)counts.icePassRecovered++;
            if(!next)counts.missingIce++;
          }
          const toi=ice.walkForward(v.history,'2026-11-20',{from:'2026-10-01'});
          const report={kind:'nhl_strict_source_offline_evidence_recovery_v1',
            historical:loaded.counts,scheduleSeasons:v.seasons,priorCurrentCounts:counts,
            originalPositionRows:original,recoveredPositionRows:upgraded.rows.length,
            recoveredPositionByMarket:Object.fromEntries([...new Set(upgraded.rows.map(x=>x.market))].map(m=>[m,upgraded.rows.filter(x=>x.market===m).length])),
            expectedIceResearch:{decided:toi.decided,distinctGames:toi.distinctGames,
             distinctDates:toi.distinctDates,originalMAE:toi.originalBaselineMAESeconds,
             alternateMAE:toi.alternateMAESeconds,alternateDeployed:false},
            originalFrozenPredictionsUntouched:true,strictThresholdsUnchanged:true,
            retrospectiveDataQualityOnly:true,forwardAccuracyProven:false};
          console.log('ASOF_NHL_STRICT_SOURCE '+JSON.stringify(report));
          if(report.originalFrozenPredictionsUntouched!==true||
             !report.strictThresholdsUnchanged)throw Error('Original source policy changed');
          NODE
      - name: Reconstruct exact as-of adaptive and opponent feature coverage without grading or wagering
        shell: bash
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 - <<'NODE'
          const fs=require('node:fs');
          const adaptive=require('./src/nhl-standard-adaptive-research.cjs');
          const pos=require('./src/nhl-position-rate-matchup-v2.cjs');
          const quality=require('./src/nhl-standard-quality-challenger-v2.cjs');
          const loaded=require('./scripts/report-nhl-position-multiseason-v3.cjs').load();
          const v=require('./src/nhl-strict-input-source-v1.cjs').adapt(loaded,'2026-11-20');
          if(!v.available)throw Error('No verified asof NHL multi-season source');
          const files=fs.readdirSync('outputs/research/snapshots')
             .filter(x=>/^20261120T\d{6}Z\.json$/.test(x)).sort();
          const original=JSON.parse(fs.readFileSync('outputs/research/snapshots/'+files.at(-1),'utf8'));
          const start=Date.now();
          const rebuilt=adaptive.freeze(original,v.history,v.combinedSchedule);
          const position=pos.freeze(original,v.history,v.schedules);
          const now=Date.now()-start;
          const oldMap=new Map((original.standardAdaptiveResearchV2?.rows||[]).map(x=>
            [[x.gameId,x.playerId,x.market,x.line,x.tier].join('|'),x]));
          const rows=rebuilt.rows||[],limits=quality.LIMITS;
          const results={eligibleOriginals:0,previouslyScored:0,
            recoveredScored:0,previousPriorPass:0,recoveredPriorPass:0,
            previousOpponentPass:0,recoveredOpponentPass:0,
            previousIcePass:0,recoveredIcePass:0,
            originalLearnedAvailable:0,recoveredLearnedAvailable:0};
          for(const p of original.individualPropSelections||[]){
            if(p.tier!=='Standard'||!limits[p.market])continue;
            results.eligibleOriginals++;
            const k=[p.gameId,p.playerId,p.market,p.line,p.tier].join('|'),
              old=oldMap.get(k),next=rows.find(x=>[x.gameId,x.playerId,x.market,x.line,x.tier].join('|')===k);
            const l=limits[p.market];
            results.previouslyScored+=Number(!!old);
            results.recoveredScored+=Number(!!next);
            results.previousPriorPass+=Number(old?.priorGames>=l.prior);
            results.recoveredPriorPass+=Number(next?.priorGames>=l.prior);
            results.previousOpponentPass+=Number(old?.opponentGames>=l.opponent&&old?.opponentHistoryUsed===true);
            results.recoveredOpponentPass+=Number(next?.opponentGames>=l.opponent&&next?.opponentHistoryUsed===true);
            results.previousIcePass+=Number(old?.expectedIceSeconds>=l.ice);
            results.recoveredIcePass+=Number(next?.expectedIceSeconds>=l.ice);
            results.originalLearnedAvailable+=Number(Number.isFinite(old?.predictions?.learned));
            results.recoveredLearnedAvailable+=Number(Number.isFinite(next?.predictions?.learned));
          }
          const pkey=x=>[x.gameId,x.playerId,x.market,x.line,x.tier].join('|');
          const originalPosition=new Map((original.positionRateMatchupV2?.rows||[]).map(x=>[pkey(x),x]));
          let pairedPosition=0,opponentSeasonGamesGained=0,changedOpponentFactor=0;
          for(const x of position.rows||[]){
            const old=originalPosition.get(pkey(x));
            if(!old)continue;
            pairedPosition++;
            opponentSeasonGamesGained+=Number((x.defense?.season?.games||0)>
               (old.defense?.season?.games||0));
            changedOpponentFactor+=Number(Math.abs((x.defenseFactor||1)-
               (old.defenseFactor||1))>1e-6);
          }
          const candidate=quality.freeze({...original,standardAdaptiveResearchV2:rebuilt,
             positionRateMatchupV2:position});
          console.log('ASOF_NHL_ADAPTIVE_SOURCE '+JSON.stringify({
            kind:'strict_asof_nhl_rebuilt_input_diagnostic_only',
            ...results,pairedPosition,opponentSeasonGamesGained,
            changedOpponentFactor,originalPositionRows:originalPosition.size,
            recoveredPositionRows:position.rows.length,
            originalShadowSelected:original.standardQualityShadowV2?.selected||0,
            modelOnlyRebuiltSelected:candidate.selected,
            strictQualityPolicyUnchanged:true,rebuiltFeatureMillis:now,
            reconstructedAfterOriginalFreeze:true,
            validatedFutureModelAccuracy:false,
            approval:false,calibrated:false,noWagers:true}));
          if(candidate.modelPromoted!==false||candidate.automaticPicksApproved!==false)
            throw Error('Retrospective quality candidate wrongly promoted');
          NODE

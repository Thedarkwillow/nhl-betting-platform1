name: Validate private dedicated NFL quarter and half models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-dedicated-period-models.yml']
permissions:
  contents: read
concurrency:
  group: dedicated-period-private-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 912a84b7a82088ef10fa9db7b053dc588ada2fd6
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact pinned research revision
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          test "$(git rev-parse HEAD)" = 912a84b7a82088ef10fa9db7b053dc588ada2fd6
          if ! npm test >"$log" 2>&1; then grep -E '^# (tests|pass|fail) [0-9]+$' "$log" || true; echo '::error::Private regression failed.'; exit 1; fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$log" || true
          echo 'PASS: private quarter and half tests.'
      - name: Execute cached three-season period outcome and model report
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node scripts/report-nfl-independent-forward.cjs >"$log" 2>&1; then echo '::error::Cached NFL period report failed.'; exit 1; fi
          node - <<'NODE' >"$log" 2>&1
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('outputs/nfl/backtests/independent-source-forward-latest.json','utf8')).dedicatedPeriodHistoricalResearch;
          if(x?.kind!=='nfl_dedicated_period_synthetic_lab_v1'||x.calibrated!==false||x.modelPromoted!==false||x.markets.length!==16||x.periods.length!==6)throw Error('Missing dedicated period evidence');
          fs.writeFileSync('outputs/nfl/backtests/dedicated-period-models-latest.json',JSON.stringify({...x,generatedAt:new Date().toISOString(),codeCommit:'912a84b7a82088ef10fa9db7b053dc588ada2fd6'},null,2)+'\n');
          fs.writeFileSync('outputs/health/dedicated-prop-period-inventory-latest.json',JSON.stringify(require('./src/dedicated-prop-model-roadmap.cjs').inventory(),null,2)+'\n');
          NODE
          echo 'PASS: cached period outcome reconciliation and model report.'
      - name: Archive aggregate evidence privately
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(outputs/nfl/backtests/dedicated-period-models-latest.json outputs/health/dedicated-prop-period-inventory-latest.json)
          for f in "${files[@]}"; do test -s "$f"; cp "$f" "/tmp/$(basename "$f")"; done
          git restore --worktree -- .
          git fetch -q origin main >"$log" 2>&1
          git checkout -q --detach origin/main >"$log" 2>&1
          for f in "${files[@]}"; do cp "/tmp/$(basename "$f")" "$f"; done
          git add -f -- "${files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m 'audit: private dedicated quarter and half aggregate research' >"$log" 2>&1
          for attempt in 1 2 3; do
            git fetch -q origin main >"$log" 2>&1
            git rebase -q origin/main >"$log" 2>&1 || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main >"$log" 2>&1; then echo 'PASS: private data archived.'; exit 0; fi
            sleep "$attempt"
          done
          exit 1
  status:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Public validation metadata only
        env:
          RESULT: ${{ needs.validate.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p data
          node -e 'require("fs").writeFileSync("data/dedicated-period-model-validation.json",JSON.stringify({kind:"dedicated_period_model_validation_v1",privateHead:"912a84b7a82088ef10fa9db7b053dc588ada2fd6",result:process.env.RESULT,runId:process.env.RUN_ID,recordedAt:new Date().toISOString(),calibrated:false,modelPromoted:false})+"\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dedicated-period-model-validation.json
          git commit -m 'status: private period model validation' >/dev/null
          for attempt in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

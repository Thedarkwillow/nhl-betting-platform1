name: Deploy NHL Independent Morning Scheduler to Cloudflare
on:
  workflow_dispatch:
  # One-time owner-authorized activation; data output commits cannot retrigger.
  push:
    branches: [main]
    paths:
      - 'scheduler/nhl-board-dispatcher/activation-20261107.txt'
permissions:
  contents: read
concurrency:
  group: deploy-nhl-independent-cloudflare-scheduler
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test DST, rate protection, external dispatch and failure safety
        run: |
          node --check scheduler/nhl-board-dispatcher/src/index.mjs
          node --test scheduler/nhl-board-dispatcher/test/dispatcher.test.mjs
          node --test test/nhl-daily-prospective-gate.test.cjs
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require three separately stored private credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NHL_EXTERNAL_GITHUB_PAT: ${{ secrets.NHL_EXTERNAL_GITHUB_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NHL_EXTERNAL_GITHUB_PAT; do
            if test -z "${!key}"; then
              echo "::error::Required repository Actions secret is missing: $key"
              exit 1
            fi
          done
      - name: Deploy independent Worker with UTC triggers mapped to Pacific clock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config scheduler/nhl-board-dispatcher/wrangler.jsonc
      - name: Install private fine-grained GitHub dispatch token in Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NHL_EXTERNAL_GITHUB_PAT: ${{ secrets.NHL_EXTERNAL_GITHUB_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NHL_EXTERNAL_GITHUB_PAT" |
            npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN --config scheduler/nhl-board-dispatcher/wrangler.jsonc
          echo 'Cloudflare NHL independent morning scheduler deployed; no PrizePicks API calls made.'
      - name: Verify Worker secret names, without reading values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config scheduler/nhl-board-dispatcher/wrangler.jsonc |
            grep -q 'GITHUB_DISPATCH_TOKEN'
          echo 'GITHUB_DISPATCH_TOKEN secret exists in Cloudflare Worker.'

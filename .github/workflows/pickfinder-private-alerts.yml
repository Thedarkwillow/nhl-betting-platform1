name: PickFinder private research alerts
on:
  pull_request:
    paths: ['scripts/pickfinder-alert-inbox.cjs','scripts/pickfinder-local-builder.cjs','test/pickfinder-local-tools.test.cjs','.github/workflows/pickfinder-private-alerts.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder-alert-inbox.cjs','scripts/pickfinder-local-builder.cjs','test/pickfinder-local-tools.test.cjs','.github/workflows/pickfinder-private-alerts.yml']
  workflow_dispatch:
  schedule:
    - cron: '54 6,9,12,16 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: pickfinder-private-alerts
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/pickfinder-local-tools.test.cjs test/pickfinder-combinations.test.cjs
  inbox:
    needs: test
    # Owner-directed private pause; restore original condition only when authorized:
    # if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Check private destination
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .permissions.push)" = true
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: archive
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Evaluate explicit committed private rules
        env:
          RESTRICTED_DESTINATION_VERIFIED: '1'
        run: node public/scripts/pickfinder-alert-inbox.cjs archive
      - name: Archive new private alert receipts
        working-directory: archive
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -d research/pickfinder-alert-inbox || exit 0
          git add -f research/pickfinder-alert-inbox
          git diff --cached --quiet && exit 0
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git config user.name 'Research archive automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'Archive private research alert receipts'
          for i in 1 2 3 4 5 6; do
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --quiet origin main
            git rebase --quiet FETCH_HEAD || { git rebase --abort; exit 1; }
            if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --quiet origin HEAD:main; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --quiet origin main
              git merge-base --is-ancestor HEAD FETCH_HEAD
              while IFS= read -r p; do
                test "$(git rev-parse "HEAD:$p")" = "$(git rev-parse "FETCH_HEAD:$p")"
              done < <(git diff-tree --no-commit-id --name-only -r HEAD)
              echo 'Private alert inbox archive verified.'
              exit 0
            fi
            sleep "$((i*2))"
          done
          exit 1

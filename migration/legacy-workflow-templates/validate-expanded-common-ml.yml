name: Validate expanded common ML research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/priority-expanded-ml-markets.json'
      - 'src/priority-common-ml-shadow-v1.cjs'
      - 'scripts/export-priority-component-features.cjs'
      - 'scripts/train-priority-common-ml-shadow.py'
      - '.github/workflows/validate-expanded-common-ml.yml'
  push:
    paths:
      - '.github/workflows/validate-expanded-common-ml.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression and syntax checks
        run: |
          node --check scripts/export-priority-component-features.cjs
          node --check scripts/freeze-partner-nhl-pregame.cjs
          node --test test/priority-common-ml-shadow-v1.test.cjs
          python -m py_compile scripts/train-priority-common-ml-shadow.py
      - name: Install research dependencies
        run: python -m pip install 'numpy<3' 'scikit-learn<2'
      - name: Historical export and separate synthetic holdout
        env:
          PRIORITY_EXPANDED_ML: '1'
        run: |
          node scripts/export-priority-component-features.cjs
          python scripts/train-priority-common-ml-shadow.py
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-ml-research-only
          path: outputs/research/priority-expanded-ml-artifact.json
          if-no-files-found: error

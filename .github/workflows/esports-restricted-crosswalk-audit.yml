name: Restricted esports crosswalk and history audit
on:
  pull_request:
    paths: ['scripts/esports_restricted_final_audit.py','scripts/esports_independent_crosswalk.py','test/test_esports_independent_crosswalk.py','scripts/esports_result_contract.py','test/test_esports_result_contract.py','scripts/public-opencs2-map-baseline.py','.github/workflows/esports-restricted-crosswalk-audit.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/esports-restricted-crosswalk-audit.yml','scripts/esports_restricted_final_audit.py']
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s test -p test_esports_scope_history.py
      - run: python3 -m unittest discover -s test -p test_esports_result_contract.py
      - run: python3 -m unittest discover -s test -p test_esports_independent_crosswalk.py
      - run: python3 -m unittest discover -s test -p test_cs2_restricted_history_join.py
  audit:
    needs: test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: research/esports-diagnostic-capture-20261124
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          path: restricted
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==19.0.1
      - name: Read restricted evidence and compare pinned history, aggregate only
        env:
          ESPORTS_CROSSWALK_CAPTURE: ${{ github.workspace }}/restricted/esports-diagnostic-capture-20261124/normalized.json
          ESPORTS_CROSSWALK_REVIEW: ${{ github.workspace }}/restricted/esports-diagnostic-capture-20261124/identity-review.json
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/esports-crosswalk-audit.log"
          trap 'rm -f "$log"' EXIT
          python scripts/public-opencs2-map-baseline.py >"$log" 2>&1
          python - "$log" <<'PY'
          import json,sys
          rows=[json.loads(s) for s in open(sys.argv[1]) if s.startswith("{")]
          matches=[r for r in rows if r.get("kind")=="restricted_esports_crosswalk_audit_v1"]
          assert len(matches)==1
          assert matches[0]["counts"]["received"]==5
          assert matches[0]["qualified"]==0
          assert matches[0]["originalForecastFrozen"] is False
          assert matches[0]["paidRequests"]==0
          print(json.dumps(matches[0]))
          scopes=[r for r in rows if r.get("kind")=="cs2_exact_scope_history_v1"]
          assert len(scopes)==1
          print(json.dumps(scopes[0]))
          diagnostic=[r for r in rows if r.get("kind")=="restricted_esports_regulation_history_diagnostic_v1"]
          assert len(diagnostic)==1
          print(json.dumps(diagnostic[0]))
          PY
  final-evidence:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: research/esports-diagnostic-capture-20261124
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          path: restricted
          persist-credentials: false
      - name: Audit official final evidence without printing restricted rows
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/esports-final-audit.log"
          trap 'rm -f "$log"' EXIT
          python3 scripts/esports_restricted_final_audit.py restricted/esports-diagnostic-capture-20261124 >"$log" 2>&1 || { echo "Final evidence audit failed closed"; exit 1; }
          cat "$log"

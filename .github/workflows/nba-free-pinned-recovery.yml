name: NBA free pinned source recovery audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==19.0.1
      - run: python scripts/recover-nba-pinned-parquet.py --private-research --output "$RUNNER_TEMP/nba-recovery"
      - name: Report bounded audit status
        run: python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"nba-recovery","schema-audit.json"); print("Schema audit generated:",os.path.isfile(p))'

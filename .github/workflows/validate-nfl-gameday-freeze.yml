name: Validate NFL pregame first-Git source and official identity risk gates
on:
  pull_request:
    paths:
      - '.github/workflows/validate-nfl-gameday-freeze.yml'
      - '.github/workflows/private-nfl-gameday-pregame-source.yml'
      - 'scripts/publish-safe-research-progress.cjs'
      - 'assets/roadmap-evidence-desk.js'
      - 'scripts/test-goblin-quality-public.cjs'
  push:
    branches: [main, 'feat/nfl-gameday-freeze-and-identity-evidence-1118']
    paths:
      - '.github/workflows/validate-nfl-gameday-freeze.yml'
      - '.github/workflows/private-nfl-gameday-pregame-source.yml'
      - 'scripts/publish-safe-research-progress.cjs'
      - 'assets/roadmap-evidence-desk.js'
      - 'scripts/test-goblin-quality-public.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public sanitized conditional injury and identity proof tests
        working-directory: public
        run: node --test scripts/test-goblin-quality-public.cjs scripts/test-roadmap-evidence-desk.cjs
      - name: Require existing private repository source permission
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: false
      - name: Check private source collectors and audits
        working-directory: private
        run: |
          set -euo pipefail
          node --check scripts/collect-nfl-gameday-source.cjs
          node --check scripts/verify-nfl-gameday-source.cjs
          node --check scripts/report-goblin-forward.cjs
          node --test \
            test/nfl-gameday-original-source.test.cjs \
            test/nfl-goblin-independent-injury-corroboration.test.cjs \
            test/nfl-goblin-free-identity-research.test.cjs \
            test/nfl-goblin-schedule-bridge.test.cjs \
            test/nfl-goblin-official-active-mentions.test.cjs \
            test/goblin-quality-odds-nfl-source-gaps.test.cjs
      - name: Ensure currently archived NFL source/roster provenance is real
        working-directory: private
        run: |
          node - <<'NODE'
          const {priorSchedule}=require('./scripts/collect-nfl-gameday-source.cjs');
          const schedule=priorSchedule(process.cwd(),new Date().toISOString());
          if(!schedule||schedule.length<200)
            throw Error('Existing first-Git NFL 2026 schedule not authenticated');
          const {gamesToFreeze}=require('./scripts/collect-nfl-gameday-source.cjs');
          const next=gamesToFreeze(schedule,'2026-11-19T23:50:00Z');
          if(!next.some(g=>g.gameId==='2026_11_IND_HOU'))
            throw Error('The actual archived Colts–Texans Thursday kickoff would not trigger pregame capture');
          console.log('PASS: Nov 19 Colts–Texans verified 3:50 PM Pacific source-freeze trigger');
          const h=require('./outputs/health/goblin-forward-latest.json');
          if(h.NFL?.identityReadyForNextModelStage!==0)
            throw Error('No direct authenticated PP-to-GSIS or gameday active status yet');
          console.log('PASS: schedule was already in Git; zero eligible NFL Goblin wagers');
          NODE

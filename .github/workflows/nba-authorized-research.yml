name: NBA isolated provider readiness and guarded research
on:
  push:
    branches: [main, nba-authorized-provider-deployment-20261124]
    paths: ['.github/workflows/nba-authorized-research.yml']
  workflow_dispatch:
    inputs:
      probe_accounts:
        description: 'Run configured account-only probes and noncharging estimates'
        type: boolean
        default: false
      collect_dunk_history:
        description: 'Authorize one historical data request costing at most 10 credits'
        type: boolean
        default: false
      dunk_player_id:
        description: 'DunkAPI native player ID'
        type: string
        default: '3112335'
      dunk_market:
        description: 'DunkAPI historical market'
        type: string
        default: 'player_points'
      dunk_from:
        description: 'First date (YYYY-MM-DD)'
        type: string
        default: '2026-11-01'
      dunk_to:
        description: 'Last date (YYYY-MM-DD), maximum 25 calendar days'
        type: string
        default: '2026-11-23'
  schedule:
    - cron: '35 6 * * *'
      timezone: America/Los_Angeles
    - cron: '35 9 * * *'
      timezone: America/Los_Angeles
    - cron: '15 15,16,18,19 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: nba-authorized-research-only
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline NBA source and prospective grading contracts
        run: |
          set -euo pipefail
          node --test test/nba-research-pipeline-v1.test.cjs test/nba-frozen-research-grade-v1.test.cjs test/nba-authorized-provider-access.test.cjs test/nba-alternate-providers.test.cjs
          node scripts/collect-nba-alternate-providers.cjs
          node scripts/run-nba-private-research-v1.cjs
          node scripts/grade-nba-frozen-research-v1.cjs
      - name: Report isolated NBA credential readiness
        env:
          NBA_SPORTSGAMEODDS_API_KEY: ${{ secrets.NBA_SPORTSGAMEODDS_API_KEY }}
          NBA_BALLDONTLIE_API_KEY: ${{ secrets.NBA_BALLDONTLIE_API_KEY }}
          NBA_DUNKAPI_API_KEY: ${{ secrets.NBA_DUNKAPI_API_KEY }}
          NBA_ODDS_SEPARATE_ACCOUNT_CONFIRMED: ${{ vars.NBA_ODDS_SEPARATE_ACCOUNT_CONFIRMED }}
          NBA_PROVIDER_PREFLIGHT_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_accounts && '1' || '0' }}
        run: node scripts/check-nba-authorized-provider-access.cjs
  research:
    needs: validation
    if: github.ref == 'refs/heads/main' && vars.NBA_DIRECT_SOURCE_AUTHORIZED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: archive
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source dependencies
        run: |
          python -m pip install 'pyarrow>=18,<24'
          command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
      - name: Confirm authorized private archive
        id: private_destination
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .private)" = true
          test "$(gh api repos/Thedarkwillow/nhl-betting-platform --jq .permissions.push)" = true
      - name: Independent NBA final-stat grading
        env:
          RESEARCH_ARCHIVE_ROOT: ${{ github.workspace }}/archive
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          node public/scripts/grade-nba-frozen-research-v1.cjs >"$log" 2>&1 || { echo "::warning::NBA grading unavailable; outcomes not inferred."; }
      - name: Preserve completed grade files before collection
        working-directory: archive
        run: |
          set -euo pipefail
          test -d outputs/nba/paper-grades || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nba/paper-grades
          git diff --cached --quiet && exit 0
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git commit -qm 'research: append independent NBA final-stat grades'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then
              git fetch -q origin main
              git merge-base --is-ancestor HEAD origin/main
              echo 'Private NBA grade commit verified on remote.'
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1
      - name: Checkout locked morning code
        if: ${{ github.event_name == 'schedule' && (github.event.schedule == '35 6 * * *' || github.event.schedule == '35 9 * * *') }}
        uses: actions/checkout@v4
        with:
          ref: f063be9e64f19028c59efbdcaf5b28f35210ea3d
          path: candidate
          persist-credentials: false
      - name: Verify morning collection lock and exact revision
        if: ${{ github.event_name == 'schedule' && (github.event.schedule == '35 6 * * *' || github.event.schedule == '35 9 * * *') }}
        env:
          SOURCE_SCHEDULE: ${{ github.event.schedule }}
        run: node public/scripts/morning-collection-lock-check.cjs archive candidate "$SOURCE_SCHEDULE"
      - name: Authorized NBA-only source capture
        env:
          NBA_DIRECT_SOURCE_AUTHORIZED: '1'
          NBA_HISTORICAL_MIRROR_RESEARCH: ${{ vars.NBA_MIRROR_SOURCE_AUTHORIZED == '1' && '1' || '0' }}
          NBA_ODDS_ENABLE: '0'
          LOCKED_MORNING: ${{ github.event_name == 'schedule' && (github.event.schedule == '35 6 * * *' || github.event.schedule == '35 9 * * *') }}
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          export RESEARCH_ARCHIVE_ROOT="$GITHUB_WORKSPACE/archive"
          code=public
          if [ "$LOCKED_MORNING" = true ]; then code=candidate; fi
          node "$code/scripts/run-nba-private-research-v1.cjs" >"$log" 2>&1 || { echo "::error::NBA collection failed closed."; exit 1; }
          node - "$log" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8').trim().split('\n').at(-1));
          if(r.kind!=='nba_isolated_research_readiness_v1'||r.sharedPaidProviderRequests!==0||r.actualWagersPlaced!==0||r.highConfidenceApproved!==0)throw Error('NBA research contract');
          console.log(JSON.stringify({status:r.status,boardRows:r.boardRows,rankedRows:r.rankedRows,officialScheduleGames:r.officialScheduleGames,highConfidenceApproved:r.highConfidenceApproved}));
          NODE
      - name: Preserve private NBA outputs only
        working-directory: archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -d outputs/nba || exit 0
          git add -f outputs/nba
          git diff --cached --quiet && exit 0
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git commit -qm 'research: append authorized private NBA observations'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then
              git fetch -q origin main
              git merge-base --is-ancestor HEAD origin/main
              echo 'Private NBA observation commit verified on remote.'
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1

  alternate_providers:
    needs: validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authorized free schedule and manually budgeted historical source
        env:
          NBA_BDL_FREE_SOURCE_ENABLED: '1'
          NBA_BALLDONTLIE_API_KEY: ${{ secrets.NBA_BALLDONTLIE_API_KEY }}
          NBA_DUNKAPI_API_KEY: ${{ secrets.NBA_DUNKAPI_API_KEY }}
          NBA_DUNK_ESTIMATE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && (inputs.probe_accounts || inputs.collect_dunk_history) && '1' || '0' }}
          NBA_DUNK_HISTORY_MANUAL_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.collect_dunk_history && '1' || '0' }}
          NBA_DUNK_PLAYER_ID: ${{ inputs.dunk_player_id }}
          NBA_DUNK_MARKET: ${{ inputs.dunk_market }}
          NBA_DUNK_FROM_DATE: ${{ inputs.dunk_from }}
          NBA_DUNK_TO_DATE: ${{ inputs.dunk_to }}
        run: |
          set -euo pipefail
          umask 077
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/collect-nba-alternate-providers.cjs
      - name: Archive NBA provider observations only
        run: |
          set -euo pipefail
          test -d outputs/nba/authorized-providers || exit 0
          git add -f outputs/nba/authorized-providers
          git diff --cached --quiet && exit 0
          git commit -qm 'research: private NBA alternate provider observations'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1

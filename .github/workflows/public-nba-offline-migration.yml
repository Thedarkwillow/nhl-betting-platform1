name: Public NBA offline migration and workflow inventory
on:
  pull_request:
    paths: ['.github/workflows/public-nba-offline-migration.yml','scripts/public-workflow-migration-inventory.cjs','test/nba-*.test.cjs']
  push:
    branches: [main]
    paths: ['.github/workflows/public-nba-offline-migration.yml','scripts/public-workflow-migration-inventory.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public copies of NBA research contracts with no secrets
        run: node --test test/nba-research-pipeline-v1.test.cjs test/nba-frozen-research-grade-v1.test.cjs test/nba-authorized-provider-access.test.cjs test/nba-alternate-providers.test.cjs
      - name: Recount remaining private workflow references
        run: node scripts/public-workflow-migration-inventory.cjs

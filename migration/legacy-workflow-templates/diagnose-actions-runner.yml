name: Diagnose GitHub Actions Hosted Runner Access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-actions-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner provisioned
        run: |
          echo "GitHub-hosted runner is running"
          date -u

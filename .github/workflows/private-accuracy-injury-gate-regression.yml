name: Private accuracy and injury gate regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-accuracy-injury-gate-regression.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic-only direction, injury, lineup and historical review contracts
        run: |
          set -euo pipefail
          node --test test/nfl-directional-v2-prospective.test.cjs test/nfl-directional-v2-forward-grade.test.cjs test/nfl-directional-first-threshold-review.test.cjs test/nhl-official-preview-abstention.test.cjs test/nhl-lineup-revalidation.test.cjs test/nhl-lineup-optimizer.test.cjs test/availability-tier-lineup-gates.test.cjs

name: Esports compact zero-credit preflight
on:
  pull_request:
    paths: ['scripts/esports-compact-free-preflight.cjs','src/independent-provider-export-v1.cjs','.github/workflows/esports-compact-free-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/independent-provider-export-v1.test.cjs
      - run: node scripts/esports-compact-free-preflight.cjs

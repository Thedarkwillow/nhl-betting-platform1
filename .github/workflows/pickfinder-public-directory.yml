name: PickFinder public specialist directory collection
on:
  pull_request:
    paths: ['scripts/pickfinder-public-directory.py','.github/workflows/pickfinder-public-directory.yml']
  push:
    branches: [main]
    paths: ['scripts/pickfinder-public-directory.py','.github/workflows/pickfinder-public-directory.yml']
  workflow_dispatch:
  schedule:
    - cron: '22 5,8,11,14,17,20 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: pickfinder-public-directory
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python scripts/pickfinder-public-directory.py --test
  collect:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PICKFINDER_AUTOMATION_AUTHORIZED == '1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resume authorized public pages
        env:
          PICKFINDER_PUBLIC_DATA_AUTHORIZED: '1'
        run: python scripts/pickfinder-public-directory.py .
      - name: Append only sporting evidence
        run: |
          set -euo pipefail
          dir=research/pickfinder-public-directory-v3
          test -d "$dir" || exit 0
          git add -f "$dir"
          git diff --cached --quiet && exit 0
          test -z "$(git diff --cached --name-only --diff-filter=CDMRTUXB)"
          git config user.name 'Public sports evidence runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'Append authorized public research directory pages'
          for i in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            git rebase --quiet FETCH_HEAD || { git rebase --abort; exit 1; }
            if git push --quiet origin HEAD:main; then
              git fetch --quiet origin main
              git merge-base --is-ancestor HEAD FETCH_HEAD
              while IFS= read -r p; do
                test "$(git rev-parse "HEAD:$p")" = "$(git rev-parse "FETCH_HEAD:$p")"
              done < <(git diff-tree --no-commit-id --name-only -r HEAD)
              echo 'Public directory evidence remote digest verified.'
              exit 0
            fi
            sleep "$((i*2))"
          done
          exit 1

name: Audit Historical PrizePicks NHL Outcomes
# Verify parsed team-scoped OddsPapi player identities against final NHL boxscores.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Expand Two-Season Historical PrizePicks NHL Archive']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: odds-papi-player-identity-one-time
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify identity and historical grading safety
        run: |
          node --test test/oddspapi-historical-identity.test.cjs test/oddspapi-audit-runner.test.cjs
      - name: Resolve OddsPapi player IDs and official NHL results
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: node scripts/audit-oddspapi-nhl-history.cjs
      - name: Archive historical line outcomes without claiming past picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/oddspapi/nhl/outcome-audit-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: audit historical PrizePicks line outcomes against official NHL results"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: odds-papi-nhl-outcome-audit
          path: outputs/oddspapi/nhl/outcome-audit-latest.json
          if-no-files-found: ignore

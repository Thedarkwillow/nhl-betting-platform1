name: Validate Public NHL Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'fix/**', 'feat/**', 'research/**']
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data.json'
      - 'scripts/collect-public-nhl-games.cjs'
      - 'scripts/test-public-nhl-games.cjs'
      - '.github/workflows/collect-public-nhl-games.yml'
      - 'scripts/validate-dashboard.cjs'
      - 'scripts/test-daily-ranking-readiness.cjs'
      - 'scripts/test-lineup-workspace.cjs'
      - 'scripts/test-six-priority-desk.cjs'
      - 'scripts/test-multi-sport-roadmap.cjs'
      - 'data/nhl-nfl-freeze-status.json'
      - 'data/model-scorecards.json'
      - 'data/source-line-movement.json'
      - 'scripts/publish-safe-nhl-nfl-line-movement.cjs'
      - 'scripts/test-publish-safe-nhl-nfl-line-movement.cjs'
      - 'scripts/publish-safe-pregame-scorecards.cjs'
      - 'scripts/test-publish-safe-pregame-scorecards.cjs'
      - 'scripts/test-research-progress-autopublish.cjs'
      - 'scripts/test-progress-concurrent-publication.cjs'
      - '.github/workflows/private-position-matchup-v2.yml'
      - 'scripts/test-nfl-matchup-evidence-archival.cjs'
      - '.github/workflows/publish-safe-research-progress.yml'
      - 'scripts/publish-safe-nfl-research-cards.cjs'
      - 'scripts/test-publish-safe-nfl-research-cards.cjs'
      - '.github/workflows/publish-nfl-independent-coverage.yml'
      - '.github/workflows/refresh-allowlisted-nhl-rankings.yml'
      - '.github/workflows/verified-independent-nhl-capture.yml'
      - 'scripts/test-model-scorecards.cjs'
      - 'scripts/test-public-capture-schedule.cjs'
      - 'scripts/test-nhl-backfill-failure-preservation.cjs'
      - '.github/workflows/private-nhl-period-backfill.yml'
      - 'scripts/test-fresh-ranking-schedule.cjs'
      - 'scripts/pacific-morning-capture-gate.cjs'
      - 'scripts/test-pacific-morning-capture-gate.cjs'
      - 'scripts/audit-private-morning-archives.cjs'
      - 'scripts/test-audit-private-morning-archives.cjs'
      - 'scheduler/nhl-board-dispatcher/**'
      - '.github/workflows/public-private-nhl-nfl-0900.yml'
      - '.github/workflows/validate-dashboard.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test public game-status normalization and provenance guards
        run: node --test scripts/test-public-nhl-games.cjs
      - name: Verify public NHL page JavaScript and research provenance
        run: node scripts/validate-dashboard.cjs
      - name: Test interactive NHL research lineup editor
        run: node scripts/test-lineup-workspace.cjs
      - name: Verify independent board captures never imply publicly approved picks
        run: node --test scripts/test-daily-ranking-readiness.cjs
      - name: Test seven-area public status, freshness and comparison safety
        run: node scripts/test-research-status.cjs
      - name: Test phone-ready six-roadmap evidence, freshness and unverified payout safeguards
        run: node scripts/test-six-priority-desk.cjs
      - name: Test NHL NFL sport selector, verified precommit status and stale-source warnings
        run: node --test scripts/test-multi-sport-roadmap.cjs
      - name: Test public NHL NFL original-precommit model grades and sanitized release
        run: node --test scripts/test-model-scorecards.cjs scripts/test-publish-safe-pregame-scorecards.cjs
      - name: Validate historical NHL NFL position matching and game-cluster archive
        run: node --test scripts/test-nfl-matchup-evidence-archival.cjs
      - name: Check safe automatic NHL backfill progress propagation
        run: node --test scripts/test-research-progress-autopublish.cjs scripts/test-progress-concurrent-publication.cjs scripts/test-publish-safe-research-progress.cjs
      - name: Test consolidated source evidence and historical chart
        run: node --test scripts/test-roadmap-evidence-desk.cjs
      - name: Test capped NFL card publishing and current injury veto
        run: node --test scripts/test-publish-safe-nfl-research-cards.cjs
      - name: Verify NHL NFL cross-day/same-day source line movement without private data leaks
        run: node --test scripts/test-publish-safe-nhl-nfl-line-movement.cjs
      - name: Confirm NHL failed historical collection archives partial evidence before red status
        run: node --test scripts/test-nhl-backfill-failure-preservation.cjs
      - name: Verify all daily NHL NFL actual-source slot, fail-closed archive, and Cloudflare backup safeguards
        run: |
          node --test scripts/test-public-capture-schedule.cjs \
            scripts/test-fresh-ranking-schedule.cjs \
            scripts/test-pacific-morning-capture-gate.cjs \
            scripts/test-audit-private-morning-archives.cjs
          node --test scheduler/nhl-board-dispatcher/test/dispatcher.test.mjs

name: Private isolated NBA research collection and official grading
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6,9 * * *'
      timezone: America/Los_Angeles
    - cron: '15 15,16,18,19 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: isolated-nba-private-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main' && vars.NBA_SOURCE_USE_AUTHORIZED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # NBA data use must be explicitly cleared for the intended research and betting-related purpose.
      # Do not set the authorization variable based merely on public accessibility or a mirror license.
      - name: Validate isolated NBA contracts
        run: |
          set -euo pipefail
          node --test test/nba-research-pipeline-v1.test.cjs test/nba-frozen-research-grade-v1.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private historical and PDF dependencies
        run: |
          python -m pip install 'pyarrow>=18,<24'
          command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
      - name: Collect and grade private NBA research (shared metered odds disabled)
        env:
          NBA_ODDS_ENABLE: '0'
          NBA_HISTORICAL_MIRROR_RESEARCH: '1'
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          node scripts/grade-nba-frozen-research-v1.cjs >"$log" 2>&1 || { echo "::warning::Official NBA grading unavailable; no outcomes inferred."; }
          node scripts/run-nba-private-research-v1.cjs >"$log" 2>&1 || { echo "::error::NBA research failed closed."; exit 1; }
          node - "$log" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8').trim().split('\n').at(-1));
          if(r.kind!=='nba_isolated_research_readiness_v1'||r.sharedPaidProviderRequests!==0||r.actualWagersPlaced!==0||r.highConfidenceApproved!==0)throw Error('NBA research contract');
          console.log(JSON.stringify(r));
          NODE
      - name: Archive NBA only with non-force Git sync and retries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nba
          git diff --cached --quiet && exit 0
          git commit -qm 'research: isolated private NBA actual-time observations and final-only grades'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::NBA publish conflict; no overwrite."; exit 1; }
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1

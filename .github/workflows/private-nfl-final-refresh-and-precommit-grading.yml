# Include Friday after Thursday Night Football to evaluate settled pregame directions.
# 2026-11-10: postgame nflverse refresh and original first-Git NFL frozen directional grade attempt.
# Model branch merged: verify private main NFL original + matchup shadow grading.
name: NFL archived pregame forecast and finals grading via public free runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/private-nfl-final-refresh-and-precommit-grading.yml']
  schedule:
    - cron: '40 5 * * 1,2,5'
      timezone: America/Los_Angeles
permissions:
  contents: read
concurrency:
  group: nfl-current-season-final-grading-private-only
  cancel-in-progress: false
jobs:
  refresh-and-grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private repo authorization
        env:
          TOKEN: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Private research checkout unavailable"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: main
          path: private
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test precommitted NFL source and outcome integrity before fetching
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          node --test test/nfl-precommitted-grading.test.cjs test/nfl-prospective-freeze.test.cjs test/nfl-frozen-direction-diagnostic.test.cjs test/nfl-prospective-shadow.test.cjs test/nfl-shadow-postgame-grade.test.cjs test/nfl-pregame-matchup-challenger.test.cjs test/nfl-matchup-shadow-grading.test.cjs test/nfl-independent-forward-evidence.test.cjs test/forward-evidence-reliability.test.cjs test/nfl-directional-v2-prospective.test.cjs test/nfl-directional-v2-forward-grade.test.cjs test/nfl-market-usage-selective-future.test.cjs test/nfl-directional-first-threshold-review.test.cjs test/nfl-directional-bias-cluster-audit.test.cjs >"$log" 2>&1 ||
            { echo "::error::NFL original chronology or grading regression"; exit 1; }
          python -m unittest discover -s test -p 'test_nfl_2026_refresh.py' >"$log" 2>&1 ||
            { echo "::error::NFL history preservation regression"; exit 1; }
          echo "PASS: original pregame NFL chronology and source-preservation tests."
      - name: Install no-cost public nflverse client
        run: python -m pip install 'nflreadpy>=0.1,<2' --quiet
      - name: Try to refresh 2026 official-derived weekly results without erasing prior seasons
        id: refresh
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if python scripts/refresh-nfl-2026-final-history.py >"$log" 2>&1; then
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
            echo "PASS: 2026 NFL weekly/schedule research history refreshed; provider settlements NOT verified."
          else
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fresh nflverse results unavailable or incomplete; immutable previous archive retained. Grader runs pending-safe."
            # Restore any in-memory partial files if history refresh failed.
            git restore -- outputs/nfl/history/2026/player_weekly.json.gz outputs/nfl/history/2026/schedule.json.gz outputs/nfl/history/2026/weekly_rosters.json.gz outputs/nfl/history/2026/snap_counts.json.gz outputs/nfl/history/2026/team_weekly.json.gz outputs/nfl/history/2026/kicking_pbp.json.gz outputs/nfl/history/2026/pbp_specialty_events.json.gz outputs/nfl/history/manifest.json
          fi
      - name: Apply validated one-time 2024 and 2025 drive metadata backfill
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if node -e 'process.exit(require("./outputs/nfl/history/manifest.json").specialistDriveBackfillAt ? 0 : 1)'; then
            echo "Historical drive metadata already archived."
            exit 0
          fi
          saved="$(mktemp)"; log="$(mktemp)"; trap 'rm -f "$saved" "$log"' EXIT
          cp outputs/nfl/history/manifest.json "$saved"
          if ! python scripts/backfill-nfl-specialist-drive-metadata.py >"$log" 2>&1; then
            git restore -- outputs/nfl/history/2024/pbp_specialty_events.json.gz outputs/nfl/history/2025/pbp_specialty_events.json.gz
            cp "$saved" outputs/nfl/history/manifest.json
            echo "::error::Validated historical backfill did not pass live source identity checks; archived history retained."
            exit 1
          fi
          echo "PASS: prior-season specialist metadata enriched with original game/play identities preserved."
      - name: Grade only first-Git-original numeric and explicit directional NFL research
        working-directory: private
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node scripts/grade-nfl-precommitted.cjs >"$log" 2>&1; then
            echo "::error::NFL precommitted outcome audit failed; no success claim."
            exit 1
          fi
          # Only first-Git original and future-abstention evidence, never
          # backdated directional preferences or player-level public output.
          for report in scripts/report-nfl-frozen-direction-diagnostic.cjs scripts/report-nfl-shadow-postgame.cjs scripts/report-nfl-matchup-shadow.cjs scripts/report-nfl-independent-forward.cjs scripts/report-nfl-directional-v2-forward.cjs scripts/report-nfl-directional-first-threshold-review.cjs scripts/report-cross-sport-position-h2h-replay.cjs; do
            if ! node "$report" >"$log" 2>&1; then
              echo "::error::NFL first-Git-safe postgame report failed at: $report"
              # Never print raw private player quotes or private tracebacks into public runner logs.
              exit 1
            fi
            echo "PASS: completed private NFL research-only stage: $report"
          done
          node - <<'NODE'
          const r=require('./outputs/nfl/backtests/pregame-forecast-proof-latest.json');
          if(r.kind!=='nfl_private_pregame_evidence_separated_outcome_audit_v1'||
             r.nflverseFinalStatsNotPlatformSettlement!==true||
             r.neverClaimNumericSideAsPreviouslyFrozenHigherLower!==true||
             r.explicitFrozenDirections?.platformPayoutSettlementsVerified!==false||
             r.explicitFrozenDirections?.firstDistinctThresholdGrade?.kind!=='nfl_original_first_distinct_threshold_official_stat_audit_v1'||
             r.explicitFrozenDirections?.firstDistinctThresholdGrade?.releaseApproved!==false||
             require('./outputs/nfl/backtests/frozen-direction-bias-diagnostic-latest.json').productionModelPromotionApproved!==false||
             require('./outputs/nfl/backtests/frozen-shadow-prospective-grading-latest.json').payoutAdjustedEV!==null||
             require('./outputs/nfl/backtests/matchup-context-forward-grade-latest.json').productionChampionUnchanged!==true)
           throw Error('NFL evidence classification missing');
          console.log(JSON.stringify({numericDecided:r.numeric.decided,
             frozenSelectedDecided:r.explicitFrozenDirections.decided,
             frozenStillPending:r.explicitFrozenDirections.pending,
             distinctThresholdDecided:r.explicitFrozenDirections.firstDistinctThresholdGrade.earliestPerPlayerGameMarketAndLine.decided,
             distinctThresholdCorrect:r.explicitFrozenDirections.firstDistinctThresholdGrade.earliestPerPlayerGameMarketAndLine.correct,
             officialSettlementVerified:false,calibrated:false}));
          NODE
      - name: Diagnose most recent Sunday unresolved NFL player appearances from archived IDs
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Diagnostic only; no zero imputation, name-based grade changes,
          # retrospective model direction, or platform DNP settlement.
          day="$(TZ=America/Los_Angeles date -d 'last sunday' '+%Y-%m-%d')"
          echo "NFL official Sunday identity audit for $day"
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! node scripts/audit-nfl-unresolved-appearances.cjs "$day" >"$log" 2>&1; then
            echo "::warning::NFL Sunday player-appearance diagnostic unavailable; original grade remains immutable."
          else
            echo "PASS: archived diagnostic of missing NFL player appearances; no unverified refunds."
            printf 'SUNDAY_AUDIT_DATE=%s\n' "$day" >> "$GITHUB_ENV"
          fi
      - name: Commit source-refresh and graded forecast report privately only
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/nfl/history/2024/pbp_specialty_events.json.gz outputs/nfl/history/2025/pbp_specialty_events.json.gz
          git add -f outputs/nfl/history/manifest.json outputs/nfl/history/2026/player_weekly.json.gz outputs/nfl/history/2026/schedule.json.gz outputs/nfl/history/2026/weekly_rosters.json.gz outputs/nfl/history/2026/snap_counts.json.gz outputs/nfl/history/2026/team_weekly.json.gz outputs/nfl/history/2026/kicking_pbp.json.gz outputs/nfl/history/2026/pbp_specialty_events.json.gz outputs/health/cross-sport-position-h2h-replay-latest.json outputs/nfl/backtests/pregame-forecast-proof-latest.json outputs/nfl/backtests/frozen-direction-bias-diagnostic-latest.json outputs/nfl/backtests/frozen-shadow-prospective-grading-latest.json outputs/nfl/backtests/matchup-context-forward-grade-latest.json outputs/nfl/backtests/independent-source-forward-latest.json outputs/nfl/backtests/directional-v2-future-only-latest.json outputs/nfl/backtests/directional-first-threshold-review-latest.json
          if test -n "${SUNDAY_AUDIT_DATE:-}"; then
            git add -f "outputs/nfl/backtests/unresolved-appearance-$SUNDAY_AUDIT_DATE.json" "outputs/nfl/backtests/unresolved-identity-review-$SUNDAY_AUDIT_DATE.json"
          fi
          if git diff --cached --quiet; then
            echo "PASS: NFL private report unchanged."
            exit 0
          fi
          git commit -m "audit(nfl): strictly original-pregame forecasts versus current final statistics" >/dev/null
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git -c rebase.autoStash=true rebase -q -X theirs origin/main
            if git push -q origin HEAD:main; then
              echo "PASS: official-stat-only NFL grading privately archived; not app settlement."
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::NFL private grading report archival failed"
          exit 1


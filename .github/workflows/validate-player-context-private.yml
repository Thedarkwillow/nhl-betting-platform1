name: Validate private player context evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-player-context-private.yml']
permissions:
  contents: read
concurrency:
  group: private-player-context-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Thedarkwillow/nhl-betting-platform
          ref: 8ea524c8c85a000049a5e151ed4dbbf67d1f0d
          token: ${{ secrets.PRIVATE_RESEARCH_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private tests and cached report validation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = 8ea524c8c85a000049a5e151ed4dbbf67d1f0d
          log="$(mktemp)"; trap 'rm -f "$log"' EXIT
          if ! npm test >"$log" 2>&1; then echo '::error::Private regression failed'; exit 1; fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$log"
          for script in scripts/report-nhl-standard-forward-improvement.cjs scripts/report-nfl-independent-forward.cjs; do
            if ! node "$script" >"$log" 2>&1; then echo '::error::Cached report validation failed'; exit 1; fi
          done
          node - <<'NODE'
          const n=require('./outputs/health/nhl-standard-forward-improvement-latest.json'),f=require('./outputs/nfl/backtests/independent-source-forward-latest.json');
          if(n.playerContextCoverage?.kind!=='nhl_player_context_coverage_v1'||n.positionDefenseAblation?.kind!=='nhl_position_defense_ablation_v1'||f.playerContextCoverage?.kind!=='nfl_player_context_coverage_v1')throw Error('Missing report evidence');
          console.log('PASS: private context report structure verified.');
          NODE

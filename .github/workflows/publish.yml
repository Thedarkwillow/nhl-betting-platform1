name: Publish NHL Dashboard
on:
  workflow_dispatch:
  # GitHub Actions GITHUB_TOKEN commits do not reliably trigger push workflows.
  # Completed trusted publishers explicitly redeploy the counts-only website.
  workflow_run:
    workflows:
      - 'Publish sanitized NHL NFL frozen model scorecards'
      - 'Publish sanitized NHL NFL model and history research progress'
      - 'Publish honest NHL NFL six nine AM board health'
      - 'Verify both original NFL NHL freezes and publish safe status'
      - 'Record daily NHL NFL source line moves and publish counts'
      - 'Refresh allowlisted NHL public research rankings'
      - 'Publish safe NFL independent research coverage'
      - 'Validate Accuracy And Platform Evidence Dashboard'
      - 'Public PrizePicks model ranking research'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data.json'
      - 'data/nhl-nfl-freeze-status.json'
      - 'data/collection-health.json'
      - 'data/model-scorecards.json'
      - 'data/research-evidence-progress.json'
      - 'data/accuracy-platform-evidence.json'
      - 'data/source-line-movement.json'
      - 'data/nfl-independent-coverage.json'
      - 'data/public-multi-sport-sprint.json'
      - 'data/prizepicks-model-rankings.json'
      - 'nhl-games.json'
      - '.github/workflows/publish.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage only public dashboard files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html data.json nhl-games.json "$RUNNER_TEMP/site/"
          cp -R assets data "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/data/accuracy-platform-evidence.json"
          test -z "$(find "$RUNNER_TEMP/site" -type l -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
          name: github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 2 4 8 16 32; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts | map(select(.name == "github-pages" and .expired == false)) | length' | grep -qx 1; then
              exit 0
            fi
            sleep "$delay"
          done
          echo "::error::Pages artifact not visible after bounded checks"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

name: Public-only PickFinder research validation
on:
  pull_request:
    paths: ['src/native-workload-matchup-challenger.cjs','scripts/native-context-prospective-pairs.cjs','scripts/prospective-game-comparison.cjs','scripts/publish-pickfinder-derived.cjs','test/publish-pickfinder-derived.test.cjs','scripts/report-native-workload-matchup.cjs','test/native-workload-matchup-challenger.test.cjs','assets/native-context-performance.js','scripts/pickfinder-forecast-archive-gate.cjs','test/pickfinder-forecast-archive-gate.test.cjs','scripts/nba-official-web-boxscore.cjs','scripts/pickfinder-nba-official-availability.cjs','scripts/nba-bounded-official-final.cjs','test/nba-bounded-official-final.test.cjs','scripts/pickfinder-public-evidence-audit.cjs','scripts/pickfinder-public-model-validation.cjs','scripts/rolling-probability-performance.cjs','test/rolling-probability-performance.test.cjs','test/pickfinder-public-model-validation.test.cjs','.github/workflows/pickfinder-public-model-validation.yml']
  push:
    branches: [main]
    paths: ['src/native-workload-matchup-challenger.cjs','scripts/native-context-prospective-pairs.cjs','scripts/prospective-game-comparison.cjs','scripts/publish-pickfinder-derived.cjs','test/publish-pickfinder-derived.test.cjs','scripts/report-native-workload-matchup.cjs','test/native-workload-matchup-challenger.test.cjs','assets/native-context-performance.js','scripts/pickfinder-forecast-archive-gate.cjs','test/pickfinder-forecast-archive-gate.test.cjs','scripts/nba-official-web-boxscore.cjs','scripts/pickfinder-nba-official-availability.cjs','scripts/nba-bounded-official-final.cjs','test/nba-bounded-official-final.test.cjs','scripts/pickfinder-public-evidence-audit.cjs','scripts/pickfinder-public-model-validation.cjs','scripts/rolling-probability-performance.cjs','test/rolling-probability-performance.test.cjs','.github/workflows/pickfinder-public-model-validation.yml']
  schedule:
    - cron: '35 5,7,10,13,17,23 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pickfinder-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test test/publish-pickfinder-derived.test.cjs test/native-workload-matchup-challenger.test.cjs test/pickfinder-forecast-archive-gate.test.cjs test/nba-bounded-official-final.test.cjs test/rolling-probability-performance.test.cjs test/pickfinder-public-model-validation.test.cjs test/nba-research-pipeline-v1.test.cjs test/pickfinder-quote-features.test.cjs
  validate:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/pickfinder-public-model-validation.cjs .
      - name: Archive public research report and verified source evidence
        run: |
          set -euo pipefail
          if test -d research/pickfinder-public-validation-v1; then git add -f research/pickfinder-public-validation-v1; fi
          node scripts/publish-pickfinder-derived.cjs data/pickfinder-public-research-health.json
